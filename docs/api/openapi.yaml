      type: object
      description: 초안 반영 결과
      required:
        - appliedCount
        - skippedCount
        - results
      properties:
        appliedCount:
          type: integer
          format: int32
          description: 줄거리를 바꾼 건수
        skippedCount:
          type: integer
          format: int32
          description: 건너뛴 건수
        results:
          type: array
          description: 초안별 결과
          items:
            $ref: '#/components/schemas/ApplyOverviewDraftItem'
      example:
        appliedCount: 1
        skippedCount: 1
        results:
          - draftId: 3f2b8c1e-5d4a-4c6b-9a7e-1b2c3d4e5f60
            titleId: 1024
            outcome: APPLIED
            reason: null
          - draftId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            titleId: 2048
            outcome: SKIPPED
            reason: ORIGINAL_CHANGED
