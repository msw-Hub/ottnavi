            - { ottServiceId: 2, status: NOT_AVAILABLE }
            - { ottServiceId: 3, status: NOT_AVAILABLE }
            - { ottServiceId: 4, status: NOT_AVAILABLE }
            - { ottServiceId: 5, status: NOT_AVAILABLE }
            - { ottServiceId: 6, status: UNKNOWN }
            - { ottServiceId: 7, status: UNKNOWN }
          seasons:
            - seasonNumber: 1
              name: 시즌 1
              episodeCount: 9
              airYear: 2021
              totalRuntimeMin: 500
              isRuntimeEstimated: false
              availabilities:
                - { ottServiceId: 1, status: AVAILABLE }
                - { ottServiceId: 2, status: NOT_AVAILABLE }
                - { ottServiceId: 3, status: NOT_AVAILABLE }
                - { ottServiceId: 4, status: NOT_AVAILABLE }
                - { ottServiceId: 5, status: NOT_AVAILABLE }
                - { ottServiceId: 6, status: UNKNOWN }
                - { ottServiceId: 7, status: UNKNOWN }
            - seasonNumber: 2
              name: 시즌 2
              episodeCount: 7
              airYear: 2024
              totalRuntimeMin: 425
              isRuntimeEstimated: false
              availabilities:
                - { ottServiceId: 1, status: AVAILABLE }
                - { ottServiceId: 2, status: NOT_AVAILABLE }
                - { ottServiceId: 3, status: NOT_AVAILABLE }
                - { ottServiceId: 4, status: NOT_AVAILABLE }
                - { ottServiceId: 5, status: NOT_AVAILABLE }
                - { ottServiceId: 6, status: UNKNOWN }
                - { ottServiceId: 7, status: UNKNOWN }
          dataAsOf: '2026-10-08'

    # ----- wishlist -----
    WishlistItem:
      type: object
      description: 찜 목록의 한 항목. 드라마는 시즌 단위다(R11-19)
      required:
        - wishlistItemId
        - mediaType
        - tmdbId
        - title
        - posterPath
        - seasonNumber
        - seasonName
        - priority
        - requiredMin
        - isRuntimeEstimated
        - availabilities
        - isWatchableNow
        - watchedAt
      properties:
        wishlistItemId:
          type: integer
          format: int64
          description: 찜 항목 ID(변경·삭제 경로에 쓴다)
        mediaType:
          $ref: '#/components/schemas/MediaType'
        tmdbId:
          type: integer
          format: int64
          description: TMDB ID
        title:
          type: string
          description: 한국어 제목
        posterPath:
          type: string
          nullable: true
          description: TMDB 포스터 상대 경로. 없으면 null
        seasonNumber:
          type: integer
          format: int32
          nullable: true
          description: 드라마 시즌 번호. 영화는 null
        seasonName:
          type: string
          nullable: true
          description: 시즌 이름(예 "시즌 2"). 영화는 null
        priority:
          $ref: '#/components/schemas/WishlistPriority'
        requiredMin:
          type: integer
          format: int32
          description: 다 보는 데 필요한 시간(분). 드라마는 그 시즌의 총 시간
        isRuntimeEstimated:
          type: boolean
          description: requiredMin이 추정값인지("추정" 표시)
        availabilities:
          type: array
          description: 서비스별 제공 상태(7개). 드라마는 그 시즌 기준
          items:
            $ref: '#/components/schemas/ServiceAvailability'
        isWatchableNow:
          type: boolean
          description: 내가 구독 중(SUBSCRIBED)이거나 무료 이용(FREE) 중인 서비스에서 이미 볼 수 있는지
        watchedAt:
          type: string
          format: date-time
          nullable: true
          description: '"다 봤음"으로 표시한 시각. 안 봤으면 null. 값이 있으면 계산과 개수 상한에서 빠진다'
    WishlistItemList:
      type: object
      description: 내 찜 목록(최근에 찜한 순, 전부)
      required:
        - items
        - activeItemCount
        - maxActiveItemCount
        - dataAsOf
      properties:
        items:
          type: array
          description: 찜 항목들. 없으면 빈 배열
          items:
            $ref: '#/components/schemas/WishlistItem'
        activeItemCount:
          type: integer
          format: int32
          description: 상한에 세는 현재 찜 개수("다 봤음" 제외)
        maxActiveItemCount:
          type: integer
          format: int32
          description: 찜 상한(20, PRD 11절 36번)
        dataAsOf:
          type: string
          format: date
          description: 제공 상태의 데이터 기준일
    CommonResponseWishlistItemList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/WishlistItemList'
      example:
        success: true
        data:
          items:
            - wishlistItemId: 12
              mediaType: tv
              tmdbId: 93405
              title: 오징어 게임
              posterPath: /dDlEmu3EZ0Pgg93K2SVNLCjCSvE.jpg
              seasonNumber: 1
              seasonName: 시즌 1
              priority: MUST
              requiredMin: 500
              isRuntimeEstimated: false
              availabilities:
                - { ottServiceId: 1, status: AVAILABLE }
                - { ottServiceId: 2, status: NOT_AVAILABLE }
                - { ottServiceId: 3, status: NOT_AVAILABLE }
                - { ottServiceId: 4, status: NOT_AVAILABLE }
                - { ottServiceId: 5, status: NOT_AVAILABLE }
                - { ottServiceId: 6, status: UNKNOWN }
                - { ottServiceId: 7, status: UNKNOWN }
              isWatchableNow: true
              watchedAt: null
            - wishlistItemId: 11
              mediaType: movie
              tmdbId: 496243
              title: 기생충
              posterPath: /mSi0gskYpmf1FbXngM37s2HppXh.jpg
              seasonNumber: null
              seasonName: null
              priority: WANT
              requiredMin: 133
              isRuntimeEstimated: false
              availabilities:
                - { ottServiceId: 1, status: NOT_AVAILABLE }
                - { ottServiceId: 2, status: NOT_AVAILABLE }
                - { ottServiceId: 3, status: UNKNOWN }
                - { ottServiceId: 4, status: AVAILABLE }
                - { ottServiceId: 5, status: AVAILABLE }
                - { ottServiceId: 6, status: AVAILABLE }
                - { ottServiceId: 7, status: UNKNOWN }
              isWatchableNow: true
              watchedAt: '2026-10-10T21:30:00+09:00'
          activeItemCount: 1
          maxActiveItemCount: 20
          dataAsOf: '2026-10-08'
    AddWishlistItemRequest:
      type: object
      description: 찜 추가 요청
      required:
        - mediaType
        - tmdbId
        - seasonNumber
        - priority
      properties:
        mediaType:
          $ref: '#/components/schemas/MediaType'
        tmdbId:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: TMDB ID
        seasonNumber:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: 드라마(tv)는 찜할 시즌 번호(필수, 1부터. 시즌 0 스페셜은 수집하지 않는다, ERD watch_unit), 영화는 null
        priority:
          $ref: '#/components/schemas/WishlistPriority'
      example:
        mediaType: tv
        tmdbId: 93405
        seasonNumber: 1
        priority: MUST
    AddWishlistItemResult:
      type: object
      description: 찜 추가 결과. 이미 찜한 작품(시즌)이면 기존 항목 ID다
      required:
        - wishlistItemId
      properties:
        wishlistItemId:
          type: integer
          format: int64
          description: 찜 항목 ID
    CommonResponseAddWishlistItemResult:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AddWishlistItemResult'
      example:
        success: true
        data:
          wishlistItemId: 12
    UpdateWishlistItemRequest:
      type: object
      description: 찜 항목 변경 요청. 보낸 필드만 바꾼다(하나 이상 필요)
      minProperties: 1
      properties:
        priority:
          $ref: '#/components/schemas/WishlistPriority'
        isWatched:
          type: boolean
          description: true면 "다 봤음"(watchedAt 기록), false면 되돌림
      example:
        isWatched: true
    UpdatedWishlistItem:
      type: object
      description: 바뀐 찜 항목의 상태
      required:
        - wishlistItemId
        - priority
        - watchedAt
      properties:
        wishlistItemId:
          type: integer
          format: int64
          description: 찜 항목 ID
        priority:
          $ref: '#/components/schemas/WishlistPriority'
        watchedAt:
          type: string
          format: date-time
          nullable: true
          description: '"다 봤음"으로 표시한 시각. 안 봤으면 null'
    CommonResponseUpdatedWishlistItem:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/UpdatedWishlistItem'
      example:
        success: true
        data:
          wishlistItemId: 12
          priority: MUST
          watchedAt: '2026-10-12T20:15:00+09:00'

    # ----- user -----
    UserSubscription:
      type: object
      description: 서비스 하나의 이용 상태(ERD user_subscription)
      required:
        - ottServiceId
        - status
        - planName
        - billingDay
      properties:
        ottServiceId:
          type: integer
          format: int64
          description: 서비스 내부 ID
        status:
          $ref: '#/components/schemas/ServiceSubscriptionStatus'
        planName:
          type: string
          maxLength: 30
          nullable: true
          description: 요금제 이름(예 "스탠다드"). SUBSCRIBED일 때만 필수이고 그 밖에는 null. 계산에 쓰이지 않는 표시용 입력이다. ERD `user_subscription`에 `plan_name`(30자) 칸이 있다(ERD v0.4에 반영됨). 2단계에서 상품 선택으로 대체될 수 있다
        billingDay:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          nullable: true
          description: 결제일(1~31). SUBSCRIBED일 때만 값이 있고 그 밖에는 null. 저장 요청에서 SUBSCRIBED인데 null이면 1일로 저장한다(PRD FR-08 기본값)
      example:
        ottServiceId: 1
        status: SUBSCRIBED
        planName: 스탠다드
        billingDay: 15
    UserSettings:
      type: object
      description: 내 설정. 온보딩 전이면 subscriptions는 빈 배열, 나머지 값은 null
      required:
        - isOnboardingDone
        - subscriptions
        - monthlyBudget
        - monthlyWatchMinutes
        - watchPreset
      properties:
        isOnboardingDone:
          type: boolean
          description: 온보딩(첫 설정 저장)을 마쳤는지
        subscriptions:
          type: array
          description: 서비스별 이용 상태
          items:
            $ref: '#/components/schemas/UserSubscription'
        monthlyBudget:
          type: integer
          format: int32
          nullable: true
          description: 월 예산(원). 입력 전이면 null
        monthlyWatchMinutes:
          type: integer
          format: int32
          nullable: true
          description: 월 시청 시간(분). 입력 전이면 null
        watchPreset:
          allOf:
            - $ref: '#/components/schemas/WatchPreset'
          nullable: true
          description: 시청 시간을 고른 방식. 입력 전이면 null
    CommonResponseUserSettings:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/UserSettings'
      example:
        success: true
        data:
          isOnboardingDone: true
          subscriptions:
            - { ottServiceId: 1, status: SUBSCRIBED, planName: 스탠다드, billingDay: 15 }
            - { ottServiceId: 2, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
            - { ottServiceId: 3, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
            - { ottServiceId: 4, status: FREE, planName: null, billingDay: null }
            - { ottServiceId: 5, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
            - { ottServiceId: 6, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
            - { ottServiceId: 7, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
          monthlyBudget: 20000
          monthlyWatchMinutes: 900
          watchPreset: NORMAL
    UpdateMySettingsRequest:
      type: object
      description: 내 설정 저장 요청(전체 교체). 환산 입력값("주 N회 × 회당 M시간")은 받지 않는다(R11-18 A안)
      required:
        - subscriptions
        - monthlyBudget
        - monthlyWatchMinutes
        - watchPreset
      properties:
        subscriptions:
          type: array
          minItems: 1
          maxItems: 7
          description: 서비스별 이용 상태. 서비스마다 한 번만 보낸다(중복이면 400). 빠진 서비스는 미구독
          items:
            $ref: '#/components/schemas/UserSubscription'
        monthlyBudget:
          type: integer
          format: int32
          minimum: 0
          description: 월 예산(원). 0이면 이미 쓰는 서비스만으로 계산한다
        monthlyWatchMinutes:
          type: integer
          format: int32
          minimum: 120
          maximum: 44640
          description: 월 시청 시간(분). 120분 이상(PRD FR-10), 최대 31일 × 24시간
        watchPreset:
          $ref: '#/components/schemas/WatchPreset'
      example:
        subscriptions:
          - { ottServiceId: 1, status: SUBSCRIBED, planName: 스탠다드, billingDay: 15 }
          - { ottServiceId: 2, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
          - { ottServiceId: 3, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
          - { ottServiceId: 4, status: FREE, planName: null, billingDay: null }
          - { ottServiceId: 5, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
          - { ottServiceId: 6, status: UNKNOWN, planName: null, billingDay: null }
          - { ottServiceId: 7, status: NOT_SUBSCRIBED, planName: null, billingDay: null }
        monthlyBudget: 20000
        monthlyWatchMinutes: 900
        watchPreset: NORMAL

    # ----- product (내 요금) -----
    ServicePrice:
      type: object
      description: 서비스 하나의 월 요금 이력(SCR-09)
      required:
        - ottServiceId
        - productId
        - productName
        - adminPrice
        - userPrice
        - appliedPrice
        - priceSource
        - subscriptionStatus
        - effectiveFrom
        - lastVerifiedAt
      properties:
        ottServiceId:
          type: integer
          format: int64
          description: 서비스 내부 ID. 서비스 이름을 찾는 데 쓴다
        productId:
          type: integer
          format: int64
          description: OTT 구독상품 ID. 수정·되돌리기 경로에 쓴다(사용자 금액은 상품 단위로 저장된다)
        productName:
          type: string
          description: 상품(요금제) 이름. 예 "넷플릭스 스탠다드"
        adminPrice:
          type: integer
          format: int32
          description: 관리자가 등록한 기본 월 요금 중 현재 적용 중인 요금의 금액(원)
        userPrice:
          type: integer
          format: int32
          nullable: true
          description: 내가 고친 월 요금(원). 고치지 않았으면 null
        appliedPrice:
          type: integer
          format: int32
          description: 계산에 쓰는 금액(userPrice가 있으면 그 값, 없으면 adminPrice)
        priceSource:
          allOf:
            - $ref: '#/components/schemas/PriceSource'
          description: 적용 금액의 출처. 이 응답에서는 ADMIN 또는 USER_OVERRIDE만 온다
        subscriptionStatus:
          $ref: '#/components/schemas/ServiceSubscriptionStatus'
        effectiveFrom:
          type: string
          format: date
          description: adminPrice의 적용 시작일(관리자 월 구독요금 이력)
        lastVerifiedAt:
          type: string
          format: date-time
          description: adminPrice 요금 이력을 관리자가 마지막으로 확인한 일시. 서버가 확인·수정·추가·상품 등록 시각을 저장한다(ERD `last_verified_at`은 TIMESTAMPTZ이다, ERD v0.4에 반영됨). 화면은 한국 시간 기준 날짜만 표기한다. "요금 확인일 오래됨"(90일)도 한국 날짜 기준으로 판정한다
    ServicePriceList:
      type: object
      description: 판매 중인 상품의 요금(서비스 ID 순, 같은 서비스는 상품 ID 순). 한 서비스에 판매 중 상품이 여러 개일 수 있다
      required:
        - services
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServicePrice'
    CommonResponseServicePriceList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ServicePriceList'
      example:
        success: true
        data:
          services:
            - ottServiceId: 1
              productId: 101
              productName: 넷플릭스 스탠다드
              adminPrice: 13500
              userPrice: null
              appliedPrice: 13500
              priceSource: ADMIN
              subscriptionStatus: SUBSCRIBED
              effectiveFrom: '2026-10-02'
              lastVerifiedAt: '2026-10-07T09:00:00+09:00'
            - ottServiceId: 3
              productId: 103
              productName: 애플 TV+
              adminPrice: 6500
              userPrice: null
              appliedPrice: 6500
              priceSource: ADMIN
              subscriptionStatus: NOT_SUBSCRIBED
              effectiveFrom: '2025-12-16'
              lastVerifiedAt: '2026-06-14T09:00:00+09:00'
            - ottServiceId: 5
              productId: 105
              productName: 웨이브 스탠다드
              adminPrice: 10900
              userPrice: 9900
              appliedPrice: 9900
              priceSource: USER_OVERRIDE
              subscriptionStatus: NOT_SUBSCRIBED
              effectiveFrom: '2026-04-15'
              lastVerifiedAt: '2026-10-05T09:00:00+09:00'
    SetMyServicePriceRequest:
      type: object
      description: 내 월 요금 설정 요청. 지우려면 DELETE를 쓴다
      required:
        - monthlyPrice
      properties:
        monthlyPrice:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: 월 요금(원, 0 이상 100만 이하 정수)
      example:
        monthlyPrice: 9900
    CommonResponseServicePrice:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ServicePrice'
      example:
        success: true
        data:
          ottServiceId: 5
          productId: 105
          productName: 웨이브 스탠다드
          adminPrice: 10900
          userPrice: 9900
          appliedPrice: 9900
          priceSource: USER_OVERRIDE
          subscriptionStatus: NOT_SUBSCRIBED
          effectiveFrom: '2026-04-15'
          lastVerifiedAt: '2026-10-05T09:00:00+09:00'

    # ----- plan -----
    PlanMonthProduct:
      type: object
      description: 그 달에 구독할(또는 이미 이용 중인) 상품 하나(ERD plan_month_product)
      required:
        - productId
        - productName
        - ottServiceIds
        - appliedPrice
        - priceSource
      properties:
        productId:
          type: integer
          format: int64
          description: OTT 구독상품 ID
        productName:
          type: string
          description: 상품(요금제) 이름
        ottServiceIds:
          type: array
          description: 상품이 포함하는 서비스 ID들(단품은 1개)
          items:
            type: integer
            format: int64
        appliedPrice:
          type: integer
          format: int32
          description: 적용 월 요금(원). priceSource가 ALREADY_PAID·FREE면 그 달 비용에 넣지 않는다
        priceSource:
          $ref: '#/components/schemas/PriceSource'
    PlanAssignment:
      type: object
      description: 그 달에 볼 작품 배정 하나. 긴 시즌은 연속된 달에 걸쳐 조각으로 나뉜다(PRD 5.4)
      required:
        - planItemId
        - mediaType
        - tmdbId
        - title
        - seasonNumber
        - priority
        - ottServiceId
        - watchMin
        - segmentIndex
        - segmentCount
        - isContinuation
      properties:
        planItemId:
          type: integer
          format: int64
          description: 플랜 항목 ID(같은 시즌의 조각들은 같은 값)
        mediaType:
          $ref: '#/components/schemas/MediaType'
        tmdbId:
          type: integer
          format: int64
          description: TMDB ID
        title:
          type: string
          description: 한국어 제목
        seasonNumber:
          type: integer
          format: int32
          nullable: true
          description: 드라마 시즌 번호. 영화는 null
        priority:
          $ref: '#/components/schemas/WishlistPriority'
        ottServiceId:
          type: integer
          format: int64
          description: 이 달에 이 조각을 보는 서비스
        watchMin:
          type: integer
          format: int32
          description: 이 달에 배정된 시청 시간(분)
        segmentIndex:
          type: integer
          format: int32
          minimum: 1
          description: 몇 번째 조각인지(1부터). 나뉘지 않으면 1
        segmentCount:
          type: integer
          format: int32
          minimum: 1
          description: 전체 조각 수. 나뉘지 않으면 1
        isContinuation:
          type: boolean
          description: 앞 달에서 이어 보는 조각인지(segmentIndex > 1)
    PlanMonth:
      type: object
      description: 플랜의 한 달(ERD plan_month)
      required:
        - monthIndex
        - month
        - isConfirmed
        - cost
        - products
        - assignments
      properties:
        monthIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 2
          description: 0 이번 달, 1·2 다음 두 달
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: 해당 달(YYYY-MM)
        isConfirmed:
          type: boolean
          description: 이번 달만 true. 나머지는 "예상"
        cost:
          type: integer
          format: int32
          description: 그 달 비용(원). 구독 상품이 없으면 0
        products:
          type: array
          description: 그 달 상품들. 빈 배열이면 그 달은 구독하지 않는다
          items:
            $ref: '#/components/schemas/PlanMonthProduct'
        assignments:
          type: array
          description: 그 달에 볼 작품들
          items:
            $ref: '#/components/schemas/PlanAssignment'
    UnscheduledItem:
      type: object
      description: 3개월 안에 배정하지 못한 작품 하나("남은 작품과 이유")
      required:
        - planItemId
        - mediaType
        - tmdbId
        - title
        - seasonNumber
        - priority
        - reason
      properties:
        planItemId:
          type: integer
          format: int64
          description: 플랜 항목 ID
        mediaType:
          $ref: '#/components/schemas/MediaType'
        tmdbId:
          type: integer
          format: int64
          description: TMDB ID
        title:
          type: string
          description: 한국어 제목
        seasonNumber:
          type: integer
          format: int32
          nullable: true
          description: 드라마 시즌 번호. 영화는 null
        priority:
          $ref: '#/components/schemas/WishlistPriority'
        reason:
          $ref: '#/components/schemas/UnscheduledReason'
    PlanDraft:
      type: object
      description: 플랜 초안 하나(ERD plan, status = DRAFT)
      required:
        - planId
        - planType
        - startMonth
        - algorithm
        - monthlyBudget
        - monthlyWatchMinutes
        - mustTotal
        - mustCompleted
        - scheduledCount
        - totalCount
        - score
        - totalCost
        - allSubscribeCost
        - savedAmount
        - months
        - unscheduled
        - dataAsOf
      properties:
        planId:
          type: integer
          format: int64
          description: 플랜 ID(저장 요청에 쓴다)
        planType:
          $ref: '#/components/schemas/PlanType'
        startMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: 첫 달(YYYY-MM)
        algorithm:
          $ref: '#/components/schemas/PlanAlgorithm'
        monthlyBudget:
          type: integer
          format: int32
          description: 계산에 쓴 월 예산(스냅샷, 원)
        monthlyWatchMinutes:
          type: integer
          format: int32
          description: 계산에 쓴 월 시청 시간(스냅샷, 분)
        mustTotal:
          type: integer
          format: int32
          description: 꼭 볼 작품 수
        mustCompleted:
          type: integer
          format: int32
          description: 그중 3개월 안에 다 볼 수 있는 수
        scheduledCount:
          type: integer
          format: int32
          description: 배정된 작품(시즌) 수
        totalCount:
          type: integer
          format: int32
          description: 계산 대상 찜 수("다 봤음" 제외)
        score:
          type: integer
          format: int32
          description: 점수(보고 싶음 2, 여유될 때 1의 합. 꼭 볼 작품은 mustCompleted로만 센다)
        totalCost:
          type: integer
          format: int32
          description: 3개월 총비용(원)
        allSubscribeCost:
          type: integer
          format: int32
          description: 전체 구독 비용(원). 세 유형이 같은 정의라 같은 값이다(PRD 5.4, 11절 38번)
        savedAmount:
          type: integer
          format: int32
          description: 절감액 = allSubscribeCost − totalCost (PRD 11절 38번)
        months:
          type: array
          description: 3개월(monthIndex 0, 1, 2 순)
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/PlanMonth'
        unscheduled:
          type: array
          description: 남은 작품과 이유. 없으면 빈 배열
          items:
            $ref: '#/components/schemas/UnscheduledItem'
        dataAsOf:
          type: string
          format: date
          description: 계산에 쓴 데이터 기준일
    PlanDraftList:
      type: object
      description: 플랜 초안 목록. 계산하면 유형마다 1개씩 항상 3개, 계산 전·저장 후에는 빈 배열
