      description: 영어로 되돌린 결과
      required:
        - titleId
      properties:
        titleId:
          type: integer
          format: int64
          description: 되돌린 작품 ID. 줄거리와 언어가 비워졌고 다음 수집이 TMDB 영어 줄거리를 다시 채운다
