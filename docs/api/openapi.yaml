          type: string
          description: 한국어 제목
        seasonNumber:
          type: integer
          format: int32
          nullable: true
          description: 드라마 시즌 번호. 영화는 null. 제공 상태는 시즌 단위로 기록되므로(ERD availability_change) 같은 드라마의 시즌이 여러 건 올 수 있다
        ottServiceId:
          type: integer
          format: int64
          description: 상태가 바뀐 서비스
        previousStatus:
          allOf:
            - $ref: '#/components/schemas/AvailabilityStatus'
          nullable: true
          description: 이전 상태. null이면 이번에 처음 확인된 작품
        currentStatus:
          $ref: '#/components/schemas/AvailabilityStatus'
    CollectExecutionChangePage:
      description: 실행별 변경 건 한 페이지(페이지네이션 고정 형태)
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              description: 제목 순, 같으면 시즌 번호·서비스 ID 순. 없으면 빈 배열
              items:
                $ref: '#/components/schemas/CollectExecutionChange'
    CommonResponseCollectExecutionChangePage:
