  # ===== admin: 수집 (배치 토큰 범위 /admin/collect/**, TECH 3절) =====
  /admin/collect/executions:
    get:
      tags:
        - admin
      operationId: listCollectExecutions
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 수집 실행 이력 조회
      description: |
        수집 실행 이력을 대상 날짜 내림차순, 같으면 실행 ID 내림차순으로 돌려준다(Task 029 화면 정렬). 서버가 멈춰 기록만 "실행 중"으로 남은 실행은 서버가 `STOPPED`로 판정해 내려준다(저장하지 않고 조회할 때마다 판정한다).
        페이지네이션 응답이다. 수집은 매일 1회 이상 돌고 Spring Batch 메타데이터는 지우지 않으므로 이력이 계속 늘어난다.
        관리자(ADMIN) Access Token 또는 관리자 배치 토큰으로 호출한다(배치 토큰은 `/admin/collect/**`에서만 유효, TECH 4절).        오류: `VALIDATION_FAILED`(400, page/size 범위 밖), `UNAUTHORIZED`(401, 배치 토큰이 없거나 틀림), `FORBIDDEN`(403), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 실행 이력 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - admin
      operationId: createCollectExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 수집 실행 요청
      description: |
        수집 Job을 비동기로 시작하고 202와 새 `executionId`를 돌려준다. 결과는 실행 이력에서 본다. 관리자 화면과 GitHub Actions cron(관리자 배치 토큰)이 함께 쓴다(TECH 3절).
        `tier`는 `ALL`(전체 일괄), `DAILY`(찜한 작품만 매일 갱신), `WEEKLY`(후보 발견 + 나머지 작품 주 1회 갱신)를 받는다. 모든 tier는 시작할 때 찜 현황에 맞춰 작품의 갱신 주기(`refresh_tier`)를 먼저 다시 맞춘다. `DAILY`는 제공처 목록·후보 발견을 건너뛰고 `refresh_tier=DAILY` 작품의 상세·제공 상태 판정만, `WEEKLY`는 전체 흐름을 돌되 상세·판정 대상이 `refresh_tier=WEEKLY` 작품이다. `ALL`은 모든 작품이다. `DAILY`·`WEEKLY`·`ALL`은 서로 다른 실행(날짜가 같아도 따로 완료·중복 판정)이고 동시에 돌지 못한다. `targetDate`를 비우면 오늘(KST)이다. 날짜를 직접 지정하는 것은 설정 키 `app.collect.allow-target-date-override`가 true인 환경(로컬)에서만 허용하고(오늘 이하), 운영에서는 오늘(KST)만 받으며 다른 날짜를 보내면 400이다(TECH 3절 "무료 기간과 Hobby 전환 이후").
        수집은 전체에서 동시에 하나만 돈다. 같은 날짜·범위가 실행 중이면 물론 다른 날짜가 실행 중이어도, 매월 재계산이나 데이터 정리가 실행 중일 때도 `BATCH_ALREADY_RUNNING`(409)이다(끝난 뒤 다시 요청). 같은 날짜·범위의 상태(실행 중·중단됨·완료)를 먼저 보고, 그 뒤에 다른 실행이 도는지 본다.
        선택 값 `scope`(`AVAILABILITY_TV`)를 주면 후보·상세 Step을 건너뛰고 드라마 시즌 제공 상태 판정 Step만 실행한다(이미 모은 데이터에 새 판정 규칙을 다시 적용할 때). `targetDate`처럼 로컬에서만 받고 운영에서는 400(`fieldErrors.scope`)이다. 중복·재시작 판정은 날짜·범위·scope가 같은 실행끼리만 한다(같은 날짜에 전체 수집이 완료돼도 scope 실행은 새로 시작된다).
        같은 날짜·범위의 마지막 실행이 실패(`FAILED`)면 새 실행으로 다시 시작해 202다(Spring Batch는 같은 식별 파라미터로 시작하면 실패한 인스턴스를 재시작한다, TECH 3절 "실패한 실행은 같은 파라미터로 restart").
        오류: `VALIDATION_FAILED`(400, 본문 값 변환 실패(날짜 형식·모르는 `tier`·`scope` 값)와 미래 날짜·운영에서 오늘이 아닌 날짜는 `fieldErrors`로 필드를 알린다. 모르는 `tier`는 `fieldErrors.tier`, 운영에서 `scope`를 지정하면 `fieldErrors.scope`), `INVALID_REQUEST`(400, 깨진 JSON처럼 필드를 특정할 수 없는 경우만), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `BATCH_ALREADY_RUNNING`(409, 같은 날짜·범위 또는 다른 날짜의 수집이 실행 중이거나 매월 재계산·데이터 정리가 실행 중), `BATCH_ALREADY_COMPLETED`(409), `BATCH_RECOVERY_REQUIRED`(409, 같은 날짜·범위의 중단된 실행을 먼저 복구해야 함), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectExecutionRequest'
      responses:
        '202':
          description: 실행 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/collect/executions/{executionId}/changes:
    get:
      tags:
        - admin
      operationId: listCollectExecutionChanges
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 실행별 제공 상태가 바뀐 작품 조회
      description: |
        이 실행에서 제공 상태가 바뀐 건(시청 단위 × 서비스, ERD `availability_change`)을 제목 순, 같으면 시즌 번호·서비스 ID 순으로 돌려준다. 끝나지 않은 실행은 빈 페이지일 수 있다.
        페이지네이션 응답이다. 첫 전체 수집은 모든 작품이 "처음 확인됨"이라 한 실행에 수천~수만 건이 생길 수 있다.
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류·page/size 범위 밖), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 실행), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 바뀐 작품 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionChangePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/collect/executions/{executionId}/recover:
    post:
      tags:
        - admin
      operationId: recoverCollectExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 중단된 실행을 실패로 복구
      description: |
        `STOPPED`(중단됨) 실행을 `FAILED`로 바꾸고 바뀐 실행을 돌려준다(TECH 3절). 요청 본문은 없다. 언제 멈췄는지 알 수 없어 `endedAt`은 `null`로 두고 `failureReason`은 고정 문구다.
        응답의 `canRestart`로 이어서 재시작할 수 있는지(`restartCollectExecution`) 바로 알 수 있다.
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 실행), `BATCH_NOT_STOPPED`(409, 중단된 실행이 아님), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
      responses:
        '200':
          description: 실패로 바뀐 실행
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/collect/executions/{executionId}/restart:
    post:
      tags:
        - admin
      operationId: restartCollectExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 실패한 실행을 새 실행으로 재시작
      description: |
        `FAILED` 실행을 같은 대상 날짜·범위로 다시 실행한다. 요청 본문은 없다. 새 실행으로 접수해 202와 새 `executionId`를 돌려주고, 실패 기록은 이력에 남는다.
        실패가 아닌 실행은 그 날짜·범위의 현재 상태에 맞는 코드로 거절한다: 실행 중이면 `BATCH_ALREADY_RUNNING`, 완료면 `BATCH_ALREADY_COMPLETED`, 중단됨이면 `BATCH_RECOVERY_REQUIRED`(먼저 복구). 그래서 "실패한 실행이 아님" 전용 코드는 두지 않는다. 같은 날짜·범위에 더 나중 실행이 있으면 그 실행의 상태로 판단한다.
        운영 환경에서는 그 실행의 대상 날짜가 오늘(KST)이 아니면 거절한다. 다른 날짜·범위의 수집이 실행 중이어도 시작할 수 없다(전체 동시 실행 금지).
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류·운영에서 대상 날짜가 오늘이 아님), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 실행), `BATCH_ALREADY_RUNNING`(409, 같은 날짜·범위 또는 다른 날짜의 수집이 실행 중이거나 매월 재계산·데이터 정리가 실행 중), `BATCH_ALREADY_COMPLETED`(409), `BATCH_RECOVERY_REQUIRED`(409), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
      responses:
        '202':
          description: 재시작 접수됨(새 실행)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== admin: 매월 재계산 (배치 토큰 범위 /admin/plans/monthly/**, TECH 4절) =====
  /admin/plans/monthly/executions:
    post:
      tags:
        - admin
      operationId: createPlanRecalcExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 매월 재계산 수동 실행 요청
      description: |
        매월 재계산 Job을 비동기로 시작하고 202와 새 `executionId`를 돌려준다. 재계산은 수집이 끝나면 자동으로 이어 돌고, 이 API는 자동 실행이 실패했을 때 관리자가 다시 돌리는 복구용이다. 요청 본문은 없다.
        재계산·수집·데이터 정리 중 하나라도 이미 실행 중이면 `BATCH_ALREADY_RUNNING`(409)이다. 관리자(ADMIN) Access Token 또는 관리자 배치 토큰으로 호출한다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `BATCH_ALREADY_RUNNING`(409), `INTERNAL_ERROR`(500).
      responses:
        '202':
          description: 실행 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanRecalcExecutionAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== admin: 데이터 정리 (배치 토큰 범위 /admin/retention/**, TECH 4절) =====
  /admin/retention/executions:
    post:
      tags:
        - admin
      operationId: createRetentionExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 데이터 정리 실행 요청
      description: |
        데이터 정리 Job을 비동기로 시작하고 202와 새 `executionId`를 돌려준다. GitHub Actions cron이 주 1회 호출하고 관리자가 수동으로도 쓴다. 요청 본문은 없다.
        하는 일은 세 가지다. (1) 마지막 수집이 5개월을 넘은 작품을 TMDB에 다시 물어 있으면 갱신하고, TMDB가 없다고 답한(404) 작품은 찜·플랜과 함께 삭제한다(한 번에 가장 오래된 순 최대 500건, 나머지는 다음 실행). 사라진 작품이 든 현재 플랜은 찜을 뺀 채 다시 계산하고, 저장 전 초안과 보관 플랜은 통째로 지운다. 찜이 그 작품뿐이라 다시 계산할 수 없는 현재 플랜도 지운다. (2) 180일이 지난 배치 실행 이력을 지운다. (3) 180일이 지난, 플랜과 연결이 끊긴 계산 기록(`calc_run`)을 지운다.
        정리·재계산·수집 중 하나라도 이미 실행 중이면 `BATCH_ALREADY_RUNNING`(409)이다(반대로 정리 실행 중에는 수집·재계산 시작도 409). 관리자(ADMIN) Access Token 또는 관리자 배치 토큰으로 호출한다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `BATCH_ALREADY_RUNNING`(409), `INTERNAL_ERROR`(500).
      responses:
        '202':
          description: 실행 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseRetentionExecutionAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== admin: 인기 순위 수집 (배치 토큰 범위 /admin/popularity/**, Task 107) =====
  /admin/popularity/executions:
    post:
      tags:
        - admin
      operationId: createPopularityExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 인기 순위 수집 실행 요청
      description: |
        인기 순위 수집 Job을 비동기로 시작하고 202와 새 `executionId`를 돌려준다. 하루 1회 GitHub Actions cron이 호출하고 관리자가 수동으로도 쓴다. 요청 본문은 없다.
        하는 일: 서비스 7곳 × 영화·드라마별로 TMDB `discover`(한국 제공처, 서비스 제공처 필터, 한국 제작 `with_origin_country=KR`, 영화 `primary_release_date.gte`·드라마 `first_air_date.gte`가 오늘(KST)에서 2년 전, 인기순) 첫 쪽(상위 20개)을 받아 오늘(KST) 날짜의 인기 스냅샷으로 저장한다(약 14번 호출). 같은 날 다시 실행하면 그 날짜의 스냅샷을 덮어쓰고(중복 행이 쌓이지 않는다), 14일이 지난 스냅샷은 지운다. 필터 결과가 0건인 서비스·매체는 정상으로 보고 저장할 행이 없다. 한 서비스·매체의 호출이 실패하면 그 조각만 건너뛰고 나머지는 저장한다(건너뛴 조각의 이전 스냅샷은 그대로 남는다).
        수집·재계산·정리·인기 수집 중 하나라도 이미 실행 중이면 `BATCH_ALREADY_RUNNING`(409)이다(반대로 인기 수집 실행 중에는 수집·재계산·정리 시작도 409). 관리자(ADMIN) Access Token 또는 관리자 배치 토큰으로 호출한다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `BATCH_ALREADY_RUNNING`(409), `INTERNAL_ERROR`(500).
      responses:
        '202':
          description: 실행 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePopularityExecutionAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/notifications/summary:
    get:
      tags:
        - admin
      operationId: getAdminNotificationSummary
      security:
        - bearerAuth: []
      summary: 알림 발송 상태 요약 조회
      description: |
        관리자 수집 화면(SCR-16)의 알림 발송 상태 요약이다. 최근 7일 동안 만들어진 알림의 상태별 건수와 마지막 발송 시각을 돌려준다. 사용자 이메일이나 본문은 담지 않는다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 알림 발송 상태 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAdminNotificationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/system-metrics:
    get:
      tags:
        - admin
      operationId: getSystemMetrics
      security:
        - bearerAuth: []
      summary: 시스템 메모리 지표 조회
      description: |
        서버의 JVM·프로세스·컨테이너 메모리 구성을 지금 시점으로 측정해 돌려준다. 운영 컨테이너에 `jcmd`가 없고 브라우저에서 `/actuator`를 부를 수 없어 둔 읽기 전용 API다. 비밀 값은 담지 않는다.
        숫자는 모두 바이트 단위(스레드·클래스·GC 횟수 등 개수와 시간은 제외)다. 읽을 수 없는 값은 `null`이다. `process`는 Linux의 `/proc/self/status`, `container`는 cgroup 메모리 파일에서 읽으므로 Linux 컨테이너가 아니면(로컬 Windows 등) 안의 값이 모두 `null`이다. `container.memoryLimitBytes`는 한도가 `max`(제한 없음)여도 `null`이다.
        ADMIN만 호출할 수 있다. 데모 계정(`DEMO`)과 배치 토큰은 호출할 수 없다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 시스템 메모리 지표
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseSystemMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/plan-benchmarks:
    post:
      tags:
        - admin
      operationId: createPlanBenchmark
      security:
        - bearerAuth: []
      summary: 완전탐색·그리디 비교 측정 실행
      description: |
        정답 세트(입력과 기대 결과) 전체를 완전탐색·그리디 두 알고리즘으로 워밍업 1회 뒤 3회씩 측정해 `calc_run`에 케이스 × 알고리즘마다 1행(중앙값)을 남긴다. 한 번 호출에 21케이스 × 2 = 42행이다.
        요청 본문은 없다. 같은 입력으로 다시 호출하면 행이 더 쌓이고, 같은 `inputHash`에 EXACT·GREEDY 두 행이 함께 있다. 기록의 `plan_id`는 NULL, 플랜 유형은 추천형이다.
        ADMIN만 호출할 수 있고 배치 토큰은 허용하지 않는다. 수 초 걸리는 CPU 작업이라 응답이 느리다.
        완전탐색이 후보 조합 수 상한을 넘어 건너뛰어진 케이스는 저장하지 않고 `skippedCaseNames`에 이름을 담는다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `INTERNAL_ERROR`(500, 정답 세트를 못 읽음·반복 결과가 서로 다름).
      responses:
        '201':
          description: 측정 결과(저장된 calc_run 행 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanBenchmark'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== admin: 영어 줄거리 한국어 번역 (관리자 전용, 자동 실행 없음) =====
  # 조회(GET)는 ADMIN·DEMO, 쓰기·실행(POST·DELETE)은 ADMIN만이다. 배치 토큰은 쓰지 못한다.
  /admin/llm/overview-candidates:
    get:
      tags:
        - admin
      operationId: listOverviewCandidates
      security:
        - bearerAuth: []
      summary: 번역 후보 목록 조회
      description: |
        영어 줄거리(`overview_lang='en'`이고 줄거리가 비어 있지 않은 작품)를 번역 후보로 돌려준다. 정렬은 찜한 사용자 수 많은 순 → 인기도 순(동률은 작품 ID 순)이다.
        각 항목에 영어 줄거리 전문과 이미 만든 초안이 있는지(`hasDraft`)가 들어 있다. 응답의 `summary`에 번역 대기 총수, 오늘 사용량과 하루·분당 상한, 모델 이름, 번역 기능 사용 가능 여부(`isEnabled`, 서버에 Gemini 키가 있는지), 관리자가 반영한 번역 작품 수(`translatedCount`)와 가장 오래된 번역의 반영 시각(`oldestTranslatedAt`, 없으면 `null`)이 들어 있다. 키가 없어도 이 조회는 동작한다.
        페이지네이션 응답이다. 하루 사용량은 태평양 시간(America/Los_Angeles) 날짜 기준이다(구글 무료 일일 한도 리셋 기준).
        관리자(ADMIN) 또는 데모(DEMO) Access Token으로 호출한다.
        오류: `VALIDATION_FAILED`(400, page/size 범위 밖), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 번역 후보 한 페이지와 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseOverviewCandidatePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/llm/drafts:
    post:
      tags:
        - admin
      operationId: createOverviewDraft
      security:
        - bearerAuth: []
      summary: 번역 초안 생성
      description: |
        작품 한 건의 영어 줄거리를 Gemini로 한국어 초안으로 번역해 저장하고 201로 돌려준다. 초안은 Redis에 7일 보관하며 작품당 1개다(새로 만들면 교체한다). DB의 줄거리는 바뀌지 않는다. 반영은 `applyOverviewDrafts`로 한다.
        번역문은 서버 코드가 자동 검사한다. 검사 결과는 세 등급이다: **실패**(한글 비율, 길이 비율, 최대 1000자, URL·마크다운·머리말 포함, 원문 숫자 보존 중 하나라도 걸림, `isGuardPassed=false`와 `guardFailures` 이유 코드), **주의**(실패는 없지만 문장 수·문체·띄어쓰기·길이 비율 한계 근접 같은 의심 신호가 있음, `isGuardPassed=true`이고 `warnings`가 비어 있지 않음), **성공**(실패도 경고도 없음). 검사에서 걸려도 초안은 저장된다. 단건 번역은 한 번만 시도하고 자동으로 다시 번역하지 않는다(`attempts`는 항상 1). 다시 번역은 관리자가 이 API를 다시 부른다. 이 호출은 Gemini를 부르므로 응답에 수 초~수십 초 걸릴 수 있다(호출 제한 시간 90초).
        Gemini 호출 직전에 분당(12)·하루(400, 태평양 시간 날짜) 카운터를 올린다. 키가 없어 막힌 요청은 올리지 않고, 호출이 실패해도 올린 채 둔다. 같은 작품은 60초 쿨다운이 있다.
        ADMIN만 호출할 수 있다.
        오류: `VALIDATION_FAILED`(400), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 작품), `LLM_NOT_TRANSLATABLE`(409, 영어 줄거리가 아님), `LLM_DRAFT_LIMIT_EXCEEDED`(409, 대기 초안 500개 가득 참), `LLM_TITLE_COOLDOWN`(429, 같은 작품 60초 쿨다운), `LLM_RATE_LIMITED`(429, 분당 상한 또는 구글 429), `LLM_DAILY_LIMIT_EXCEEDED`(429, 하루 상한), `LLM_CALL_FAILED`(502, Gemini 호출 실패·시간 초과·빈 응답), `LLM_UPSTREAM_BUSY`(502, 구글 서버 혼잡 503, 요청 안에서 재시도하지 않으니 잠시 뒤 다시 누른다), `LLM_DISABLED`(503, 서버에 Gemini 키 없음), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOverviewDraftRequest'
      responses:
        '201':
          description: 만든 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseOverviewDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/LlmTooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/LlmBadGateway'
        '503':
          $ref: '#/components/responses/LlmUnavailable'
    get:
      tags:
        - admin
      operationId: listOverviewDrafts
      security:
        - bearerAuth: []
      summary: 번역 초안 목록 조회
      description: |
        Redis에 보관 중인 번역 초안을 만든 시각 최신순으로 돌려준다. `status`로 자동 검사 등급을 거른다(`PASSED` 성공: 실패도 경고도 없음 / `WARNING` 주의: 실패는 없고 경고만 있음 / `FAILED` 실패). `sample=N`이면 성공(`PASSED`) 초안 중 무작위 N개를 돌려준다(표본 확인용, `page`·`size`는 무시하고 `status=FAILED`·`status=WARNING`과는 함께 쓸 수 없다).
        각 항목에 영어 원문, 번역문, 자동 검사 결과(실패 여부와 걸린 이유 코드, 경고 코드), 모델, 만든 시각, 총 시도 횟수가 들어 있다. 운영 Redis는 persistence가 없고 메모리가 부족하면 오래된 키부터 지우므로, 사라진 초안은 목록에서 조용히 빠진다(오류가 아니다).
        응답의 `bulkRun`에 최근 일괄 번역의 진행 상황이 들어 있다(일괄을 돌린 적이 없으면 `null`).
        페이지네이션 응답이다. 관리자(ADMIN) 또는 데모(DEMO) Access Token으로 호출한다.
        오류: `VALIDATION_FAILED`(400, page/size/sample 범위 밖·`status=FAILED` 또는 `status=WARNING`과 `sample` 동시 사용), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `INTERNAL_ERROR`(500).
      parameters:
        - name: status
          in: query
          description: 자동 검사 등급으로 거른다(PASSED 성공만 / WARNING 주의만 / FAILED 실패만). 비우면 전부
          required: false
          schema:
            $ref: '#/components/schemas/OverviewDraftStatus'
        - name: sample
          in: query
          description: 성공(`PASSED`) 초안 중 무작위로 뽑을 개수(1~100). 주면 `page`·`size`는 무시한다
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 초안 한 페이지와 일괄 진행 상황
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseOverviewDraftPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/llm/bulk-drafts:
    post:
      tags:
        - admin
      operationId: createBulkOverviewDrafts
      security:
        - bearerAuth: []
      summary: 일괄 번역 시작
      description: |
        여러 작품의 번역을 서버 안에서 차례로 시작하고 202와 진행 상황을 돌려준다. 요청은 `titleIds`(1~100개, 이미 초안이 있어도 다시 번역해 교체)와 `count`(1~100, 후보 정렬 상위 N개, 이미 초안이 있는 작품은 건너뛰고 그다음을 채운다) 중 정확히 하나만 보낸다.
        서버의 일괄 전용 스레드가 호출 사이 2초씩 쉬며 처리한다. 구글 서버 혼잡(503)으로 실패한 작품은 30초 뒤 한 번만 다시 부르고(`LLM_UPSTREAM_BUSY`), 다시 실패하면 그 작품을 실패로 센다. 자동 검사 결과가 실패인 작품은 최대 2번, 주의인 작품은 최대 1번 자동으로 다시 번역하고(첫 시도 제외, 설정 `app.llm.bulk.fail-retry-max`·`warning-retry-max`), 시도들 중 가장 좋은 결과(성공 > 주의 > 실패, 같은 등급이면 마지막 시도) 하나만 저장한다. 총 시도 횟수는 초안의 `attempts`에 남고, 재시도도 분당·하루 호출 카운터를 올린다. 재시도 중 한도·키 문제가 나면 그때까지의 최선 결과를 저장하고 일괄을 멈춘다. 진행 상황은 `listOverviewDrafts` 응답의 `bulkRun`로 본다. 한 번에 실행 중인 일괄은 1개다. 한도 초과(분당·하루·구글 429)·키 없음·대기 초안 가득 참이면 즉시 멈추고, 호출 실패가 3번 연속이어도 멈춘다. 멈춘 이유는 `bulkRun.stopReason`에 남는다. 서버가 다시 시작되면 실행 중이던 일괄은 `STOPPED`(`SERVER_RESTARTED`)로 보인다.
        키가 없으면 시작하지 않고 `LLM_DISABLED`(503)다. 후보가 하나도 없으면 바로 `COMPLETED`(`total=0`)로 돌려준다. ADMIN만 호출할 수 있다.
        오류: `VALIDATION_FAILED`(400, `titleIds`와 `count` 둘 다 보내거나 둘 다 없음·범위 밖), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `LLM_BULK_RUNNING`(409, 이미 일괄 실행 중), `LLM_DISABLED`(503), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkOverviewDraftsRequest'
      responses:
        '202':
          description: 일괄 접수됨(진행 상황)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseBulkDraftRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/LlmUnavailable'

  /admin/llm/drafts/apply:
    post:
      tags:
        - admin
      operationId: applyOverviewDrafts
      security:
        - bearerAuth: []
      summary: 번역 초안 반영
      description: |
        초안을 작품 줄거리에 반영한다. 요청은 `draftIds`(그 초안만)와 `allPassed: true`(**성공** 초안 전부) 중 정확히 하나만 보낸다. `allPassed: true`는 성공(실패도 경고도 없는) 초안만 대상으로 하고, **주의** 초안은 대상에서 빠진다(결과에도 나오지 않는다). 주의 초안은 사람이 확인한 뒤 `draftIds`로 지정해 반영한다(승인 경로). 실패 초안은 `draftIds`로 지정해도 건너뛴다. 건별 결과를 돌려주고, 한 건이 건너뛰어져도 나머지는 계속한다.
        반영은 DB 조건부 갱신이다. 작품 줄거리가 아직 영어(`en`)이고 번역한 원문과 똑같을 때만 `overview`를 번역문으로, `overview_lang`을 `ko`로 바꾼다. 바뀌면 그 작품의 상세 캐시 1개를 지우고 반영한 초안을 Redis에서 지운다. 건너뛴 이유(`reason`): `DRAFT_NOT_FOUND`(초안이 없음), `GUARD_FAILED`(자동 검사에서 실패한 초안은 반영하지 않음), `ORIGINAL_CHANGED`(번역한 뒤 줄거리가 바뀌었거나 이미 한국어).
        수집·재계산·데이터 정리·인기 수집 중 하나라도 실행 중이면 시작하지 않고 `LLM_APPLY_CONFLICT`(409)다. ADMIN만 호출할 수 있다.
        오류: `VALIDATION_FAILED`(400, `draftIds`와 `allPassed` 둘 다 보내거나 둘 다 없음), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `LLM_APPLY_CONFLICT`(409), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyOverviewDraftsRequest'
      responses:
        '200':
          description: 건별 반영 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseApplyOverviewDraftsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/llm/drafts/{draftId}:
    patch:
      tags:
        - admin
      operationId: editOverviewDraft
      security:
        - bearerAuth: []
      summary: 번역 초안 수정
      description: |
        초안의 번역문(`translated`)을 관리자가 직접 고친다. 서버가 자동 검사를 다시 돌려 `isGuardPassed`·`guardFailures`·`warnings`(성공/주의/실패)를 새로 판정하고, `isEdited`를 `true`로 바꾸며, 보관 기간(7일)을 저장한 시각부터 다시 센다. 원문(`original`)·작품·만든 시각은 그대로다. DB의 줄거리는 바뀌지 않는다(반영은 `applyOverviewDrafts`).
        검사에서 실패가 남아도 저장은 되고 응답의 `isGuardPassed`가 `false`다. 실패 초안은 반영할 수 없다(`applyOverviewDrafts`에서 `GUARD_FAILED`). 고친 초안은 일괄 번역(`createBulkOverviewDrafts`)이 같은 작품을 다시 번역해 덮어쓰지 않고 건너뛴다. 단건 번역(`createOverviewDraft`)을 다시 누르면 관리자의 명시적 요청이라 새 초안으로 교체된다(`isEdited`는 `false`로 돌아간다).
        `translatedText`는 공백만으로 보낼 수 없고 1000자까지다(자동 검사의 최대 글자 수와 같다). ADMIN만 호출할 수 있다(DEMO는 403).
        오류: `VALIDATION_FAILED`(400, 번역문이 비었거나 1000자 초과), `INVALID_REQUEST`(400, 깨진 본문), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `LLM_DRAFT_NOT_FOUND`(404, 초안이 없음. 보관 기간이 지났거나 이미 반영·삭제됨), `INTERNAL_ERROR`(500).
      parameters:
        - name: draftId
          in: path
          description: 초안 ID(UUID 문자열)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOverviewDraftRequest'
      responses:
        '200':
          description: 수정된 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseOverviewDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - admin
      operationId: deleteOverviewDraft
      security:
        - bearerAuth: []
      summary: 번역 초안 삭제
      description: |
        초안 한 건을 Redis에서 지운다. DB의 줄거리는 바뀌지 않는다. 성공하면 204(본문 없음)다. ADMIN만 호출할 수 있다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `LLM_DRAFT_NOT_FOUND`(404, 초안이 없음. 보관 기간이 지났거나 이미 반영·삭제됨), `INTERNAL_ERROR`(500).
      parameters:
        - name: draftId
          in: path
          description: 초안 ID(UUID 문자열)
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/llm/titles/{titleId}/overview-revert:
    post:
      tags:
        - admin
      operationId: revertTitleOverview
      security:
        - bearerAuth: []
      summary: 줄거리를 영어로 되돌리기
      description: |
        관리자가 반영한 번역 줄거리(`overview_translated_at`이 있는 작품)의 `overview`·`overview_lang`·`overview_translated_at`을 모두 `null`로 비우고 그 작품의 상세 캐시를 지운다. 요청 본문은 없다. 비워진 줄거리는 다음 수집(찜한 작품은 매일, 그 외는 매주)이 TMDB 영어 줄거리로 다시 채운다. **그동안 최대 일주일 줄거리가 비어 있을 수 있다.** TMDB가 처음부터 한국어로 준 줄거리(번역 아님)는 되돌릴 수 없고 `LLM_NOT_REVERTIBLE`(409)이다.
        수집·재계산·데이터 정리·인기 수집 중 하나라도 실행 중이면 `LLM_APPLY_CONFLICT`(409)다. ADMIN만 호출할 수 있다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 작품), `LLM_NOT_REVERTIBLE`(409, 줄거리가 관리자가 반영한 번역이 아님), `LLM_APPLY_CONFLICT`(409), `INTERNAL_ERROR`(500).
      parameters:
        - name: titleId
          in: path
          description: 작품 내부 ID(번역 후보·초안 응답의 `titleId`)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 되돌린 작품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseOverviewRevertResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/llm/overview-reverts:
    post:
      tags:
        - admin
      operationId: revertTranslatedOverviews
      security:
        - bearerAuth: []
      summary: 번역 줄거리 대량 되돌리기
      description: |
        관리자가 반영한 번역 줄거리(`overview_translated_at`이 있는 작품)를 한꺼번에 영어 줄거리로 되돌린다. 요청 본문은 필수이며 빈 객체 `{}`면 번역 **전부**를, `translatedBefore`가 있으면 그 시각보다 **먼저** 반영한 번역만 대상으로 한다. 대상 작품의 `overview`·`overview_lang`·`overview_translated_at`을 모두 `null`로 비우고 그 작품들의 상세 캐시를 지운다(캐시 삭제가 실패해도 경고만 남기고 상세 캐시는 TTL 24시간 뒤 새 값이 된다). TMDB가 처음부터 한국어로 준 줄거리와 영어 줄거리는 건드리지 않는다. 대상이 없으면 `revertedCount`가 0이다.
        사용 목적: TMDB가 번역 줄거리 표시를 허용하지 않을 때 번역 전부를 회수하거나, 번역문도 6개월 보관 제한 대상이라고 할 때 오래된 번역(예: `translatedBefore`를 6개월 전으로)만 회수한다. 가장 오래된 번역 시각은 `listOverviewCandidates` 응답 `summary`의 `translatedCount`·`oldestTranslatedAt`으로 볼 수 있다.
        비워진 줄거리는 다음 수집(찜한 작품은 매일, 그 외는 매주)이 TMDB 영어 줄거리로 다시 채운다. **그동안 최대 일주일 줄거리가 비어 있을 수 있다.** 작품 수천 건도 서버가 500건씩 나눠 처리한다.
        `isPreview`을 `true`로 보내면 미리보기다: DB와 캐시를 바꾸지 않고 같은 조건으로 되돌려질 작품 수만 `revertedCount`에 돌려주고 응답의 `isPreview`도 `true`다. 실행 전에 몇 편이 영향을 받는지 확인하는 용도다(`isPreview`을 생략하거나 `false`면 실제로 되돌린다). 미리보기도 수집 등이 실행 중이면 같은 `LLM_APPLY_CONFLICT`(409)다.
        수집·재계산·데이터 정리·인기 수집 중 하나라도 실행 중이면 시작하지 않고 `LLM_APPLY_CONFLICT`(409)다. ADMIN만 호출할 수 있다(DEMO는 403).
        오류: `INVALID_REQUEST`(400, 본문 없음·`translatedBefore` 날짜 형식 오류), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `LLM_APPLY_CONFLICT`(409), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverviewBulkRevertRequest'
      responses:
        '200':
          description: 되돌린 작품 수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseOverviewBulkRevertResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== auth =====
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshAccessToken
      security: []
      summary: Access Token 재발급
      description: |
        Refresh Token(HttpOnly 쿠키 `rt`)으로 새 Access Token과 사용자 권한(`role`)을 발급한다. 요청 본문은 없다. Refresh Token은 재발급 때 회전하며(새 쿠키, 수명은 그때부터 다시 14일), 응답 본문에는 담지 않는다(TECH 4절).
        직전 Refresh Token이 10초 안에 다시 오면(동시 요청·응답 유실) 회전 없이 Access Token만 발급한다(새 쿠키를 내리지 않는다). 유예가 지난 직전 토큰을 재사용하면 해당 계열을 무효화하고 401이다. 실패한 401 응답은 쿠키를 지운다.
        CSRF 방지를 위해 `Origin`이 프론트 주소와 같아야 한다(회전 전에 검사). 인증 경로도 공개 API와 같은 요청 제한을 받는다(`.claude/rules/backend.md`).
        오류: `UNAUTHORIZED`(401, 쿠키 없음·만료·무효·재사용 감지), `FORBIDDEN`(403, Origin 불일치), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500, Redis 장애 포함).
      responses:
        '200':
          description: 새 Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      security: []
      summary: 로그아웃
      description: |
        Refresh Token(HttpOnly 쿠키 `rt`)의 계열을 서버에서 폐기하고(현재 기기만) 쿠키를 지운다. 요청 본문은 없다. 쿠키가 없거나 이미 무효여도 204다.
        Access Token은 요구하지 않는다. 폐기 대상은 쿠키의 Refresh Token이고, Access Token이 만료된 뒤에도 재발급 없이 로그아웃할 수 있어야 하기 때문이다. Access Token은 서버에 저장하지 않으므로 수명(30분)이 끝날 때까지 유효하고, 프론트가 메모리에서 지운다(TECH 4절).
        CSRF 방지를 위해 `Origin`이 프론트 주소와 같아야 한다. 인증 경로도 공개 API와 같은 요청 제한을 받는다.
        오류: `FORBIDDEN`(403, Origin 불일치), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      responses:
        '204':
          description: 로그아웃됨(본문 없음)
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/demo-login:
    post:
      tags:
        - auth
      operationId: loginDemo
      security: []
      summary: 데모 계정 로그인
      description: |
        서버 설정(`DEMO_LOGIN_ID`·`DEMO_LOGIN_PASSWORD`)에 둔 아이디·비밀번호 한 쌍으로 공용 데모 계정에 로그인한다. 일반 회원용 아이디·비밀번호 로그인이 아니며 계정은 하나뿐이다(TECH 4절).
        성공하면 Refresh Token을 HttpOnly 쿠키 `rt`(`Path=/api/auth`, 재발급과 같은 속성)로 심고, 응답 본문에 Access Token과 `role: DEMO`를 바로 담는다(구글 로그인과 달리 `/auth/refresh`를 따로 부르지 않아도 된다). 이후 재발급·로그아웃은 회원과 같다.
        데모 계정 행(`users`)은 첫 데모 로그인 때 서버가 만든다. 데모 계정은 회원 기능(`/me/**`)을 쓰고 관리자 화면은 조회(GET)만 하며, 관리자 쓰기·실행과 회원 탈퇴·알림 설정 변경은 403이다. 데모 계정에는 알림이 만들어지지 않는다.
        확인 순서: 데모 로그인이 꺼져 있으면(서버에 아이디·비밀번호가 없으면) 경로가 없는 것처럼 404 → `Origin`이 프론트 주소와 다르면 403(로그인 CSRF 방지) → 같은 IP의 시도가 15분 5회를 넘으면 429(성공·실패 모두 센다, 계정 잠금은 없다) → 아이디나 비밀번호가 틀리면 401(어느 쪽이 틀렸는지는 알리지 않는다).
        빈 값도 400이 아니라 401이다(꺼진 상태에서 경로가 드러나지 않게 본문 필드 검증을 하지 않는다). 인증 경로라 공개 API와 같은 일반 요청 제한도 함께 받는다.
        데모 로그인을 끄면 남아 있는 데모 세션은 다음 재발급(`/auth/refresh`)에서 401로 끝난다.
        오류: `DEMO_LOGIN_FAILED`(401), `FORBIDDEN`(403, Origin 불일치), `RESOURCE_NOT_FOUND`(404, 데모 로그인 꺼짐), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
      responses:
        '200':
          description: 로그인됨. 새 Access Token(권한 DEMO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token(JWT). Refresh Token은 HttpOnly 쿠키로 관리되며 계약에 노출하지 않는다.
    adminBatchToken:
      type: http
      scheme: bearer
      description: |
        관리자 배치 토큰(`ADMIN_BATCH_TOKEN`, JWT 아님). GitHub Actions cron이 `Authorization: Bearer`로 보낸다. 별도 필터가 상수 시간 비교로 검사하고 `/admin/collect/**`, `/admin/plans/monthly/**`, `/admin/retention/**`, `/admin/popularity/**`에서만 유효하다(TECH 4절). 관리자 Access Token(JWT)과는 OR 관계다(둘 중 하나만 맞으면 통과한다).
        cron은 Vercel을 거치지 않고 백엔드에 직접 호출하므로 오리진 비밀 헤더(`x-origin-secret`)도 함께 보낸다(TECH 3절). 이 헤더는 인프라 경계 검사라 operation 파라미터로 적지 않는다.
  parameters:
    PageParam:
      name: page
      in: query
      description: 페이지 번호(0부터)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      description: 페이지 크기(기본 20, 최대 100)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    MediaTypePath:
      name: mediaType
      in: path
      description: 작품 구분(`movie` 영화 / `tv` 드라마). TMDB는 둘의 ID 공간이 달라 `tmdbId`와 함께 써야 작품이 정해진다
      required: true
      schema:
        $ref: '#/components/schemas/MediaType'
    TmdbIdPath:
      name: tmdbId
      in: path
      description: TMDB 작품 ID
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 2147483647
    WishlistItemIdPath:
      name: wishlistItemId
      in: path
      description: 찜 항목 ID
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProductIdPath:
      name: productId
      in: path
      description: OTT 구독상품 ID(내 요금 목록·관리자 상품 목록의 `productId`)
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PriceIdPath:
      name: priceId
      in: path
      description: 월 구독요금 이력 ID
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProviderIdPath:
      name: providerId
      in: path
      description: TMDB 제공처 ID(그대로 PK)
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ExecutionIdPath:
      name: executionId
      in: path
      description: 수집 실행 ID(Spring Batch jobExecutionId)
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 요청 값 오류. 필드를 특정할 수 있으면 `VALIDATION_FAILED`(`fieldErrors`에 필드별 오류), 깨진 본문처럼 특정할 수 없으면 `INVALID_REQUEST`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 인증 필요 또는 Access Token 만료. `errorCode`는 `UNAUTHORIZED`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: 권한 없음. `errorCode`는 `FORBIDDEN`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: 요청한 데이터가 없음. `errorCode`는 operation 설명 참고(사용자 API는 도메인 코드 `TITLE_NOT_FOUND`·`WISHLIST_ITEM_NOT_FOUND`·`SERVICE_PRICE_NOT_FOUND`(요금을 고칠 수 있는 상품이 아님. 없는 상품이거나 판매 종료)·`PLAN_DRAFT_NOT_FOUND`·`OTT_SERVICE_NOT_FOUND`(없는 서비스 ID), 관리자 API의 없는 데이터는 `RESOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: 현재 상태와 충돌해 처리할 수 없음. `errorCode`는 operation 설명 참고
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: 요청 제한 초과(비로그인 공개 API). `errorCode`는 `RATE_LIMIT_EXCEEDED`. `Retry-After` 헤더에 다시 시도할 수 있을 때까지의 초가 담긴다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: 서버 내부 오류. `errorCode`는 `INTERNAL_ERROR`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: 외부 API(TMDB 등) 호출 실패. `errorCode`는 `EXTERNAL_API_ERROR`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    LlmTooManyRequests:
      description: 번역 호출 상한 초과(관리자 번역 API). `errorCode`는 `LLM_RATE_LIMITED`(분당 상한 또는 구글 429)·`LLM_DAILY_LIMIT_EXCEEDED`(하루 상한)·`LLM_TITLE_COOLDOWN`(같은 작품 60초 쿨다운)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    LlmBadGateway:
      description: Gemini 호출 실패·시간 초과·빈 응답 또는 구글 서버 혼잡. `errorCode`는 `LLM_CALL_FAILED` 또는 `LLM_UPSTREAM_BUSY`(구글 503)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    LlmUnavailable:
      description: 서버에 Gemini 키(`GEMINI_API_KEY`)가 없어 번역 기능이 꺼져 있음. `errorCode`는 `LLM_DISABLED`. 외부 호출은 일어나지 않았고 호출 상한 카운터도 올리지 않았다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 ProblemDetail에 `errorCode`를 확장한 오류 응답. 코드 목록은 `docs/api/error-codes.md`
      required:
        - title
        - status
        - errorCode
      properties:
        type:
          type: string
          description: 오류 유형 URI. 기본값 `about:blank`
        title:
          type: string
          description: HTTP 상태 문구
        status:
          type: integer
          format: int32
          description: HTTP 상태 코드
        detail:
          type: string
          description: 사람이 읽는 오류 설명(한국어)
        instance:
          type: string
          description: 오류가 발생한 요청 경로
        errorCode:
          type: string
          description: SCREAMING_SNAKE_CASE 오류 코드. 프론트가 한국어 메시지로 매핑한다
        fieldErrors:
          type: array
          description: '`VALIDATION_FAILED`일 때의 필드별 오류 목록'
          items:
            $ref: '#/components/schemas/FieldError'
      example:
        type: about:blank
        title: Not Found
        status: 404
        detail: 작품을 찾을 수 없습니다.
        instance: /api/public/titles/movie/999
        errorCode: TITLE_NOT_FOUND
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: 오류가 난 요청 필드명
        message:
          type: string
          description: 필드 오류 메시지(한국어)
      example:
        field: monthlyBudget
        message: 0 이상이어야 합니다.
    PageMeta:
      type: object
      description: |
        페이지네이션 응답 `data`의 공통 필드. Spring `Page`를 그대로 직렬화하지 않는다.
        실제 응답 스키마는 이 스키마와 `content` 배열을 `allOf`로 합쳐 응답별로 정의한다.
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          description: 현재 페이지(0부터)
        size:
          type: integer
          format: int32
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 건수
        totalPages:
          type: integer
          format: int32
          description: 전체 페이지 수
      example:
        page: 0
        size: 20
        totalElements: 135
        totalPages: 7
    OttService:
      type: object
      description: 국내 OTT 서비스 1개
      required:
        - ottServiceId
        - code
        - name
        - logoPath
        - displayOrder
        - dataQuality
      properties:
        ottServiceId:
          type: integer
          format: int64
          description: 서비스 내부 ID
        code:
          type: string
          description: 서비스 코드
          enum:
            - NETFLIX
            - DISNEY_PLUS
            - APPLE_TV_PLUS
            - TVING
            - WAVVE
            - WATCHA
            - COUPANG_PLAY
        name:
          type: string
          description: 화면 표시 이름
        logoPath:
          type: string
          description: TMDB 이미지 상대 경로. URL 조립은 프론트가 한다
        displayOrder:
          type: integer
          format: int32
          description: 화면 정렬 순서
        dataQuality:
          type: string
          description: 데이터 충분도. `INSUFFICIENT`는 "데이터 부족"으로 표시한다
          enum:
            - NORMAL
            - INSUFFICIENT
      example:
        ottServiceId: 1
        code: NETFLIX
        name: 넷플릭스
        logoPath: /rK1KljqmbvO9HQa1PBFLILWah72.png
        displayOrder: 1
        dataQuality: NORMAL
    CommonResponseOttServiceList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/OttService'
      example:
        success: true
        data:
          - ottServiceId: 1
            code: NETFLIX
            name: 넷플릭스
            logoPath: /rK1KljqmbvO9HQa1PBFLILWah72.png
            displayOrder: 1
            dataQuality: NORMAL
          - ottServiceId: 2
            code: DISNEY_PLUS
            name: 디즈니+
            logoPath: /5eZ872CghnHFLB1j8grszbrx0dx.png
            displayOrder: 2
            dataQuality: NORMAL
          - ottServiceId: 3
