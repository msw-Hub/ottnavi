    ApplyOverviewDraftItem:
      type: object
      description: 초안 한 건의 반영 결과
      required:
        - draftId
        - titleId
        - outcome
        - reason
      properties:
        draftId:
          type: string
          description: 초안 ID
        titleId:
          type: integer
          format: int64
          nullable: true
          description: 작품 ID. 초안이 없어 건너뛰었으면 `null`
        outcome:
          type: string
          description: APPLIED 반영함 / SKIPPED 건너뜀
          enum:
            - APPLIED
            - SKIPPED
        reason:
          type: string
          nullable: true
          description: 건너뛴 이유(SKIPPED일 때만, 그 밖에는 `null`). DRAFT_NOT_FOUND 초안이 없음 / GUARD_FAILED 자동 검사에서 걸림 / ORIGINAL_CHANGED 번역한 뒤 줄거리가 바뀌었거나 이미 한국어
          enum:
            - DRAFT_NOT_FOUND
            - GUARD_FAILED
            - ORIGINAL_CHANGED
      example:
        draftId: 3f2b8c1e-5d4a-4c6b-9a7e-1b2c3d4e5f60
        titleId: 1024
        outcome: APPLIED
        reason: null
