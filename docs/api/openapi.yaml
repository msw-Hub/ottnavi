        오류: `VALIDATION_FAILED`(400, MAPPED인데 서비스 없음·없는 서비스·providerId가 1 미만 등), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 제공처), `INTERNAL_ERROR`(500).
