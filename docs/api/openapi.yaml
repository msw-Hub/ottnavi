    BulkDraftRun:
      type: object
      description: 일괄 번역 진행 상황(최근 1건만 보관)
      required:
        - bulkRunId
        - state
        - total
        - doneCount
        - failedCount
        - guardFailedCount
        - stopReason
        - startedAt
        - finishedAt
        - warningCount
      properties:
        bulkRunId:
          type: string
          description: 일괄 ID(UUID 문자열)
        state:
          type: string
          description: RUNNING 실행 중 / COMPLETED 끝까지 처리 / STOPPED 도중에 멈춤(`stopReason` 참고)
          enum:
            - RUNNING
            - COMPLETED
            - STOPPED
        total:
          type: integer
          format: int32
          description: 처리할 작품 수
        doneCount:
          type: integer
          format: int32
          description: 초안을 만든 작품 수(자동 검사에서 실패한 것·주의인 것 포함)
        failedCount:
          type: integer
          format: int32
          description: 초안을 만들지 못한 작품 수(호출 실패, 영어 줄거리가 아님, 쿨다운 등)
        guardFailedCount:
          type: integer
          format: int32
          description: doneCount 중 자동 재시도까지 마친 최종 결과가 실패(FAILED)인 작품 수
        stopReason:
          type: string
          nullable: true
          description: |
            멈춘 이유(`state`가 STOPPED일 때만, 그 밖에는 `null`). DISABLED Gemini 키 없음 / RATE_LIMITED 분당 상한 또는 구글 429 / DAILY_LIMIT 하루 상한 /
            DRAFT_LIMIT 대기 초안 가득 참 / CALL_FAILED_REPEATED 호출 실패 3번 연속 / SERVER_RESTARTED 실행 중 서버가 다시 시작됨
          enum:
            - DISABLED
            - RATE_LIMITED
            - DAILY_LIMIT
            - DRAFT_LIMIT
            - CALL_FAILED_REPEATED
            - SERVER_RESTARTED
        startedAt:
          type: string
          format: date-time
          description: 시작 시각
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: 끝난 시각(실행 중이면 `null`)
        warningCount:
          type: integer
          format: int32
          description: doneCount 중 자동 재시도까지 마친 최종 결과가 주의(WARNING)인 작품 수
      example:
        bulkRunId: 9a1c7d52-0b8e-4f3a-8d6c-2e5f7a9b1c3d
        state: RUNNING
        total: 100
        doneCount: 37
        failedCount: 1
        guardFailedCount: 3
        stopReason: null
        startedAt: '2026-10-29T10:00:00+09:00'
        finishedAt: null
        warningCount: 5
    CommonResponseBulkDraftRun:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/BulkDraftRun'
      example:
        success: true
        data:
          bulkRunId: 9a1c7d52-0b8e-4f3a-8d6c-2e5f7a9b1c3d
