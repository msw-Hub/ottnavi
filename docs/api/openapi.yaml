            - { mediaType: movie, tmdbId: 838209, title: 파묘, seasonNumber: null, ottServiceId: 2, previousStatus: null, currentStatus: AVAILABLE }
    CreateCollectExecutionRequest:
      type: object
      description: 수집 실행 요청
