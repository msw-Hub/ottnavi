        tmdbId: 93405
        seasonNumber: 1
        priority: MUST
    AddWishlistItemResult:
      type: object
      description: 찜 추가 결과. 이미 찜한 작품(시즌)이면 기존 항목 ID다
      required:
        - wishlistItemId
      properties:
        wishlistItemId:
          type: integer
          format: int64
          description: 찜 항목 ID
    CommonResponseAddWishlistItemResult:
