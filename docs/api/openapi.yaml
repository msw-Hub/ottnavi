      type: object
      description: 번역 줄거리 대량 되돌리기 결과
      required:
        - revertedCount
        - isPreview
      properties:
        revertedCount:
          type: integer
          format: int64
          description: 영어로 되돌린 작품 수. 대상이 없으면 0. 줄거리가 비워졌고 다음 수집이 TMDB 영어 줄거리를 다시 채운다. 미리보기(`isPreview`)면 되돌려질 작품 수이고 아무것도 바뀌지 않았다
        isPreview:
          type: boolean
          description: 미리보기 요청이었는지. `true`면 DB를 바꾸지 않았다
      example:
