openapi: 3.0.3
info:
  title: OTT내비 API
  description: |
    OTT내비(ottnavi) 백엔드와 프론트엔드 사이의 계약이다. 이 파일이 유일한 근거이며, 변경 절차는 `.claude/rules/api-contract.md`를 따른다.
    - operation은 61개이고 모두 구현됐다(시스템 메모리 지표 조회 관리자 API `getSystemMetrics`(ADMIN 전용), 영어 줄거리 한국어 번역 관리자 API 9개 `listOverviewCandidates`·`createOverviewDraft`·`listOverviewDrafts`·`createBulkOverviewDrafts`·`applyOverviewDrafts`·`editOverviewDraft`·`deleteOverviewDraft`·`revertTitleOverview`·`revertTranslatedOverviews`,Task 110의 알림 메일 예시 조회 `getCurrentPlanMailPreview`, Task 109의 데모 로그인 `loginDemo`, Task 073의 알림 설정·이력·관리자 요약 4개, Task 107의 홈·탐색 공개 조회 6개와 인기 수집 시작 `createPopularityExecution`, Task 082의 탈퇴 `withdrawMe`, Task 078의 서비스별 독점 목록 `listServiceExclusiveTitles` 포함). 미구현 operation에는 `x-planned: true`를 달고 description에 "제안"을 표시하며, 구현하는 PR에서 표시를 지운다.
    - 성공 응답은 `CommonResponse` 래퍼, 본문 없는 성공은 204(래퍼 없음), 오류 응답은 `application/problem+json`(ProblemDetail + `errorCode`)이다.
    - 각 operation의 description에 발생할 수 있는 `errorCode`를 적는다. 전체 목록은 `docs/api/error-codes.md`다.
  version: 0.1.0
servers:
  - url: /api
    description: 상대 경로. 배포는 Vercel rewrite, 로컬은 Vite proxy가 백엔드로 전달한다
tags:
  - name: catalog
    description: 작품 검색·상세, 홈·탐색 공통 목록 (공개)
  - name: user
    description: 내 설정·구독 상태 (`/api/me/**`)
  - name: wishlist
    description: 찜·우선순위·시청 체크
  - name: product
    description: OTT 서비스·상품·가격
  - name: plan
    description: 플랜 계산·저장·조회
  - name: auth
    description: 로그인·재발급·로그아웃 (`/api/auth/**`)
  - name: notification
    description: 알림 설정·이력 (2단계)
  - name: admin
    description: 관리자 (수집·매핑·상품·가격)
paths:
  /public/ott-services:
    get:
      tags:
        - product
      operationId: listOttServices
      security: []
      summary: OTT 서비스 목록 조회
      description: |
        국내 OTT 7개 서비스를 `displayOrder` 순으로 반환한다. 비로그인 공개 API(요청 제한 적용).
        쿠팡플레이는 `dataQuality`가 `INSUFFICIENT`(데이터 부족)다.
      responses:
        '200':
          description: 서비스 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseOttServiceList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/ott-services/{ottServiceId}/exclusive-titles:
    get:
      tags:
        - catalog
      operationId: listServiceExclusiveTitles
      security: []
      summary: 서비스별 독점 목록 조회
      description: |
        "확인된 범위에서 7개 서비스 중 이 서비스에서만 구독으로 볼 수 있는 작품"을 한 페이지 돌려준다(PRD FR-04). 순서는 작품 자체의 개봉일(영화 개봉일, 드라마 첫 방영일)이 오늘(KST) 기준 최근 6개월 이내인 작품이 먼저이고, 그다음 오래된 작품, 개봉일이 미래이거나 모르는 작품이 맨 뒤다. 각 그룹 안은 TMDB 인기도 높은 순이다. 비로그인 공개 API(요청 제한 적용).
        수집이 끝날 때 미리 계산해 서버 캐시에 두며, 캐시가 비어 있으면 그 자리에서 계산한다. 독점은 시즌(시청 단위) 단위로 판정하므로 드라마는 독점 시즌 번호(`exclusiveSeasonNumbers`)를 함께 준다.
        다른 서비스가 "없음"이거나 "모름"이면 독점으로 본다. "모름"인 서비스 수는 `unknownElsewhereCount`로 알려 화면이 "다른 곳에도 있을 수 있음"을 표시하게 한다.
        쿠팡플레이 영화처럼 구조적으로 알 수 없는 서비스는 비교에서 빼므로(`comparedServiceCount`에 세지 않는다) 영화는 보통 5곳, 드라마는 6곳과 비교한다.
        데이터 부족 서비스(`dataQuality`가 `INSUFFICIENT`, 쿠팡플레이)도 같은 규칙으로 판정한다. 쿠팡플레이 영화는 구조적으로 알 수 없어 판정하지 않으므로 목록에는 드라마(시즌)만 나오고, 화면은 서비스 목록의 `dataQuality`로 "영화는 판정하지 못했다"를 안내한다. 없는 서비스 ID만 404다.
        오류: `VALIDATION_FAILED`(400, 경로·page/size 범위 오류), `OTT_SERVICE_NOT_FOUND`(404), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      parameters:
        - name: ottServiceId
          in: path
          description: 서비스 ID(서비스 목록 API의 `ottServiceId`)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 서비스의 독점 목록 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseExclusiveTitlePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== catalog (공개) =====
  /public/titles:
    get:
      tags:
        - catalog
      operationId: searchTitles
      security: []
      summary: 작품 검색
      description: |
        제목(한국어·원제)에 검색어가 들어간 작품을 찾는다(대소문자 구분 없는 부분 일치). 비로그인 공개 API(요청 제한 적용).
        **DB에 저장된 작품만 대상**이며 TMDB를 호출하지 않는다. 결과 순서는 개봉일이 오늘(KST) 기준 최근 2년 이내인 작품이 먼저이고, 그다음 오래된 작품, 개봉일이 미래이거나 모르는 작품이 맨 뒤다. 각 그룹 안은 인기도 높은 순이다(같으면 먼저 저장된 작품 먼저).
        서비스별 상태(`availabilities`)는 7개 서비스를 서비스 ID 순으로 모두 담는다. 드라마는 시즌 중 하나라도 제공되면 AVAILABLE이고, 판정이 없는 서비스는 UNKNOWN이다.
        `dataAsOf`는 이 페이지 작품들의 판정 확인일(KST) 중 가장 오래된 날짜다(결과가 없으면 전체 판정의 최신 확인일).
        `isExternalCollectFailed`는 단건 수집(DB에 없는 작품을 TMDB에서 가져오는 기능)을 도입하기 전까지 항상 `false`다. 필드는 호환을 위해 유지한다.
        페이지네이션 응답(`content`, `page`, `size`, `totalElements`, `totalPages`)이다.
        오류: `VALIDATION_FAILED`(400, 검색어 없음·page/size 범위 밖), `INVALID_REQUEST`(400), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      parameters:
        - name: q
          in: query
          description: 검색어(제목). 앞뒤 공백을 뺀 뒤 1자 이상
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 검색 결과 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseTitleSearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/titles/{mediaType}/{tmdbId}:
    get:
      tags:
        - catalog
      operationId: getTitleDetail
      security: []
      summary: 작품 상세 조회
      description: |
        TMDB 기준(`mediaType` + `tmdbId`)으로 작품 상세와 서비스별 제공 상태를 조회한다. 드라마는 시즌별 정보와 시즌별 제공 상태를 함께 준다. 비로그인 공개 API(요청 제한 적용).
        **DB에 저장된 작품만 조회**하며, 없으면 TMDB를 호출하지 않고 `TITLE_NOT_FOUND`(404)로 응답한다. 응답은 서버에서 24시간 캐시되고 수집이 끝나면 갱신된다.
        `mediaType`은 소문자(`movie`/`tv`)만 받는다. 출연진은 출연 순서 상위 10명, 시즌은 시즌 번호 순이다.
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류), `TITLE_NOT_FOUND`(404), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
        `EXTERNAL_API_ERROR`(502)는 단건 수집(DB에 없는 작품을 TMDB에서 가져오는 기능)을 도입할 때 쓸 응답이며, 현재는 발생하지 않는다.
      parameters:
        - $ref: '#/components/parameters/MediaTypePath'
        - $ref: '#/components/parameters/TmdbIdPath'
      responses:
        '200':
          description: 작품 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseTitleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  # ===== catalog: 홈·탐색 공통 목록 (공개, Task 107. 개인화 없이 모두에게 같은 목록) =====
  /public/popularity-rankings:
    get:
      tags:
        - catalog
      operationId: listPopularityRankings
      security: []
      summary: 서비스별 인기 순위 조회
      description: |
        서비스별 인기 순위를 `TODAY`(가장 최근 스냅샷 하루) 또는 `WEEK`(최근 7일 스냅샷의 TMDB 인기도 평균)로 돌려준다. 비로그인 공개 API(요청 제한 적용).
        순위는 TMDB `discover`(한국 제공처, 서비스 제공처 필터, 한국 제작 작품 `with_origin_country=KR`, 첫 공개일 최근 2년 이내, 인기순)를 하루 한 번 받아 쌓은 일별 스냅샷으로 만든다. 해외 장수 작품은 들어가지 않으며, 필터 때문에 20개가 안 차거나 비는 서비스·매체도 있다. **최근 2년 안에 공개된 한국 작품 중 TMDB 인기도 순이며 OTT 공식 순위가 아니다**(`notice`에 화면 표기용 문구를 담는다). 서비스마다 영화·드라마를 합쳐 인기도 높은 순 상위 `limit`개이고, `ottServiceId`를 생략하면 7개 서비스 전체에서 같은 작품을 한 번만 세어 순위를 매긴다.
        `WEEK`는 가장 최근 스냅샷 날짜까지 7일 범위에서 스냅샷이 있는 날 수(`daysCounted`)로 나눈 평균이고, 그날 상위권에 없던 작품은 그날을 0으로 센다(한 번 반짝 오른 작품이 부풀려지지 않는다). 공개 직후 7일 미만이면 `daysCounted`가 7보다 작다. `ottServiceId`를 지정하면 최신 날짜와 `daysCounted` 모두 그 서비스의 기록만으로 구한다(다른 서비스만 기록된 날은 세지 않는다). 동률이면 가장 최근 날 인기도, TMDB ID 순이다. 스냅샷이 하나도 없으면 `items`는 빈 배열, `snapshotDate`는 null이다(화면은 줄을 숨긴다).
        작품 정보(`title`)는 우리 DB에 수집된 작품이면 서비스별 제공 상태(`availabilities`)가 채워지고, 아직 수집되지 않은 작품은 `availabilities`가 빈 배열이다(그런 작품의 상세는 `TITLE_NOT_FOUND`(404)일 수 있다).
        응답은 브라우저가 약 1분 캐시할 수 있다.
        오류: `VALIDATION_FAILED`(400, `period` 값·`limit` 범위 오류), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      parameters:
        - name: period
          in: query
          description: 순위 기간. 기본 `TODAY`
          required: false
          schema:
            $ref: '#/components/schemas/PopularityPeriod'
        - name: ottServiceId
          in: query
          description: 서비스 내부 ID. 생략하면 7개 서비스 전체 순위
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          description: 돌려줄 순위 개수(기본 20, 최대 20)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: 인기 순위
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePopularityRanking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/wishlisted-titles:
    get:
      tags:
        - catalog
      operationId: listWishlistedTitles
      security: []
      summary: 찜 많은 작품 조회
      description: |
        찜한 사용자 수가 많은 작품을 많은 순으로 돌려준다. 비로그인 공개 API(요청 제한 적용). 응답은 브라우저가 약 1분 캐시할 수 있다.
        사용자 수는 작품 단위로 센다(드라마는 시즌을 여러 개 찜해도 한 명). "다 봤음"으로 체크한 찜은 세지 않고, **숫자만 노출**하며 누가 찜했는지는 알 수 없다. 사용자가 `minUserCount`명보다 적은 작품은 목록에서 뺀다(개인 식별 방지, 설정값 `app.home.min-wishlist-users`, 기본 3). 조건을 채운 작품이 없으면 `items`는 빈 배열이고 화면은 줄을 숨긴다.
        동률이면 먼저 저장된 작품이 앞에 온다. `dataAsOf`는 제공 상태의 데이터 기준일(KST)이다.
        오류: `VALIDATION_FAILED`(400, `limit` 범위 오류), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      parameters:
        - name: limit
          in: query
          description: 돌려줄 작품 수(기본 10, 최대 20)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: 찜 많은 작품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseWishlistedTitleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/newly-available-titles:
    get:
      tags:
        - catalog
      operationId: listNewlyAvailableTitles
      security: []
      summary: 새로 볼 수 있게 된 작품 조회
      description: |
        최근 서비스에서 새로 볼 수 있게 된 작품을 돌려준다. 순서는 작품 자체의 개봉일(영화 개봉일, 드라마 첫 방영일)이 오늘(KST) 기준 최근 6개월 이내인 작품이 먼저이고, 그다음 오래된 작품, 개봉일이 미래이거나 모르는 작품이 맨 뒤이며 각 그룹 안은 `availableSince` 최신순이다(같으면 작품 ID, 서비스 ID 순). `limit`은 이 순서로 자른다. 비로그인 공개 API(요청 제한 적용). 응답은 브라우저가 약 1분 캐시할 수 있다.
        두 경우를 묶는다. (1) `ARRIVAL`(입고): 최근 14일 안에 제공 상태가 없음·모름에서 있음(AVAILABLE)으로 바뀐 기록이 있는 작품. (2) `RELEASE`(공개): 우리가 처음 수집하며 바로 있음으로 적재된 작품이지만 공개일(영화 개봉일, 드라마는 시즌 공개일)이 최근 30일 이내인 작품. 첫 적재인데 공개일을 모르면 제외한다.
        `availableSince`는 `ARRIVAL`이면 있음으로 바뀐 것을 확인한 날(KST), `RELEASE`면 공개일이다. 실제 서비스에 들어온 날이 아니라 **우리가 확인한 범위**의 날짜다. 같은 작품이 같은 서비스에 여러 번 해당하면(예: 시즌 여러 개) 가장 최근 하나만 담는다.
        `ottServiceId`를 주면 그 서비스만 돌려준다. 결과가 없으면 `items`는 빈 배열이다.
        오류: `VALIDATION_FAILED`(400, `limit` 범위 오류), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      parameters:
        - name: ottServiceId
          in: query
          description: 서비스 내부 ID. 생략하면 7개 서비스 전체
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          description: 돌려줄 작품 수(기본 20, 최대 50)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 새로 볼 수 있게 된 작품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseNewlyAvailableTitleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/genres:
    get:
      tags:
        - catalog
      operationId: listGenres
      security: []
      summary: 장르 목록 조회
      description: |
        탐색 화면의 장르 선택에 쓸 장르 목록이다. 우리 DB에 작품이 하나 이상 연결된 장르만 이름 가나다순으로 돌려준다. 비로그인 공개 API(요청 제한 적용). 응답은 브라우저가 약 1분 캐시할 수 있다.
        오류: `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 장르 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseGenreList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/genres/{genreId}/titles:
    get:
      tags:
        - catalog
      operationId: listGenreTitles
      security: []
      summary: 장르별 작품 조회
      description: |
        장르(`genreId`)에 속한 작품을 한 페이지 돌려준다. 순서는 작품 검색과 같다(최근 2년 개봉작 먼저, 그다음 오래된 작품, 개봉일이 미래·모름은 맨 뒤, 각 그룹 안은 인기도 높은 순). **우리 DB에 수집된 작품만** 대상이라 "7개 서비스에서 확인된 범위"이며 TMDB를 호출하지 않는다. 비로그인 공개 API(요청 제한 적용).
        없는 `genreId`는 404가 아니라 빈 결과다. 페이지 크기 기본 20. 응답은 브라우저가 약 1분 캐시할 수 있다.
        오류: `VALIDATION_FAILED`(400, 경로·page/size 범위 오류), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      parameters:
        - name: genreId
          in: path
          description: TMDB 장르 ID(장르 목록 API의 `genreId`)
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 장르별 작품 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseTitleExplorePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/people/titles:
    get:
      tags:
        - catalog
      operationId: listPersonTitles
      security: []
      summary: 인물(출연자)별 작품 조회
      description: |
        이름이 `name`과 같은(대소문자 구분 없음) 출연자가 나온 작품을 한 페이지 돌려준다. 순서는 작품 검색과 같다(최근 2년 개봉작 먼저, 그다음 오래된 작품, 개봉일이 미래·모름은 맨 뒤, 각 그룹 안은 인기도 높은 순). 우리 DB에 저장된 출연진(작품당 출연 순서 상위 10명)만 조회하며 TMDB 인물 검색은 쓰지 않는다. 비로그인 공개 API(요청 제한 적용).
        그래서 결과는 "7개 서비스에서 확인된 범위"이고, 같은 이름의 다른 사람이 섞일 수 있으며 출연 순서 10번째 밖의 출연작은 빠진다(화면이 안내 문구로 알린다).
        오류: `VALIDATION_FAILED`(400, 이름 없음·page/size 범위 오류), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      parameters:
        - name: name
          in: query
          description: 출연자 이름. 앞뒤 공백을 뺀 뒤 1자 이상
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 인물별 작품 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseTitleExplorePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== wishlist =====
  /me/wishlist-items:
    get:
      tags:
        - wishlist
      operationId: listWishlistItems
      security:
        - bearerAuth: []
      summary: 내 찜 목록 조회
      description: |
        내 찜을 최근에 찜한 순으로 전부 돌려준다. 드라마는 시즌 단위로 한 항목씩이다(R11-19).
        "다 봤음" 항목(`watchedAt`이 있음)도 목록에 포함하되 `activeItemCount`에는 세지 않는다(PRD 11절 36번).
        페이지네이션은 두지 않는다. 계산 대상 찜은 20개로 막히고, "다 봤음" 항목은 상한이 없지만 사용자가 직접 체크해야 늘어나 증가가 느리다. 많아져 문제가 되면 "다 봤음"만 따로 나눠 조회하는 API를 추가한다.
        오류: `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 찜 목록과 현재 개수·상한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseWishlistItemList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - wishlist
      operationId: addWishlistItem
      security:
        - bearerAuth: []
      summary: 찜 추가
      description: |
        작품(드라마는 시즌)을 찜한다. 새로 만들면 201, 같은 작품(시즌)이 이미 찜돼 있으면 새로 만들지 않고 기존 항목 ID와 함께 200을 준다(PRD FR-09 "중복 추가는 무시"). 중복이면 기존 우선순위·"다 봤음" 상태를 바꾸지 않는다(우선순위 변경은 PATCH).
        드라마(`tv`)는 `seasonNumber`가 필수이고 영화(`movie`)는 `null`이어야 한다. 작품은 검색·상세 조회로 이미 저장된 것이어야 한다(찜 추가는 TMDB를 호출하지 않는다).
        "다 봤음"이 아닌 찜이 이미 20개면 새로 추가할 수 없다(PRD 11절 36번). 이미 20개여도 중복 추가는 409가 아니라 200이다(PRD FR-09).
        오류: `VALIDATION_FAILED`(400, 필드 누락·영화/드라마와 seasonNumber 불일치), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `TITLE_NOT_FOUND`(404, 작품 또는 시즌 없음), `WISHLIST_LIMIT_EXCEEDED`(409), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWishlistItemRequest'
      responses:
        '200':
          description: 이미 찜한 작품(시즌). 기존 항목 ID를 돌려준다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAddWishlistItemResult'
        '201':
          description: 새로 찜함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAddWishlistItemResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/wishlist-items/{wishlistItemId}:
    patch:
      tags:
        - wishlist
      operationId: updateWishlistItem
      security:
        - bearerAuth: []
      summary: 찜 우선순위·"다 봤음" 변경
      description: |
        보낸 필드만 바꾼다(하나 이상 필요). `isWatched: true`면 "다 봤음"으로 표시해 `watchedAt`을 기록하고 계산에서 뺀다. `false`면 되돌린다. 이미 같은 상태면 그대로 둔다(이미 "다 봤음"인 항목에 `true`를 보내도 `watchedAt`은 처음 값 유지).
        되돌릴 때 "다 봤음"이 아닌 찜이 이미 20개면 되돌릴 수 없다(PRD 11절 36번).
        오류: `VALIDATION_FAILED`(400, 빈 요청·잘못된 값·경로 ID 형식 오류), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `WISHLIST_ITEM_NOT_FOUND`(404, 없거나 본인 찜이 아님), `WISHLIST_LIMIT_EXCEEDED`(409), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/WishlistItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWishlistItemRequest'
      responses:
        '200':
          description: 바뀐 찜 항목의 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseUpdatedWishlistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - wishlist
      operationId: removeWishlistItem
      security:
        - bearerAuth: []
      summary: 찜 삭제
      description: |
        찜을 삭제한다. 이미 없는 항목(또는 본인 것이 아닌 항목)도 오류 없이 204다(여러 번 해도 결과가 같다).
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류), `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/WishlistItemIdPath'
      responses:
        '204':
          description: 삭제됨(본문 없음)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== user =====
  /me:
    delete:
      tags:
        - user
      operationId: withdrawMe
      security:
        - bearerAuth: []
      summary: 회원 탈퇴
      description: |
        로그인한 본인의 계정을 즉시 영구 삭제한다. 대기 기간이나 복구는 없다(PRD FR-07).
        찜, 서비스 구독 상태, 직접 고친 요금, 플랜(변경 내역 포함)이 함께 삭제된다. 계산 기록(`calc_run`)은 통계용으로 남고 플랜 연결(`plan_id`)만 비워진다.
        서버는 그 사용자의 Refresh Token 계열을 지우고 쿠키(`rt`, `Path=/api/auth`)를 만료시킨다. 프론트는 응답을 받으면 메모리의 Access Token과 쿼리 캐시를 비우고 첫 화면으로 이동한다(로그아웃과 같은 정리).
        요청 본문은 없다. Access Token은 만료(30분) 전이라도 탈퇴한 계정으로는 쓸 수 없다: 같은 토큰으로 다시 탈퇴하거나 설정 저장·찜 추가 같은 쓰기를 하면 사용자를 찾을 수 없어 `UNAUTHORIZED`이고, 내 설정 조회는 온보딩 전 상태(200)로 보인다.
        데모 계정(`role: DEMO`)은 여러 사람이 함께 쓰는 공용 계정이라 탈퇴할 수 없다(403 `FORBIDDEN`).
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403, 데모 계정), `INTERNAL_ERROR`(500).
      responses:
        '204':
          description: 탈퇴됨(본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/settings:
    get:
      tags:
        - user
      operationId: getMySettings
      security:
        - bearerAuth: []
      summary: 내 설정 조회
      description: |
        서비스별 이용 상태, 월 예산, 월 시청 시간을 조회한다. 온보딩 전이면 `isOnboardingDone: false`이고 나머지 값은 비어 있다(`subscriptions` 빈 배열, 나머지 `null`).
        온보딩 뒤에는 `subscriptions`에 서비스 7개가 모두 온다. 미구독은 저장 행이 없으므로(PRD FR-08) 서버가 `NOT_SUBSCRIBED`로 채운다.
        요금 화면(SCR-09)의 예산·시청 시간 요약도 이 API로 가져온다.
        오류: `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 내 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseUserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - user
      operationId: updateMySettings
      security:
        - bearerAuth: []
      summary: 내 설정 저장
      description: |
        설정 전체를 저장한다. 처음 저장하면 온보딩이 끝난 것으로 본다(`isOnboardingDone: true`).
        시청 시간은 분 단위 결과(`monthlyWatchMinutes`)와 고른 방식(`watchPreset`)만 저장한다. "주 N회 × 회당 M시간" 환산 입력값은 저장하지 않는다(R11-18 A안).
        `subscriptions`에 없는 서비스는 미구독으로 본다. `SUBSCRIBED`인데 `billingDay`가 `null`이면 1일로 저장한다(PRD FR-08 결제일 기본값 1일).
        오류: `VALIDATION_FAILED`(400, 예산 음수·시청 시간 범위 밖·구독 중인데 요금제 이름 없음·구독 중이 아닌데 요금제 이름이나 결제일을 보냄·없는 서비스·같은 서비스 중복 등), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMySettingsRequest'
      responses:
        '200':
          description: 저장된 내 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseUserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== product (내 요금) =====
  /me/service-prices:
    get:
      tags:
        - product
      operationId: listMyServicePrices
      security:
        - bearerAuth: []
      summary: 내 서비스별 월 요금 조회
      description: |
        서비스별 기본 월 요금(관리자 등록), 내가 고친 금액, 계산에 쓰는 적용 금액, 그리고 요금 적용 시작일·마지막 확인일을 서비스 ID 순으로 돌려준다.
        판매 중인 상품만 주며, 항목마다 `productId`가 있어 요금 수정·삭제 API가 이 값으로 상품을 정한다. 판매 중인 상품이 없는 서비스는 목록에서 빠진다. 판매 중이어도 현재 적용 중인 요금이 없는 상품(첫 요금 이력이 미래 등)은 목록에서 빠지며, 그 상품의 수정·삭제는 404 `SERVICE_PRICE_NOT_FOUND`다.
        기본 월 요금은 오늘 적용 중인 월 구독요금 이력이다. 계산은 달마다 사용자 결제일에 적용 중인 요금을 쓰므로(PRD 11절 40번) 예정된 인상이 있으면 이후 달의 계산 금액과 다를 수 있다.
        내가 고친 금액은 상품 단위로 저장된다(ERD `user_price_override`). 관리자가 상품을 판매 종료하고 새 상품을 등록하면 고친 금액은 새 상품에 이어지지 않는다.
        마지막 확인일이 90일을 넘으면 화면이 "요금이 달라졌을 수 있어요" 안내를 붙인다(PRD 11절 41번).
        오류: `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 서비스별 요금
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseServicePriceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/service-prices/{productId}:
    put:
      tags:
        - product
      operationId: setMyServicePrice
      security:
        - bearerAuth: []
      summary: 내 월 요금 설정
      description: |
        이 상품의 월 요금을 내가 아는 금액으로 고친다(FR-11). 이후 계산은 이 금액을 쓴다(`priceSource: USER_OVERRIDE`). 관리자 요금표는 바뀌지 않는다.
        상품 ID로 대상을 정하므로 한 서비스에 상품이 여러 개 생기는 2단계(광고형·번들)에도 이 주소는 바뀌지 않는다.
        오류: `VALIDATION_FAILED`(400, 0원 미만·100만 원 초과·정수 아님), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `SERVICE_PRICE_NOT_FOUND`(404, 요금을 고칠 수 있는 상품이 아님: 없는 상품이거나 판매 종료, 현재 적용 중인 요금이 없는 판매 중 상품도 포함하며 목록에서는 이런 상품이 빠진다), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMyServicePriceRequest'
      responses:
        '200':
          description: 바뀐 서비스 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseServicePrice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - product
      operationId: resetMyServicePrice
      security:
        - bearerAuth: []
      summary: 내 월 요금 지우기(기본 요금으로 복귀)
      description: |
        내가 고친 금액을 지우고 기본 요금으로 되돌린다. 고친 금액이 없어도 204다.
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류), `UNAUTHORIZED`(401), `SERVICE_PRICE_NOT_FOUND`(404, 요금을 고칠 수 있는 상품이 아님: 없는 상품이거나 판매 종료, 현재 적용 중인 요금이 없는 판매 중 상품도 포함하며 목록에서는 이런 상품이 빠진다), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '204':
          description: 기본 요금으로 되돌림(본문 없음)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== plan =====
  /me/plan-drafts:
    post:
      tags:
        - plan
      operationId: createPlanDrafts
      security:
        - bearerAuth: []
      summary: 플랜 계산(초안 3종 생성)
      description: |
        내 찜·설정·요금으로 3개월 플랜을 계산해 플랜 유형(`RECOMMENDED`·`SAVER`·`SIMPLE`)마다 초안(DRAFT)을 하나씩, 항상 3개 만든다. 기존 초안은 덮어쓴다. 요청 본문은 없다.
        세 유형의 선택이 같으면 합쳐 보여 주는 것은 화면 몫이라 응답은 항상 3개다. `allSubscribeCost`·`savedAmount`는 세 유형이 같은 정의다(PRD 5.4, 11절 38번).
        계산 선행 조건(월 예산·월 시청 시간 입력, "다 봤음"이 아닌 찜 1개 이상)을 채우지 않으면 400이다(PRD FR-10).
        동기 처리다. 엔진은 순수 계산(CPU)이고 후보 조합이 상한을 넘으면 그리디로 바뀌어 시간이 묶이므로(TECH 1절, T-4) 응답 안에서 끝낸다. 같은 사용자의 동시 계산은 서버가 직렬화한다(TECH 2절).
        회원 API라 요청 제한(429)은 두지 않는다. 남용이 보이면 사용자별 제한을 추가하고 이 operation에 429를 단다.
        오류: `VALIDATION_FAILED`(400, 선행 조건 미충족), `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '201':
          description: 새로 만든 초안 3개
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanDraftList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - plan
      operationId: listPlanDrafts
      security:
        - bearerAuth: []
      summary: 플랜 초안 조회
      description: |
        지금 있는 내 초안을 조회한다. 계산 전이거나 저장한 뒤(나머지 DRAFT 삭제)에는 `drafts`가 빈 배열이다.
        계산 직후의 `POST /me/plan-drafts` 응답과 같은 내용·같은 순서(플랜 유형 `RECOMMENDED`·`SAVER`·`SIMPLE` 순)다. 상품 이름은 조회 시점의 이름이다.
        오류: `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 초안 목록(없으면 빈 배열)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanDraftList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/plans/current:
    get:
      tags:
        - plan
      operationId: getCurrentPlan
      security:
        - bearerAuth: []
      summary: 현재 플랜 조회
      description: |
        저장한 현재 플랜(ACTIVE)을 조회한다. 초안(`PlanDraft`)의 필드를 모두 담고 저장 시각(`activatedAt`)이 더해진다.
        저장한 플랜이 없으면 404가 아니라 200이고 `plan`이 `null`이다(아직 저장 전인 사용자의 정상 상태다).
        오류: `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 현재 플랜(없으면 `plan`이 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCurrentPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/plans/current/mail-preview:
    get:
      tags:
        - plan
      operationId: getCurrentPlanMailPreview
      security:
        - bearerAuth: []
      summary: 알림 메일 예시 조회(데모 계정 전용)
      description: |
        데모 계정(`role: DEMO`)이 저장한 현재 플랜(ACTIVE)으로 "플랜을 저장하면 이런 메일이 온다"를 보여 주는 예시 메일을 만든다.
        운영 알림과 같은 코드로 제목과 HTML 본문만 만들고, 메일을 보내거나 발송 대기열(outbox)에 쌓지 않는다. 알림 설정도 바꾸지 않는다.
        `mails`에는 구독 안내(`SUBSCRIBE_GUIDE`, 저장하면 오는 메일)와 월초 안내(`MONTHLY`, 매월 1일에 오는 메일) 순서로 만들 수 있는 것만 담긴다.
        현재 플랜이 없으면 `mails`가 비고 `noMailReasons`에 `NO_CURRENT_PLAN`이 담긴다. 이번 달에 새로 가입할 상품이 없거나 플랜의 첫 달이 이번 달이 아니면 구독 안내는 만들 수 없어 `NO_SUBSCRIBE_GUIDE`가 담기고 월초 안내만 온다(모두 200).
        `html`은 이메일용 완성 HTML이라 프론트는 `iframe srcDoc`에 `sandbox`(스크립트·same-origin 허용 없이)로만 보여 준다.
        데모 계정이 아니면 403이다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403, 데모 계정이 아님), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 예시 메일(만들 수 없는 메일은 사유와 함께 빠진다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanMailPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/plans:
    post:
      tags:
        - plan
      operationId: createPlan
      security:
        - bearerAuth: []
      summary: 플랜 저장(초안을 현재 플랜으로)
      description: |
        고른 초안(`planId`)을 ACTIVE로 저장한다. 기존 ACTIVE는 ARCHIVED가 되고 나머지 DRAFT는 삭제된다(TECH 2절).
        초안을 계산한 뒤 데이터 수집이 새로 끝났으면 409 `PLAN_DRAFT_STALE`이고, 프론트는 다시 계산을 요청한다.
        오류: `VALIDATION_FAILED`(400), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `PLAN_DRAFT_NOT_FOUND`(404, 없음·본인 초안이 아님·이미 저장돼 DRAFT가 아님·다시 계산해 지워짐), `PLAN_DRAFT_STALE`(409), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: 저장된 플랜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseSavedPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/plan-changes:
    get:
      tags:
        - plan
      operationId: listPlanChanges
      security:
        - bearerAuth: []
      summary: 플랜 변경 내역 조회
      description: |
        매월 재계산으로 현재 플랜이 바뀐 기록을 최신순으로 최대 6건 돌려준다(Task 068·069). 직접 저장한 플랜은 기록하지 않는다.
        기록은 두 플랜이 함께 다루는 달에서 구독 상품·요금이 달라졌거나 작품 자리가 바뀌었고, 그 이유(가격 변경·작품이 서비스에서 빠짐·작품이 서비스에 새로 들어옴·시청 체크)가 있을 때만 남는다.
        기록이 없으면 404가 아니라 200이고 `items`가 빈 배열이다. 페이지 파라미터는 없다. 요약·이유 문장은 서버가 만들고, 서비스 이름은 서비스 목록 API(`listOttServices`)로 상품의 `ottServiceIds`와 작품 자리의 `ottServiceId`를 풀어 쓴다.
        오류: `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 변경 내역(없으면 `items`가 빈 배열)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanChangeHistoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== notification: 알림 설정·발송 이력 (Task 071·073) =====
  /me/notification-setting:
    get:
      tags:
        - notification
      operationId: getMyNotificationSetting
      security:
        - bearerAuth: []
      summary: 알림 설정 조회
      description: |
        알림 수신 여부와 수신 이메일(계정 이메일)을 조회한다(SCR-12, FR-16). 알림은 기본 꺼짐이며(동의 없이 메일을 보내지 않는다), 온보딩 전이어도 200이고 `isNotificationEnabled: false`다.
        수신 이메일은 따로 입력받지 않고 로그인한 계정의 이메일이다.
        오류: `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: 알림 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseNotificationSetting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - notification
      operationId: updateMyNotificationSetting
      security:
        - bearerAuth: []
      summary: 알림 설정 저장
      description: |
        알림 수신 여부를 켜거나 끈다. 끄면 이후 알림이 생성되지 않는다(이미 대기 중인 알림은 발송된다). 켜는 것 자체로는 메일이 나가지 않는다.
        내 설정(온보딩)을 한 번도 저장하지 않았으면 저장할 설정 행이 없어 `ONBOARDING_REQUIRED`(409)다.
        데모 계정(`role: DEMO`)은 알림 설정을 바꿀 수 없다(403 `FORBIDDEN`). 데모 계정에는 알림이 만들어지지 않으며 조회(`getMyNotificationSetting`)는 항상 꺼짐이다.
        오류: `VALIDATION_FAILED`(400), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `FORBIDDEN`(403, 데모 계정), `ONBOARDING_REQUIRED`(409), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyNotificationSettingRequest'
      responses:
        '200':
          description: 저장된 알림 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseNotificationSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/notifications:
    get:
      tags:
        - notification
      operationId: listMyNotifications
      security:
        - bearerAuth: []
      summary: 알림 발송 이력 조회
      description: |
        내 알림 이력을 최신순으로 돌려준다(SCR-12, FR-16). 유형(`type`)과 상태(`status`: 대기 `PENDING`, 발송 `SENT`, 실패 `FAILED`), 만든 시각, 발송 시각만 담고 메일 본문 재료나 실패 사유는 담지 않는다.
        페이지네이션(`page`, `size`) 응답이다. 이력이 없으면 200이고 `content`가 빈 배열이다.
        오류: `VALIDATION_FAILED`(400), `UNAUTHORIZED`(401), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 알림 이력 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseNotificationHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== admin: OTT 구독상품·월 구독요금 =====
  /admin/products:
    get:
      tags:
        - admin
      operationId: listAdminProducts
      security:
        - bearerAuth: []
      summary: OTT 구독상품·월 구독요금 이력 조회
      description: |
        판매 종료 상품을 포함한 OTT 구독상품 전체와 각 상품의 월 구독요금 이력(적용 시작일이 빠른 순)을 돌려준다.
        적용 종료일은 저장하지 않는다. 화면이 "다음 요금 이력 시작일의 전날"로 계산하고 가장 최근 요금 이력은 "계속"이다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `INTERNAL_ERROR`(500).
      responses:
        '200':
          description: OTT 구독상품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAdminProductList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - admin
      operationId: createAdminProduct
      security:
        - bearerAuth: []
      summary: OTT 구독상품 등록
      description: |
        OTT 구독상품을 첫 월 구독요금과 함께 등록한다. 단품(`SINGLE`)은 서비스 1개, 번들(`BUNDLE`)은 서로 다른 서비스 2개 이상이다.
        번들 구성은 등록할 때만 정하며 편집 API는 없다(판매를 끝내고 새로 등록한다). 판매 중 번들은 최대 13개다.
        첫 요금 이력의 마지막 확인일은 오늘이고, 적용 시작일은 오늘 이하여야 한다.
        오류: `VALIDATION_FAILED`(400, 이름 비어 있음·서비스 개수가 종류와 안 맞음·서비스 중복·없는 서비스·판매 중 번들 13개 초과·금액 범위 밖·날짜 형식 오류), `INVALID_REQUEST`(400), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `PRICE_FIRST_START_DATE_IN_FUTURE`(409), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminProductRequest'
      responses:
        '201':
          description: 등록된 OTT 구독상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAdminProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/products/{productId}:
    patch:
      tags:
        - admin
      operationId: updateAdminProduct
      security:
        - bearerAuth: []
      summary: OTT 구독상품 이름·판매 여부 수정
      description: |
        보낸 필드만 바꾼다(하나 이상 필요). `isActive: false`는 판매 종료, `true`는 판매 재개다. 상품은 삭제하지 않는다(ERD).
