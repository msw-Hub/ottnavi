      properties:
        translatedBefore:
          type: string
          format: date-time
          nullable: true
          description: 이 시각보다 먼저 반영한 번역만 되돌린다. 없으면(생략·`null`) 번역 전부를 되돌린다
        isPreview:
          type: boolean
          default: false
          description: '`true`면 DB를 바꾸지 않고 되돌려질 작품 수만 센다(미리보기). 생략하면 `false`(실제로 되돌린다)'
      example:
        translatedBefore: '2026-04-29T00:00:00+09:00'
        isPreview: false
