          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== admin: 수집 (배치 토큰 범위 /admin/collect/**, TECH 3절) =====
  /admin/collect/executions:
    get:
      tags:
        - admin
      operationId: listCollectExecutions
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 수집 실행 이력 조회
      description: |
        수집 실행 이력을 대상 날짜 내림차순, 같으면 실행 ID 내림차순으로 돌려준다(Task 029 화면 정렬). 서버가 멈춰 기록만 "실행 중"으로 남은 실행은 서버가 `STOPPED`로 판정해 내려준다(저장하지 않고 조회할 때마다 판정한다).
        페이지네이션 응답이다. 수집은 매일 1회 이상 돌고 Spring Batch 메타데이터는 지우지 않으므로 이력이 계속 늘어난다.
        관리자(ADMIN) Access Token 또는 관리자 배치 토큰으로 호출한다(배치 토큰은 `/admin/collect/**`에서만 유효, TECH 4절).        오류: `VALIDATION_FAILED`(400, page/size 범위 밖), `UNAUTHORIZED`(401, 배치 토큰이 없거나 틀림), `FORBIDDEN`(403), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 실행 이력 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - admin
      operationId: createCollectExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 수집 실행 요청
      description: |
        수집 Job을 비동기로 시작하고 202와 새 `executionId`를 돌려준다. 결과는 실행 이력에서 본다. 관리자 화면과 GitHub Actions cron(관리자 배치 토큰)이 함께 쓴다(TECH 3절).
        MVP는 `tier: ALL`만 받는다. `targetDate`를 비우면 오늘(KST)이다. 날짜를 직접 지정하는 것은 설정 키 `app.collect.allow-target-date-override`가 true인 환경(로컬)에서만 허용하고(오늘 이하), 운영에서는 오늘(KST)만 받으며 다른 날짜를 보내면 400이다(TECH 3절 "무료 기간과 Hobby 전환 이후").
        수집은 전체에서 동시에 하나만 돈다. 같은 날짜·범위가 실행 중이면 물론 다른 날짜가 실행 중이어도, 매월 재계산이 실행 중일 때도 `BATCH_ALREADY_RUNNING`(409)이다(재계산이 끝난 뒤 다시 요청). 같은 날짜·범위의 상태(실행 중·중단됨·완료)를 먼저 보고, 그 뒤에 다른 실행이 도는지 본다.
        선택 값 `scope`(`AVAILABILITY_TV`)를 주면 후보·상세 Step을 건너뛰고 드라마 시즌 제공 상태 판정 Step만 실행한다(이미 모은 데이터에 새 판정 규칙을 다시 적용할 때). `targetDate`처럼 로컬에서만 받고 운영에서는 400(`fieldErrors.scope`)이다. 중복·재시작 판정은 날짜·범위·scope가 같은 실행끼리만 한다(같은 날짜에 전체 수집이 완료돼도 scope 실행은 새로 시작된다).
        같은 날짜·범위의 마지막 실행이 실패(`FAILED`)면 새 실행으로 다시 시작해 202다(Spring Batch는 같은 식별 파라미터로 시작하면 실패한 인스턴스를 재시작한다, TECH 3절 "실패한 실행은 같은 파라미터로 restart").
        오류: `VALIDATION_FAILED`(400, 본문 값 변환 실패(날짜 형식·모르는 `tier`·`scope` 값)와 미래 날짜·운영에서 오늘이 아닌 날짜는 `fieldErrors`로 필드를 알린다. `ALL`이 아닌 범위(`DAILY`·`WEEKLY`)는 `fieldErrors.tier`, 운영에서 `scope`를 지정하면 `fieldErrors.scope`), `INVALID_REQUEST`(400, 깨진 JSON처럼 필드를 특정할 수 없는 경우만), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `BATCH_ALREADY_RUNNING`(409, 같은 날짜·범위 또는 다른 날짜의 수집이 실행 중이거나 매월 재계산이 실행 중), `BATCH_ALREADY_COMPLETED`(409), `BATCH_RECOVERY_REQUIRED`(409, 같은 날짜·범위의 중단된 실행을 먼저 복구해야 함), `INTERNAL_ERROR`(500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectExecutionRequest'
      responses:
        '202':
          description: 실행 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/collect/executions/{executionId}/changes:
    get:
      tags:
        - admin
      operationId: listCollectExecutionChanges
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 실행별 제공 상태가 바뀐 작품 조회
      description: |
        이 실행에서 제공 상태가 바뀐 건(시청 단위 × 서비스, ERD `availability_change`)을 제목 순, 같으면 시즌 번호·서비스 ID 순으로 돌려준다. 끝나지 않은 실행은 빈 페이지일 수 있다.
        페이지네이션 응답이다. 첫 전체 수집은 모든 작품이 "처음 확인됨"이라 한 실행에 수천~수만 건이 생길 수 있다.
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류·page/size 범위 밖), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 실행), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 바뀐 작품 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionChangePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/collect/executions/{executionId}/recover:
    post:
      tags:
        - admin
      operationId: recoverCollectExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 중단된 실행을 실패로 복구
      description: |
        `STOPPED`(중단됨) 실행을 `FAILED`로 바꾸고 바뀐 실행을 돌려준다(TECH 3절). 요청 본문은 없다. 언제 멈췄는지 알 수 없어 `endedAt`은 `null`로 두고 `failureReason`은 고정 문구다.
        응답의 `canRestart`로 이어서 재시작할 수 있는지(`restartCollectExecution`) 바로 알 수 있다.
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 실행), `BATCH_NOT_STOPPED`(409, 중단된 실행이 아님), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
      responses:
        '200':
          description: 실패로 바뀐 실행
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/collect/executions/{executionId}/restart:
    post:
      tags:
        - admin
      operationId: restartCollectExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 실패한 실행을 새 실행으로 재시작
      description: |
        `FAILED` 실행을 같은 대상 날짜·범위로 다시 실행한다. 요청 본문은 없다. 새 실행으로 접수해 202와 새 `executionId`를 돌려주고, 실패 기록은 이력에 남는다.
        실패가 아닌 실행은 그 날짜·범위의 현재 상태에 맞는 코드로 거절한다: 실행 중이면 `BATCH_ALREADY_RUNNING`, 완료면 `BATCH_ALREADY_COMPLETED`, 중단됨이면 `BATCH_RECOVERY_REQUIRED`(먼저 복구). 그래서 "실패한 실행이 아님" 전용 코드는 두지 않는다. 같은 날짜·범위에 더 나중 실행이 있으면 그 실행의 상태로 판단한다.
        운영 환경에서는 그 실행의 대상 날짜가 오늘(KST)이 아니면 거절한다. 다른 날짜·범위의 수집이 실행 중이어도 시작할 수 없다(전체 동시 실행 금지).
        오류: `VALIDATION_FAILED`(400, 경로 값 형식 오류·운영에서 대상 날짜가 오늘이 아님), `UNAUTHORIZED`(401), `FORBIDDEN`(403), `RESOURCE_NOT_FOUND`(404, 없는 실행), `BATCH_ALREADY_RUNNING`(409, 같은 날짜·범위 또는 다른 날짜의 수집이 실행 중이거나 매월 재계산이 실행 중), `BATCH_ALREADY_COMPLETED`(409), `BATCH_RECOVERY_REQUIRED`(409), `INTERNAL_ERROR`(500).
      parameters:
        - $ref: '#/components/parameters/ExecutionIdPath'
      responses:
        '202':
          description: 재시작 접수됨(새 실행)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseCollectExecutionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== admin: 매월 재계산 (배치 토큰 범위 /admin/plans/monthly/**, TECH 4절) =====
  /admin/plans/monthly/executions:
    post:
      tags:
        - admin
      operationId: createPlanRecalcExecution
      security:
        - bearerAuth: []
        - adminBatchToken: []
      summary: 매월 재계산 수동 실행 요청
      description: |
        매월 재계산 Job을 비동기로 시작하고 202와 새 `executionId`를 돌려준다. 재계산은 수집이 끝나면 자동으로 이어 돌고, 이 API는 자동 실행이 실패했을 때 관리자가 다시 돌리는 복구용이다. 요청 본문은 없다.
        재계산이나 수집이 이미 실행 중이면 `BATCH_ALREADY_RUNNING`(409)이다. 관리자(ADMIN) Access Token 또는 관리자 배치 토큰으로 호출한다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `BATCH_ALREADY_RUNNING`(409), `INTERNAL_ERROR`(500).
      responses:
        '202':
          description: 실행 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanRecalcExecutionAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/plan-benchmarks:
    post:
      tags:
        - admin
      operationId: createPlanBenchmark
      security:
        - bearerAuth: []
      summary: 완전탐색·그리디 비교 측정 실행
      description: |
        정답 세트(입력과 기대 결과) 전체를 완전탐색·그리디 두 알고리즘으로 워밍업 1회 뒤 3회씩 측정해 `calc_run`에 케이스 × 알고리즘마다 1행(중앙값)을 남긴다. 한 번 호출에 21케이스 × 2 = 42행이다.
        요청 본문은 없다. 같은 입력으로 다시 호출하면 행이 더 쌓이고, 같은 `inputHash`에 EXACT·GREEDY 두 행이 함께 있다. 기록의 `plan_id`는 NULL, 플랜 유형은 추천형이다.
        ADMIN만 호출할 수 있고 배치 토큰은 허용하지 않는다. 수 초 걸리는 CPU 작업이라 응답이 느리다.
        완전탐색이 후보 조합 수 상한을 넘어 건너뛰어진 케이스는 저장하지 않고 `skippedCaseNames`에 이름을 담는다.
        오류: `UNAUTHORIZED`(401), `FORBIDDEN`(403), `INTERNAL_ERROR`(500, 정답 세트를 못 읽음·반복 결과가 서로 다름).
      responses:
        '201':
          description: 측정 결과(저장된 calc_run 행 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponsePlanBenchmark'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== auth =====
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshAccessToken
      security: []
      summary: Access Token 재발급
      description: |
        Refresh Token(HttpOnly 쿠키 `rt`)으로 새 Access Token과 사용자 권한(`role`)을 발급한다. 요청 본문은 없다. Refresh Token은 재발급 때 회전하며(새 쿠키, 수명은 그때부터 다시 14일), 응답 본문에는 담지 않는다(TECH 4절).
        직전 Refresh Token이 10초 안에 다시 오면(동시 요청·응답 유실) 회전 없이 Access Token만 발급한다(새 쿠키를 내리지 않는다). 유예가 지난 직전 토큰을 재사용하면 해당 계열을 무효화하고 401이다. 실패한 401 응답은 쿠키를 지운다.
        CSRF 방지를 위해 `Origin`이 프론트 주소와 같아야 한다(회전 전에 검사). 인증 경로도 공개 API와 같은 요청 제한을 받는다(`.claude/rules/backend.md`).
        오류: `UNAUTHORIZED`(401, 쿠키 없음·만료·무효·재사용 감지), `FORBIDDEN`(403, Origin 불일치), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500, Redis 장애 포함).
      responses:
        '200':
          description: 새 Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseAccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      security: []
      summary: 로그아웃
      description: |
        Refresh Token(HttpOnly 쿠키 `rt`)의 계열을 서버에서 폐기하고(현재 기기만) 쿠키를 지운다. 요청 본문은 없다. 쿠키가 없거나 이미 무효여도 204다.
        Access Token은 요구하지 않는다. 폐기 대상은 쿠키의 Refresh Token이고, Access Token이 만료된 뒤에도 재발급 없이 로그아웃할 수 있어야 하기 때문이다. Access Token은 서버에 저장하지 않으므로 수명(30분)이 끝날 때까지 유효하고, 프론트가 메모리에서 지운다(TECH 4절).
        CSRF 방지를 위해 `Origin`이 프론트 주소와 같아야 한다. 인증 경로도 공개 API와 같은 요청 제한을 받는다.
        오류: `FORBIDDEN`(403, Origin 불일치), `RATE_LIMIT_EXCEEDED`(429), `INTERNAL_ERROR`(500).
      responses:
        '204':
          description: 로그아웃됨(본문 없음)
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token(JWT). Refresh Token은 HttpOnly 쿠키로 관리되며 계약에 노출하지 않는다.
    adminBatchToken:
      type: http
      scheme: bearer
      description: |
        관리자 배치 토큰(`ADMIN_BATCH_TOKEN`, JWT 아님). GitHub Actions cron이 `Authorization: Bearer`로 보낸다. 별도 필터가 상수 시간 비교로 검사하고 `/admin/collect/**`(와 2단계 `/admin/plans/monthly/**`)에서만 유효하다(TECH 4절). 관리자 Access Token(JWT)과는 OR 관계다(둘 중 하나만 맞으면 통과한다).
        cron은 Vercel을 거치지 않고 백엔드에 직접 호출하므로 오리진 비밀 헤더(`x-origin-secret`)도 함께 보낸다(TECH 3절). 이 헤더는 인프라 경계 검사라 operation 파라미터로 적지 않는다.
  parameters:
    PageParam:
      name: page
      in: query
      description: 페이지 번호(0부터)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      description: 페이지 크기(기본 20, 최대 100)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    MediaTypePath:
      name: mediaType
      in: path
      description: 작품 구분(`movie` 영화 / `tv` 드라마). TMDB는 둘의 ID 공간이 달라 `tmdbId`와 함께 써야 작품이 정해진다
      required: true
      schema:
        $ref: '#/components/schemas/MediaType'
    TmdbIdPath:
      name: tmdbId
      in: path
      description: TMDB 작품 ID
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 2147483647
    WishlistItemIdPath:
      name: wishlistItemId
      in: path
      description: 찜 항목 ID
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProductIdPath:
      name: productId
      in: path
      description: OTT 구독상품 ID(내 요금 목록·관리자 상품 목록의 `productId`)
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PriceIdPath:
      name: priceId
      in: path
      description: 월 구독요금 이력 ID
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProviderIdPath:
      name: providerId
      in: path
      description: TMDB 제공처 ID(그대로 PK)
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ExecutionIdPath:
      name: executionId
      in: path
      description: 수집 실행 ID(Spring Batch jobExecutionId)
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 요청 값 오류. 필드를 특정할 수 있으면 `VALIDATION_FAILED`(`fieldErrors`에 필드별 오류), 깨진 본문처럼 특정할 수 없으면 `INVALID_REQUEST`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 인증 필요 또는 Access Token 만료. `errorCode`는 `UNAUTHORIZED`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: 권한 없음. `errorCode`는 `FORBIDDEN`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: 요청한 데이터가 없음. `errorCode`는 operation 설명 참고(사용자 API는 도메인 코드 `TITLE_NOT_FOUND`·`WISHLIST_ITEM_NOT_FOUND`·`SERVICE_PRICE_NOT_FOUND`(요금을 고칠 수 있는 상품이 아님. 없는 상품이거나 판매 종료)·`PLAN_DRAFT_NOT_FOUND`, 관리자 API의 없는 데이터는 `RESOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: 현재 상태와 충돌해 처리할 수 없음. `errorCode`는 operation 설명 참고
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: 요청 제한 초과(비로그인 공개 API). `errorCode`는 `RATE_LIMIT_EXCEEDED`. `Retry-After` 헤더에 다시 시도할 수 있을 때까지의 초가 담긴다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: 서버 내부 오류. `errorCode`는 `INTERNAL_ERROR`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: 외부 API(TMDB 등) 호출 실패. `errorCode`는 `EXTERNAL_API_ERROR`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 ProblemDetail에 `errorCode`를 확장한 오류 응답. 코드 목록은 `docs/api/error-codes.md`
      required:
        - title
        - status
        - errorCode
      properties:
        type:
          type: string
          description: 오류 유형 URI. 기본값 `about:blank`
        title:
          type: string
          description: HTTP 상태 문구
        status:
          type: integer
          format: int32
          description: HTTP 상태 코드
        detail:
          type: string
          description: 사람이 읽는 오류 설명(한국어)
        instance:
          type: string
          description: 오류가 발생한 요청 경로
        errorCode:
          type: string
          description: SCREAMING_SNAKE_CASE 오류 코드. 프론트가 한국어 메시지로 매핑한다
        fieldErrors:
          type: array
          description: '`VALIDATION_FAILED`일 때의 필드별 오류 목록'
          items:
            $ref: '#/components/schemas/FieldError'
      example:
        type: about:blank
        title: Not Found
        status: 404
        detail: 작품을 찾을 수 없습니다.
        instance: /api/public/titles/movie/999
        errorCode: TITLE_NOT_FOUND
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: 오류가 난 요청 필드명
        message:
          type: string
          description: 필드 오류 메시지(한국어)
      example:
        field: monthlyBudget
        message: 0 이상이어야 합니다.
    PageMeta:
      type: object
      description: |
        페이지네이션 응답 `data`의 공통 필드. Spring `Page`를 그대로 직렬화하지 않는다.
        실제 응답 스키마는 이 스키마와 `content` 배열을 `allOf`로 합쳐 응답별로 정의한다.
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          description: 현재 페이지(0부터)
        size:
          type: integer
          format: int32
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 건수
        totalPages:
          type: integer
          format: int32
          description: 전체 페이지 수
      example:
        page: 0
        size: 20
        totalElements: 135
        totalPages: 7
    OttService:
      type: object
      description: 국내 OTT 서비스 1개
      required:
        - ottServiceId
        - code
        - name
        - logoPath
        - displayOrder
        - dataQuality
      properties:
        ottServiceId:
          type: integer
          format: int64
          description: 서비스 내부 ID
        code:
          type: string
          description: 서비스 코드
          enum:
            - NETFLIX
            - DISNEY_PLUS
            - APPLE_TV_PLUS
            - TVING
            - WAVVE
            - WATCHA
            - COUPANG_PLAY
        name:
          type: string
          description: 화면 표시 이름
        logoPath:
          type: string
          description: TMDB 이미지 상대 경로. URL 조립은 프론트가 한다
        displayOrder:
          type: integer
          format: int32
          description: 화면 정렬 순서
        dataQuality:
          type: string
          description: 데이터 충분도. `INSUFFICIENT`는 "데이터 부족"으로 표시한다
          enum:
            - NORMAL
            - INSUFFICIENT
      example:
        ottServiceId: 1
        code: NETFLIX
        name: 넷플릭스
        logoPath: /rK1KljqmbvO9HQa1PBFLILWah72.png
        displayOrder: 1
        dataQuality: NORMAL
    CommonResponseOttServiceList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/OttService'
      example:
        success: true
        data:
          - ottServiceId: 1
            code: NETFLIX
            name: 넷플릭스
            logoPath: /rK1KljqmbvO9HQa1PBFLILWah72.png
            displayOrder: 1
            dataQuality: NORMAL
          - ottServiceId: 2
            code: DISNEY_PLUS
            name: 디즈니+
            logoPath: /5eZ872CghnHFLB1j8grszbrx0dx.png
            displayOrder: 2
            dataQuality: NORMAL
          - ottServiceId: 3
            code: APPLE_TV_PLUS
            name: 애플 TV+
            logoPath: /9icYBfYFcwgCbky5VdGUIKJ4C5i.png
            displayOrder: 3
            dataQuality: NORMAL
          - ottServiceId: 4
            code: TVING
            name: 티빙
            logoPath: /w4ov8Zx73eu2TjHsDs5EmiuYKA4.png
            displayOrder: 4
            dataQuality: NORMAL
          - ottServiceId: 5
            code: WAVVE
            name: 웨이브
            logoPath: /mh1vBeclG7Eq15TjRnmyustqp3v.png
            displayOrder: 5
            dataQuality: NORMAL
          - ottServiceId: 6
            code: WATCHA
            name: 왓챠
            logoPath: /ppQIS7UMtBwJSspSoGqDR8wO1Gr.png
            displayOrder: 6
            dataQuality: NORMAL
          - ottServiceId: 7
            code: COUPANG_PLAY
            name: 쿠팡플레이
            logoPath: /bP0TPAhxmSdIthEWbzdI1NQB4C2.png
            displayOrder: 7
            dataQuality: INSUFFICIENT

    # ----- 공통 enum·작은 객체 (여러 응답이 함께 쓴다) -----
    MediaType:
      type: string
      description: |
        작품 구분. **enum UPPER_SNAKE_CASE 규칙의 예외**로 소문자다. 작품 경로 `/public/titles/{mediaType}/{tmdbId}`(api-contract.md가 정한 형태, 예 `/api/public/titles/movie/999`)와 본문 값을 같게 두어 프론트가 응답 값으로 바로 상세 경로를 만들게 하려는 것이다. TMDB 경로 표기와도 같다.
        DB(`title.media_type`)는 MOVIE/TV 대문자로 저장하고 API 경계에서 바꾼다(백엔드 구현: Jackson 직렬화 값과 경로 변수 변환기 둘 다 소문자로 맞춘다).
      enum:
        - movie
        - tv
    WishlistPriority:
      type: string
      description: 찜 우선순위. MUST 꼭 볼 작품 / WANT 보고 싶음 / MAYBE 여유될 때 (PRD FR-09)
      enum:
        - MUST
        - WANT
        - MAYBE
    AvailabilityStatus:
      type: string
      description: 서비스의 구독(정액제) 제공 상태. AVAILABLE 있음 / NOT_AVAILABLE 없음 / UNKNOWN 모름 (ERD availability.status)
      enum:
        - AVAILABLE
        - NOT_AVAILABLE
        - UNKNOWN
    ServiceAvailability:
      type: object
      description: 서비스 하나의 제공 상태. 서비스 이름은 서비스 목록 API에서 `ottServiceId`로 찾는다
      required:
        - ottServiceId
        - status
      properties:
        ottServiceId:
          type: integer
          format: int64
          description: 서비스 내부 ID
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
      example:
        ottServiceId: 1
        status: AVAILABLE
    ServiceSubscriptionStatus:
      type: string
      description: |
        서비스 이용 상태. SUBSCRIBED 구독 중 / FREE 가족 공유 등 무료 이용 / NOT_SUBSCRIBED 미구독 / UNKNOWN 잘 모르겠음.
        UNKNOWN도 저장한다. 설정을 다시 열면 고른 값 그대로 보인다. 계산에서는 NOT_SUBSCRIBED와 같이 취급한다(볼 수 있는 서비스로 세지 않음). ERD `user_subscription` 상태 값에 `UNKNOWN`이 있다(ERD v0.4에 반영됨).
      enum:
        - SUBSCRIBED
        - FREE
        - NOT_SUBSCRIBED
        - UNKNOWN
    PriceSource:
      type: string
      description: 금액 출처. ADMIN 기본 요금(관리자 등록) / USER_OVERRIDE 사용자 수정 / ALREADY_PAID 이미 결제(이번 달 비용 제외) / FREE 무료 이용(비용 제외) (ERD plan_month_product.price_source)
      enum:
        - ADMIN
        - USER_OVERRIDE
        - ALREADY_PAID
        - FREE
    WatchPreset:
      type: string
      description: 월 시청 시간을 고른 방식. LIGHT 8시간 / NORMAL 15시간 / HEAVY 30시간 / CUSTOM 직접 입력(환산 포함) (PRD 5.4)
      enum:
        - LIGHT
        - NORMAL
        - HEAVY
        - CUSTOM
    OverviewLanguage:
      type: string
      description: 줄거리 언어. 한국어 줄거리가 없으면 영어로 대체한다(PRD FR-03). **enum 대문자 규칙의 예외**로 ISO 639-1 언어 코드 관례대로 소문자이며 DB(`title.overview_lang`) 값과 같다
      enum:
        - ko
        - en
    PlanType:
      type: string
      description: 플랜 유형. RECOMMENDED 추천형 / SAVER 절약형 / SIMPLE 간편형 (PRD 11절 35번)
      enum:
        - RECOMMENDED
        - SAVER
        - SIMPLE
    PlanStatus:
      type: string
      description: 플랜 상태. DRAFT 계산 결과 / ACTIVE 저장한 현재 플랜 / ARCHIVED 지난 플랜 (ERD plan.status)
      enum:
        - DRAFT
        - ACTIVE
        - ARCHIVED
    PlanAlgorithm:
      type: string
      description: 계산 방식. EXACT 완전탐색 / GREEDY 그리디 (ERD plan.algorithm)
      enum:
        - EXACT
        - GREEDY
    UnscheduledReason:
      type: string
      description: 3개월 안에 배정하지 못한 이유. BUDGET 예산 부족 / TIME 시청 시간 초과(시즌 순서 때문에 밀린 경우 포함) / UNKNOWN 제공처 정보 없음 / NO_PROVIDER 7개 서비스에 없음 (ERD plan_item.reason)
      enum:
        - BUDGET
        - TIME
        - UNKNOWN
        - NO_PROVIDER
    ProductType:
      type: string
      description: OTT 구독상품 종류. MVP는 단품(SINGLE)만 다룬다(번들은 2단계)
      enum:
        - SINGLE
    ProviderTier:
      type: string
      description: 제공처 요금제 등급. STANDARD 일반 / AD 광고형 (ERD tmdb_provider.tier)
      enum:
        - STANDARD
        - AD
    ProviderMappingState:
      type: string
      description: 제공처 매핑 상태. UNMAPPED 미매핑 / MAPPED 서비스에 연결됨 / IGNORED 관련 없음
      enum:
        - UNMAPPED
        - MAPPED
        - IGNORED
    CollectExecutionStatus:
      type: string
      description: |
        수집 실행 상태. RUNNING 실행 중 / COMPLETED 완료 / FAILED 실패 / STOPPED 중단됨(서버가 멈춰 기록만 실행 중으로 남은 실행을 서버가 판정).
        Spring Batch `BatchStatus`를 그대로 내보내지 않는다. 이 `STOPPED`는 Batch의 STOPPED(정상 정지)와 뜻이 다르며, 메타데이터는 실행 중인데 지금 서버에서 돌고 있지 않은 실행이다. Batch 상태와의 대응은 다음과 같다.
        - RUNNING: Batch 상태가 STARTING·STARTED·STOPPING이고 이번 서버 기동 뒤에 만들어진 실행
        - STOPPED: 같은 상태(STARTING·STARTED·STOPPING)인데 이번 서버 기동 전에 만들어진 실행. 저장하지 않고 조회할 때마다 서버 기동 시각과 비교해 판정한다
        - FAILED: Batch의 FAILED(복구한 실행 포함)와 그 밖의 상태(Batch의 STOPPED·ABANDONED 등)
        - COMPLETED: Batch의 COMPLETED
      enum:
        - RUNNING
        - COMPLETED
        - FAILED
        - STOPPED
    CollectTier:
      type: string
      description: 수집 범위(TECH 3절). MVP는 ALL만 실행할 수 있고 DAILY·WEEKLY는 2단계에서 연다
      enum:
        - ALL
        - DAILY
        - WEEKLY
    CollectScope:
      type: string
      description: 수집 Job의 일부 Step만 실행하는 범위. AVAILABILITY_TV는 후보·상세 Step을 건너뛰고 드라마 시즌 제공 상태 판정 Step만 실행한다(이미 모은 데이터에 새 판정 규칙을 다시 적용할 때). 로컬 프로필에서만 받는다
      enum:
        - AVAILABILITY_TV

    # ----- catalog -----
    TitleSearchItem:
      type: object
      description: 검색 결과의 작품 하나
      required:
        - mediaType
        - tmdbId
        - title
        - releaseYear
        - posterPath
        - availabilities
      properties:
        mediaType:
          $ref: '#/components/schemas/MediaType'
        tmdbId:
          type: integer
          format: int64
          description: TMDB ID. `mediaType`과 함께 작품을 정한다
        title:
          type: string
          description: 한국어 제목
        releaseYear:
          type: integer
          format: int32
          nullable: true
          description: 개봉(첫 방영) 연도. 모르면 null
        posterPath:
          type: string
          nullable: true
          description: TMDB 포스터 상대 경로. 없으면 null(화면은 "포스터 없음" 표시)
        availabilities:
          type: array
          description: 서비스별 제공 상태(7개). 드라마는 시즌 중 하나라도 제공되면 AVAILABLE
          items:
            $ref: '#/components/schemas/ServiceAvailability'
    TitleSearchPage:
      description: 검색 결과 한 페이지(페이지네이션 고정 형태 + 수집 실패 여부·데이터 기준일)
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - content
            - isExternalCollectFailed
            - dataAsOf
          properties:
            content:
              type: array
              description: 이 페이지의 작품들(없으면 빈 배열)
              items:
                $ref: '#/components/schemas/TitleSearchItem'
            isExternalCollectFailed:
              type: boolean
              description: 외부(TMDB) 수집이 실패해 저장된 결과(DB)만 보여 주는지
            dataAsOf:
              type: string
              format: date
              description: 제공 상태의 데이터 기준일
    CommonResponseTitleSearchPage:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TitleSearchPage'
      example:
        success: true
        data:
          content:
            - mediaType: movie
              tmdbId: 496243
              title: 기생충
              releaseYear: 2019
              posterPath: /mSi0gskYpmf1FbXngM37s2HppXh.jpg
              availabilities:
                - { ottServiceId: 1, status: NOT_AVAILABLE }
                - { ottServiceId: 2, status: NOT_AVAILABLE }
                - { ottServiceId: 3, status: UNKNOWN }
                - { ottServiceId: 4, status: AVAILABLE }
                - { ottServiceId: 5, status: AVAILABLE }
                - { ottServiceId: 6, status: AVAILABLE }
                - { ottServiceId: 7, status: UNKNOWN }
          page: 0
          size: 20
          totalElements: 1
          totalPages: 1
          isExternalCollectFailed: false
          dataAsOf: '2026-10-08'
    CastMember:
      type: object
      description: 출연진 한 명
      required:
        - name
        - character
      properties:
        name:
          type: string
          description: 배우 이름
        character:
          type: string
          nullable: true
          description: 배역 이름. 모르면 null
    TitleSeason:
      type: object
      description: 드라마의 시즌 하나(찜의 단위)
      required:
        - seasonNumber
        - name
        - episodeCount
        - airYear
        - totalRuntimeMin
        - isRuntimeEstimated
        - availabilities
      properties:
        seasonNumber:
          type: integer
          format: int32
          description: 시즌 번호
        name:
          type: string
          description: 시즌 이름(예 "시즌 1")
        episodeCount:
          type: integer
          format: int32
          description: 회차 수
        airYear:
          type: integer
          format: int32
          nullable: true
          description: 방영 연도. 모르면 null
        totalRuntimeMin:
          type: integer
          format: int32
          description: 시즌 총 시청 시간(분). 방영된 회차 러닝타임의 합
        isRuntimeEstimated:
          type: boolean
          description: TMDB 러닝타임이 비어 기본값으로 추정했는지("추정" 표시)
        availabilities:
          type: array
          description: 시즌별 서비스 제공 상태(7개)
          items:
            $ref: '#/components/schemas/ServiceAvailability'
    TitleDetail:
      type: object
      description: 작품 상세
      required:
        - mediaType
        - tmdbId
        - title
        - originalTitle
        - posterPath
        - overview
        - overviewLang
        - genres
        - releaseDate
        - runtimeMin
        - isRuntimeEstimated
        - cast
        - availabilities
        - seasons
        - dataAsOf
      properties:
        mediaType:
          $ref: '#/components/schemas/MediaType'
        tmdbId:
          type: integer
          format: int64
          description: TMDB ID
        title:
          type: string
          description: 한국어 제목
        originalTitle:
          type: string
          description: 원제
        posterPath:
          type: string
          nullable: true
          description: TMDB 포스터 상대 경로. 없으면 null
        overview:
          type: string
          nullable: true
          description: 줄거리. 없으면 null
        overviewLang:
          allOf:
            - $ref: '#/components/schemas/OverviewLanguage'
          nullable: true
          description: overview의 언어. overview가 null이면 null
        genres:
          type: array
          description: 장르 이름들
          items:
            type: string
        releaseDate:
          type: string
          format: date
          nullable: true
          description: 개봉일(영화) 또는 첫 방영일(드라마). 모르면 null
        runtimeMin:
          type: integer
          format: int32
          nullable: true
          description: 영화 러닝타임(분). 드라마는 null(시즌별 총 시간을 쓴다)
        isRuntimeEstimated:
          type: boolean
          description: runtimeMin이 추정값인지("추정" 표시). 드라마는 false
        cast:
          type: array
          description: 주요 출연진(상위 10명)
          items:
            $ref: '#/components/schemas/CastMember'
        availabilities:
          type: array
          description: 작품 전체 서비스별 제공 상태(7개). 드라마는 시즌 중 하나라도 제공되면 AVAILABLE
          items:
            $ref: '#/components/schemas/ServiceAvailability'
        seasons:
          type: array
          description: 드라마의 시즌들(시즌 번호 순). 영화는 빈 배열
          items:
            $ref: '#/components/schemas/TitleSeason'
        dataAsOf:
          type: string
          format: date
          description: 제공 상태의 데이터 기준일
    CommonResponseTitleDetail:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TitleDetail'
      example:
        success: true
        data:
          mediaType: tv
          tmdbId: 93405
          title: 오징어 게임
          originalTitle: 오징어 게임
          posterPath: /dDlEmu3EZ0Pgg93K2SVNLCjCSvE.jpg
          overview: 거액의 상금이 걸린 의문의 서바이벌에 참가한 사람들이 목숨을 걸고 어린 시절의 놀이에 도전하는 이야기다.
          overviewLang: ko
