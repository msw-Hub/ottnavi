    OverviewDraft:
      type: object
      description: 번역 초안 한 건(Redis 보관, 7일 뒤 또는 메모리 부족 때 사라질 수 있음)
      required:
        - draftId
        - titleId
        - mediaType
        - title
        - original
        - translated
        - isGuardPassed
        - guardFailures
        - warnings
        - model
        - createdAt
        - attempts
        - isEdited
      properties:
        draftId:
          type: string
          description: 초안 ID(UUID 문자열)
        titleId:
          type: integer
          format: int64
          description: 작품 ID
        mediaType:
          $ref: '#/components/schemas/MediaType'
        title:
          type: string
          description: 작품 제목
        original:
          type: string
          description: 번역한 영어 원문(번역 시점의 DB 줄거리). 반영할 때 DB의 현재 줄거리와 같은지 다시 확인한다
        translated:
          type: string
          description: 번역문
        isGuardPassed:
          type: boolean
          description: 자동 검사에서 실패가 없는지(경고만 있어도 true). false(실패)인 초안은 반영할 수 없다. 성공/주의 구분은 `warnings`가 비어 있는지로 한다
        guardFailures:
          type: array
          description: |
            자동 검사에서 걸린 이유 코드들(통과면 빈 배열). EMPTY 번역문이 비어 있음 / TOO_LONG 최대 1000자 초과 / LENGTH_RATIO_LOW 원문 대비 너무 짧음(0.3 미만) /
            LENGTH_RATIO_HIGH 원문 대비 너무 김(2.0 초과) / HANGUL_RATIO_LOW 글자 중 한글 비율이 0.6 미만 / CONTAINS_URL 주소가 들어 있음 /
            CONTAINS_MARKDOWN 마크다운 기호가 들어 있음 / CONTAINS_PREAMBLE "번역:"·"Here is" 같은 머리말이 들어 있음 / NUMBER_MISSING 원문의 숫자가 번역문에 없음
          items:
            type: string
        warnings:
          type: array
          description: 자동 검사의 경고 코드들(없으면 빈 배열). 실패(`guardFailures`)가 없고 이 배열이 비어 있지 않으면 "주의" 초안이다
          items:
            $ref: '#/components/schemas/OverviewDraftWarning'
        model:
          type: string
          description: 번역에 쓴 모델 이름
        createdAt:
          type: string
          format: date-time
          description: 만든 시각
        attempts:
          type: integer
          format: int32
          description: 이 초안을 얻기까지의 총 시도 횟수(단건 번역은 1, 일괄 번역은 자동 재시도를 포함)
        isEdited:
          type: boolean
          description: 관리자가 번역문을 직접 고쳤는지(`editOverviewDraft`). `true`면 일괄 번역이 같은 작품을 다시 번역해 덮어쓰지 않는다
      example:
        draftId: 3f2b8c1e-5d4a-4c6b-9a7e-1b2c3d4e5f60
        titleId: 1024
        mediaType: movie
        title: 기생충
        original: All unemployed, Ki-taek's family takes peculiar interest in the wealthy Park family.
        translated: 전원 백수인 기택의 가족은 부유한 박 사장네 가족에게 남다른 관심을 갖게 된다.
        isGuardPassed: true
        guardFailures: []
        warnings: []
        model: gemini-3.5-flash-lite
        createdAt: '2026-10-29T10:15:00+09:00'
        attempts: 1
        isEdited: false
