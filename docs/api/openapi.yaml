    # ----- admin: 수집 -----
    CollectExecution:
      type: object
      description: 수집 실행 한 건
      required:
        - executionId
        - targetDate
        - tier
        - status
        - startedAt
        - endedAt
        - processedCount
        - changedCount
        - failureReason
        - canRecover
        - canRestart
        - recalcTargetCount
      properties:
        executionId:
          type: integer
          format: int64
          description: 실행 ID(Spring Batch jobExecutionId)
        targetDate:
          type: string
          format: date
          description: 수집 기준 날짜
        tier:
          $ref: '#/components/schemas/CollectTier'
        status:
          $ref: '#/components/schemas/CollectExecutionStatus'
        startedAt:
          type: string
          format: date-time
          description: 시작 시각(KST 오프셋). 아직 시작 전이면 접수 시각
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: 끝난 시각. 완료되었거나 스스로 실패한 실행만 값이 있다. 실행 중·중단됨이면 null, 복구로 실패가 된 실행도 null(복구를 누른 시각은 실제 종료가 아니다)
        processedCount:
          type: integer
          format: int32
          description: 영화·드라마 상세 단계에서 저장한 작품 수(실행 중이면 지금까지). TMDB가 404를 줘 건너뛴 작품은 세지 않는다. 재시작한 실행은 그 실행이 처리한 몫만 센다
        changedCount:
          type: integer
          format: int32
          description: 제공 상태가 바뀐 건수(시청 단위 × 서비스). `listCollectExecutionChanges`의 `totalElements`와 같다
        failureReason:
          type: string
          nullable: true
          description: >-
            실패 사유. 실패가 아니면 null. 예외가 원인이면 예외 메시지의 첫 줄 "예외명: 메시지"를 300자까지 담고,
            중단을 관리자가 복구한 실행은 "중단된 실행을 관리자가 실패로 복구함"이다
        canRecover:
          type: boolean
          description: 복구 버튼을 켤 수 있는지. 중단됨(`STOPPED`)이면 true
        canRestart:
          type: boolean
          description: 재시작 버튼을 켤 수 있는지. 실패(`FAILED`)이고 같은 날짜·범위의 가장 최근 실행이며, 운영에서는 대상 날짜가 오늘이고 다른 수집이 실행 중이 아닐 때 true. Batch가 포기(`ABANDONED`)한 실행은 화면 상태가 `FAILED`여도 false다(이 서비스는 그 상태를 만들지 않는다). 서버가 시작·재시작 거절 규칙과 같은 코드로 계산한다
        recalcTargetCount:
          type: integer
          format: int32
          nullable: true
          description: 이 수집 뒤 이어 돈 재계산 중 가장 최근 실행의 대상 플랜 수. 재계산이 없거나 아직 끝나지 않았으면 null
    CollectExecutionPage:
      description: 수집 실행 이력 한 페이지(페이지네이션 고정 형태)
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              description: 대상 날짜 내림차순, 같으면 실행 ID 내림차순. 없으면 빈 배열
              items:
                $ref: '#/components/schemas/CollectExecution'
    CommonResponseCollectExecutionPage:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CollectExecutionPage'
      example:
        success: true
        data:
          page: 0
          size: 20
          totalElements: 2
          totalPages: 1
          content:
            - executionId: 5
              targetDate: '2026-10-12'
              tier: ALL
              status: COMPLETED
              startedAt: '2026-10-12T03:00:00+09:00'
              endedAt: '2026-10-12T03:42:00+09:00'
              processedCount: 1840
              changedCount: 2
              failureReason: null
              canRecover: false
              canRestart: false
              recalcTargetCount: 12
            - executionId: 4
              targetDate: '2026-10-11'
              tier: ALL
              status: FAILED
              startedAt: '2026-10-11T03:00:00+09:00'
              endedAt: '2026-10-11T03:05:00+09:00'
              processedCount: 120
              changedCount: 0
              failureReason: TMDB 호출 제한 초과로 중단됨
              canRecover: false
              canRestart: false
              recalcTargetCount: null
    CommonResponseCollectExecution:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CollectExecution'
      example:
        success: true
        data:
          executionId: 3
          targetDate: '2026-10-10'
          tier: ALL
          status: FAILED
          startedAt: '2026-10-10T03:00:00+09:00'
          endedAt: null
          processedCount: 640
          changedCount: 0
          failureReason: 중단된 실행을 관리자가 실패로 복구함
          canRecover: false
          canRestart: true
          recalcTargetCount: null
    CollectExecutionChange:
      type: object
      description: 실행에서 제공 상태가 바뀐 작품 한 건(서비스 단위)
      required:
        - mediaType
        - tmdbId
