    PopularityRanking:
      type: object
      description: 서비스(또는 전체)의 인기 순위
      required:
        - period
        - ottServiceId
        - snapshotDate
        - daysCounted
        - notice
        - items
      properties:
        period:
          $ref: '#/components/schemas/PopularityPeriod'
        ottServiceId:
          type: integer
          format: int64
          nullable: true
          description: 요청한 서비스 ID. 전체 순위면 null
        snapshotDate:
          type: string
          format: date
          nullable: true
          description: 사용한 가장 최근 스냅샷 날짜(KST, 데이터 기준일). 스냅샷이 없으면 null
        daysCounted:
          type: integer
          format: int32
          description: 평균에 쓴 스냅샷 날 수. 스냅샷이 없으면 0, 있으면 TODAY는 1, WEEK는 1~7
        notice:
          type: string
          description: 화면에 함께 적을 기준 안내 문구. 예 "최근 2년 안에 공개된 한국 작품 중 TMDB 인기도 순(OTT 공식 순위 아님)"
        items:
          type: array
          description: 인기도 높은 순위(없으면 빈 배열)
          items:
            $ref: '#/components/schemas/PopularityRankingItem'
    CommonResponsePopularityRanking:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PopularityRanking'
      example:
        success: true
        data:
          period: TODAY
          ottServiceId: 1
          snapshotDate: '2026-10-18'
          daysCounted: 1
          notice: 최근 2년 안에 공개된 한국 작품 중 TMDB 인기도 순(OTT 공식 순위 아님)
          items:
            - rank: 1
              title:
                mediaType: tv
                tmdbId: 93405
                title: 오징어 게임
                releaseYear: 2021
                posterPath: /dDlEmu3EZ0Pgg93K2SVNLCjCSvE.jpg
                availabilities:
                  - ottServiceId: 1
                    status: AVAILABLE
    WishlistedTitle:
      type: object
      description: 찜이 많은 작품 한 줄
      required:
        - title
        - wishlistUserCount
      properties:
        title:
          $ref: '#/components/schemas/TitleSearchItem'
        wishlistUserCount:
          type: integer
          format: int32
          description: 이 작품을 찜한 사용자 수("다 봤음" 제외, 작품 단위). 최소 인원 미만 작품은 목록에 없다
    WishlistedTitleList:
      type: object
      required:
        - minUserCount
        - dataAsOf
        - items
      properties:
        minUserCount:
          type: integer
          format: int32
          description: 목록에 넣는 최소 찜 사용자 수(이보다 적은 작품은 뺀다)
        dataAsOf:
          type: string
          format: date
          description: 제공 상태의 데이터 기준일(KST)
        items:
          type: array
          description: 찜 사용자 수 많은 순(없으면 빈 배열)
          items:
            $ref: '#/components/schemas/WishlistedTitle'
    CommonResponseWishlistedTitleList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/WishlistedTitleList'
      example:
        success: true
        data:
          minUserCount: 3
          dataAsOf: '2026-10-18'
          items:
            - title:
                mediaType: movie
                tmdbId: 496243
                title: 기생충
                releaseYear: 2019
                posterPath: /mSi0gskYpmf1FbXngM37s2HppXh.jpg
                availabilities:
                  - ottServiceId: 1
                    status: AVAILABLE
              wishlistUserCount: 12
    ArrivalType:
      type: string
      description: 새로 볼 수 있게 된 이유. ARRIVAL 입고(없음·모름에서 있음으로 바뀜을 확인) / RELEASE 공개(첫 수집부터 있음이지만 공개일이 최근)
      enum:
        - ARRIVAL
        - RELEASE
    NewlyAvailableTitle:
      type: object
      description: 새로 볼 수 있게 된 작품 한 줄
      required:
        - title
        - ottServiceId
        - arrivalType
        - availableSince
      properties:
        title:
          $ref: '#/components/schemas/TitleSearchItem'
        ottServiceId:
          type: integer
          format: int64
          description: 새로 볼 수 있게 된 서비스
        arrivalType:
          $ref: '#/components/schemas/ArrivalType'
        availableSince:
          type: string
          format: date
          description: 기준 날짜(KST). ARRIVAL이면 있음으로 바뀐 것을 확인한 날, RELEASE면 공개일(실제 서비스 입고일이 아니라 우리가 확인한 범위의 날짜)
    NewlyAvailableTitleList:
      type: object
      required:
        - dataAsOf
        - items
      properties:
        dataAsOf:
          type: string
          format: date
          description: 제공 상태의 데이터 기준일(KST)
        items:
          type: array
          description: 기준 날짜가 최근인 순(없으면 빈 배열)
          items:
            $ref: '#/components/schemas/NewlyAvailableTitle'
    CommonResponseNewlyAvailableTitleList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/NewlyAvailableTitleList'
      example:
        success: true
        data:
          dataAsOf: '2026-10-18'
          items:
            - title:
                mediaType: movie
                tmdbId: 496243
                title: 기생충
                releaseYear: 2019
                posterPath: /mSi0gskYpmf1FbXngM37s2HppXh.jpg
                availabilities:
                  - ottServiceId: 4
                    status: AVAILABLE
              ottServiceId: 4
              arrivalType: ARRIVAL
              availableSince: '2026-10-15'
    Genre:
      type: object
      description: 탐색용 장르 하나(TMDB 장르)
      required:
        - genreId
        - name
      properties:
        genreId:
          type: integer
          format: int32
          description: TMDB 장르 ID
        name:
          type: string
          description: 한국어 장르 이름
    CommonResponseGenreList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
      example:
        success: true
        data:
          - genreId: 16
            name: 애니메이션
          - genreId: 80
            name: 범죄
    TitleExplorePage:
      description: 탐색 결과 한 페이지(페이지네이션 고정 형태 + 데이터 기준일)
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - content
            - dataAsOf
          properties:
            content:
              type: array
              description: 이 페이지의 작품들(최근 2년 개봉작 먼저, 각 그룹 안은 인기도 높은 순, 없으면 빈 배열)
              items:
                $ref: '#/components/schemas/TitleSearchItem'
            dataAsOf:
              type: string
              format: date
              description: 제공 상태의 데이터 기준일(KST)
    CommonResponseTitleExplorePage:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TitleExplorePage'
      example:
        success: true
        data:
          content:
            - mediaType: movie
              tmdbId: 496243
              title: 기생충
              releaseYear: 2019
              posterPath: /mSi0gskYpmf1FbXngM37s2HppXh.jpg
              availabilities:
                - ottServiceId: 1
                  status: AVAILABLE
          page: 0
          size: 20
          totalElements: 1
          totalPages: 1
          dataAsOf: '2026-10-18'
    ExclusiveTitle:
      type: object
      description: 독점 목록의 작품 하나. "확인된 범위에서 7개 서비스 중 이 서비스에서만 구독으로 볼 수 있는 작품"이다(PRD FR-04)
      required:
        - mediaType
        - tmdbId
        - title
        - releaseYear
        - posterPath
        - exclusiveSeasonNumbers
        - comparedServiceCount
        - unknownElsewhereCount
      properties:
        mediaType:
          $ref: '#/components/schemas/MediaType'
        tmdbId:
          type: integer
          format: int64
          description: TMDB ID. 작품 상세 주소(`/public/titles/{mediaType}/{tmdbId}`)에 쓴다
        title:
          type: string
          description: 한국어 제목
        releaseYear:
          type: integer
          format: int32
          nullable: true
          description: 개봉(첫 방영) 연도. 모르면 null
        posterPath:
          type: string
          nullable: true
          description: TMDB 포스터 상대 경로. 없으면 null
        exclusiveSeasonNumbers:
          type: array
          nullable: true
          description: 드라마에서 이 서비스 독점으로 확인된 시즌 번호(오름차순). 같은 드라마라도 일부 시즌만 독점일 수 있다. 영화는 null
          items:
            type: integer
            format: int32
        comparedServiceCount:
          type: integer
          format: int32
          description: 비교한 다른 서비스 수. 구조적 공백(쿠팡플레이 영화)은 세지 않아 영화는 보통 5, 드라마는 6이다
        unknownElsewhereCount:
          type: integer
          format: int32
          description: 비교한 다른 서비스 중 제공 여부가 "모름"인 곳의 수. 0보다 크면 다른 곳에도 있을 수 있다. 드라마는 독점 시즌 중 가장 큰 값
    ExclusiveTitlePage:
      description: 서비스별 독점 목록 한 페이지(페이지네이션 고정 형태 + 서비스 ID·판정 여부·데이터 기준일)
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - content
            - ottServiceId
            - isJudged
            - dataAsOf
          properties:
            content:
              type: array
              description: 이 페이지의 작품들(최근 2년 개봉작 먼저, 각 그룹 안은 인기도 높은 순, 없으면 빈 배열)
              items:
                $ref: '#/components/schemas/ExclusiveTitle'
            ottServiceId:
              type: integer
              format: int64
              description: 요청한 서비스 ID
            isJudged:
              type: boolean
              description: 독점 목록을 판정했는지. 현재는 모든 서비스가 true다(계약 호환을 위해 필드를 남겼다). 데이터 충분도가 낮은 서비스(`dataQuality`가 `INSUFFICIENT`)는 일부 구간(쿠팡플레이 영화)을 판정에서 빼고, 그 서비스의 `dataQuality`로 화면이 안내한다
            dataAsOf:
              type: string
              format: date
              description: 독점을 계산한 제공 상태의 데이터 기준일(KST)
    CommonResponseExclusiveTitlePage:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ExclusiveTitlePage'
      example:
        success: true
        data:
          content:
            - mediaType: tv
              tmdbId: 1396
              title: 브레이킹 배드
              releaseYear: 2008
              posterPath: /ggFHVNu6YYI5L9pCfOacjizRGt.jpg
              exclusiveSeasonNumbers: [1, 2]
              comparedServiceCount: 6
              unknownElsewhereCount: 1
          page: 0
          size: 20
          totalElements: 1
          totalPages: 1
          ottServiceId: 1
          isJudged: true
          dataAsOf: '2026-10-18'

    # ----- auth -----
    AccessToken:
      type: object
      description: 새 Access Token. Refresh Token은 HttpOnly 쿠키로만 오가며 본문에 담지 않는다
      required:
        - accessToken
        - role
      properties:
        accessToken:
          type: string
          description: Access Token(JWT, 수명 30분). 프론트는 메모리에만 둔다
        role:
          type: string
          enum:
            - USER
            - ADMIN
            - DEMO
          description: 사용자 권한. 재발급 때마다 DB에서 다시 읽은 값이라 화면의 관리자 메뉴 표시 여부를 정하는 데 쓴다. `DEMO`는 데모 계정으로, 회원 기능은 쓰고 관리자 화면은 조회만 하며 탈퇴·알림 설정 변경은 할 수 없다(서버가 403으로 막는다)
    DemoLoginRequest:
      type: object
      description: 데모 계정 로그인 요청. 값이 비어도 400이 아니라 401(`DEMO_LOGIN_FAILED`)이다
      required:
        - loginId
        - password
      properties:
        loginId:
          type: string
          description: 데모 아이디(제출 문서로 전달한 값)
        password:
          type: string
          description: 데모 비밀번호. 화면은 입력 칸을 비밀번호 형식(가림)으로 둔다
    CommonResponseAccessToken:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AccessToken'
      example:
        success: true
        data:
          accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwicm9sZSI6IlVTRVIifQ.example-signature
          role: USER
    OverviewDraftStatus:
      type: string
      description: 번역 초안의 자동 검사 등급. PASSED 성공(실패도 경고도 없음) / WARNING 주의(실패는 없고 경고만 있음, 경고는 `warnings`) / FAILED 실패(걸린 이유는 `guardFailures`)
      enum:
        - PASSED
        - WARNING
        - FAILED
    OverviewDraftWarning:
      type: string
      description: |
        자동 검사의 경고(의심 신호) 코드. 경고는 반영을 막지 않고, 실패 없이 경고만 있는 초안은 "주의"로 사람이 승인해야 반영된다.
        SENTENCE_COUNT_MISMATCH 원문과 번역문의 문장 수 차이가 2 이상 / STYLE_NOT_PLAIN "~다." 꼴 문장이 80% 미만 /
        SUSPICIOUS_SPACING 한 글자 낱말 뒤에 어미처럼 보이는 낱말이 떨어져 있음(깨진 띄어쓰기 의심) / LENGTH_RATIO_NEAR_LIMIT 길이 비율이 실패 한계에 가까움
      enum:
        - SENTENCE_COUNT_MISMATCH
        - STYLE_NOT_PLAIN
        - SUSPICIOUS_SPACING
        - LENGTH_RATIO_NEAR_LIMIT
    CreateOverviewDraftRequest:
      type: object
      description: 번역 초안 한 건 생성 요청
      required:
        - titleId
      properties:
        titleId:
          type: integer
          format: int64
          minimum: 1
          description: 번역할 작품 ID(영어 줄거리가 있는 작품)
      example:
        titleId: 1024
    CreateBulkOverviewDraftsRequest:
      type: object
      description: 일괄 번역 요청. `titleIds`와 `count` 중 정확히 하나만 보낸다
      properties:
        titleIds:
          type: array
          nullable: true
          maxItems: 100
          description: 번역할 작품 ID들(1~100개, 중복은 제거). 이미 초안이 있어도 다시 번역해 교체한다
          items:
            type: integer
            format: int64
        count:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 100
          description: 번역 후보 정렬(찜 많은 순 → 인기순) 상위 몇 개를 번역할지(1~100). 이미 초안이 있는 작품은 건너뛰고 그다음 작품으로 채운다
      example:
        count: 50
    ApplyOverviewDraftsRequest:
      type: object
      description: 초안 반영 요청. `draftIds`와 `allPassed`(true) 중 정확히 하나만 보낸다
      properties:
        draftIds:
          type: array
          nullable: true
          maxItems: 500
          description: 반영할 초안 ID들(중복은 제거)
          items:
            type: string
        allPassed:
          type: boolean
          nullable: true
          description: true면 성공(실패도 경고도 없는) 초안 전부를 반영한다. 주의(경고만 있는) 초안은 제외된다
      example:
        allPassed: true
    OverviewCandidate:
      type: object
      description: 번역 후보 작품 한 건(영어 줄거리가 남아 있는 작품)
      required:
        - titleId
        - mediaType
        - title
        - overview
        - wishlistCount
        - hasDraft
      properties:
        titleId:
          type: integer
          format: int64
          description: 작품 ID
        mediaType:
          $ref: '#/components/schemas/MediaType'
        title:
          type: string
          description: 작품 제목
        overview:
          type: string
          description: 영어 줄거리 전문
        wishlistCount:
          type: integer
          format: int64
          description: 이 작품을 찜한 사용자 수(시즌별로 찜해도 한 사람은 1명)
        hasDraft:
          type: boolean
          description: 이 작품에 번역 초안이 있는지
      example:
        titleId: 1024
        mediaType: movie
        title: 기생충
        overview: All unemployed, Ki-taek's family takes peculiar interest in the wealthy Park family.
        wishlistCount: 12
        hasDraft: false
    OverviewTranslateSummary:
      type: object
      description: 번역 화면 상단 요약
      required:
        - pendingTotal
        - usedToday
        - dailyLimit
        - perMinuteLimit
        - model
        - isEnabled
        - translatedCount
        - oldestTranslatedAt
      properties:
        pendingTotal:
          type: integer
          format: int64
          description: 번역 대기 중인 영어 줄거리 작품의 총수
        usedToday:
          type: integer
          format: int64
          description: 오늘(태평양 시간 날짜 기준) Gemini를 호출한 수
        dailyLimit:
          type: integer
          format: int32
          description: 하루 호출 상한
        perMinuteLimit:
          type: integer
          format: int32
          description: 분당 호출 상한
        model:
          type: string
          description: 사용 중인 모델 이름
        isEnabled:
          type: boolean
          description: 번역 기능을 쓸 수 있는지(서버에 Gemini 키가 설정돼 있는지). false면 조회만 되고 생성·일괄은 `LLM_DISABLED`(503)다
        translatedCount:
          type: integer
          format: int64
          description: 관리자가 반영한 번역 줄거리 작품 수(`overview_translated_at`이 있는 작품). TMDB가 준 한국어는 세지 않는다
        oldestTranslatedAt:
          type: string
          format: date-time
          nullable: true
          description: 가장 오래된 번역의 반영 시각(6개월 보관 경과 여부를 보는 용도). 번역이 하나도 없으면 `null`
      example:
        pendingTotal: 2512
        usedToday: 37
        dailyLimit: 400
        perMinuteLimit: 12
        model: gemini-3.5-flash-lite
        isEnabled: true
        translatedCount: 37
        oldestTranslatedAt: '2026-10-29T10:00:00+09:00'
    OverviewCandidatePage:
      description: 번역 후보 한 페이지(페이지네이션 고정 형태 + 요약)
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - content
            - summary
          properties:
            content:
              type: array
              description: 이 페이지의 번역 후보들(없으면 빈 배열)
              items:
                $ref: '#/components/schemas/OverviewCandidate'
            summary:
              $ref: '#/components/schemas/OverviewTranslateSummary'
    CommonResponseOverviewCandidatePage:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
