<text class="m" x="118" y="99" font-size="13" text-anchor="end">동시 1건</text><path class="c1" d="M130 84h90a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-90z"/><text class="t" x="232" y="100" font-size="13" font-weight="700">4.3초</text><text class="m" x="118" y="135" font-size="13" text-anchor="end">동시 2건</text><path class="c1" d="M130 120h184a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-184z"/><text class="t" x="326" y="136" font-size="13" font-weight="700">8.6초</text><text class="m" x="118" y="171" font-size="13" text-anchor="end">동시 4건</text><path class="c1" d="M130 156h432a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-432z"/><text class="t" x="574" y="172" font-size="13" font-weight="700">20초</text><line class="g" x1="130" y1="76" x2="130" y2="186"/><text class="m" x="24" y="210" font-size="11.5">찜 20개 · 7개 서비스 모두 미구독 · 예산 10만 원, p95 · CPU 1개를 나눠 써서 동시 건수에 비례해 늘어남 (오류 0건)</text>
