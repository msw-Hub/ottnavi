<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="760" height="386" role="img" aria-label="검색 평균 응답 시간 비교. 3글자 이상: 인덱스 없음 68.7ms, 인덱스만 9.6ms, 인덱스와 매번 계획 세우기 10.3ms. 2글자: 67.7, 119.9, 65.5ms">
<title>검색 응답 시간 (평균, 짧을수록 좋음)</title>
<style>
.s{fill:#fcfcfb;stroke:#e4e3de}.t{fill:#0b0b0b}.m{fill:#52514e}.g{stroke:#e4e3de}
.c1{fill:#2a78d6}.c2{fill:#eb6834}.c3{fill:#1baf7a}
text{font-family:-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){.s{fill:#1a1a19;stroke:#33332f}.t{fill:#f0efec}.m{fill:#c3c2b7}.g{stroke:#33332f}
.c1{fill:#3987e5}.c2{fill:#d95926}.c3{fill:#199e70}}
</style>
<rect class="s" x="0.5" y="0.5" width="759" height="385" rx="12"/>
<text class="t" x="24" y="34" font-size="17" font-weight="700">검색 응답 시간 (평균, 짧을수록 좋음)</text>
<text class="m" x="24" y="56" font-size="12.5">3글자 이상은 인덱스로 6.7배 빨라졌고, 2글자는 "매번 계획 세우기"로 인덱스만 넣었을 때의 악화를 막았습니다</text>
<rect class="c1" x="24" y="72" width="12" height="12" rx="3"/><text class="m" x="42" y="82" font-size="12.5">인덱스 없음</text><rect class="c2" x="140" y="72" width="12" height="12" rx="3"/><text class="m" x="158" y="82" font-size="12.5">인덱스만</text><rect class="c3" x="232" y="72" width="12" height="12" rx="3"/><text class="m" x="250" y="82" font-size="12.5">인덱스 + 매번 계획 세우기 (적용)</text><text class="t" x="24" y="124" font-size="14" font-weight="700">3글자 이상 검색</text><text class="m" x="238" y="147" font-size="12.5" text-anchor="end">① 인덱스 없음</text><path class="c1" d="M250 134h218a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-218z"/><text class="t" x="480" y="148" font-size="13" font-weight="700">68.7ms</text><text class="m" x="238" y="175" font-size="12.5" text-anchor="end">② 인덱스만</text><path class="c2" d="M250 162h27a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-27z"/><text class="t" x="289" y="176" font-size="13" font-weight="700">9.6ms</text><text class="m" x="238" y="203" font-size="12.5" text-anchor="end">③ 인덱스 + 매번 계획 세우기 (적용)</text><path class="c3" d="M250 190h29a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-29z"/><text class="t" x="291" y="204" font-size="13" font-weight="700">10.3ms</text><text class="t" x="24" y="244" font-size="14" font-weight="700">2글자 검색</text><text class="m" x="238" y="267" font-size="12.5" text-anchor="end">① 인덱스 없음</text><path class="c1" d="M250 254h215a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-215z"/><text class="t" x="477" y="268" font-size="13" font-weight="700">67.7ms</text><text class="m" x="238" y="295" font-size="12.5" text-anchor="end">② 인덱스만</text><path class="c2" d="M250 282h383a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-383z"/><text class="t" x="645" y="296" font-size="13" font-weight="700">119.9ms</text><text class="m" x="238" y="323" font-size="12.5" text-anchor="end">③ 인덱스 + 매번 계획 세우기 (적용)</text><path class="c3" d="M250 310h208a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-208z"/><text class="t" x="470" y="324" font-size="13" font-weight="700">65.5ms</text><line class="g" x1="250" y1="104" x2="250" y2="336"/><text class="m" x="24" y="346" font-size="11.5">로컬 컨테이너(1GiB·CPU 1개), 같은 날 같은 스크립트, 평상시 3회 중앙값, 요청 한 건 전체의 평균 응답 시간</text>
</svg>
