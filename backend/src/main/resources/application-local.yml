# application-local.yml (DB_URL은 일부러 참조하지 않는다. 운영 DB에 붙는 사고 방지, ROADMAP Task 015 기록)
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:${DB_PORT:5432}/${DB_NAME:ottnavi}   # compose가 127.0.0.1에만 바인딩
    username: ${DB_USERNAME:ottnavi}
    password: ${DB_PASSWORD:ottnavi}
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:}             # 비워 두면 JavaMailSender가 만들어지지 않는다. provider=log가 기본이라 메일 계정 없이 기동된다
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            # 로컬 기동이 실패하지 않게 더미 기본값을 둔다. 실제 구글 로그인은 .env의 GOOGLE_CLIENT_ID·SECRET이 있어야 한다
            client-id: ${GOOGLE_CLIENT_ID:local-dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dummy}
            # 로컬은 Vite 프록시(5173 → 8080)를 거치므로 콜백도 5173으로 받는다
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://localhost:5173}/api/login/oauth2/code/{registrationId}"
app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}   # Origin 검사·로그인 후 이동 주소의 기준
  origin-secret:
    enabled: false                # 로컬은 Vite proxy·직접 호출이라 오리진 비밀 헤더를 검사하지 않는다
  mail:
    provider: ${APP_MAIL_PROVIDER:log}   # 실제 발송을 시험하려면 smtp로 바꾸고 MAIL_* 값을 넣는다
    from: ${MAIL_FROM:ottnavi@localhost}
  admin-batch-token: ${ADMIN_BATCH_TOKEN:local-admin-batch-token}   # 수집 실행 API 배치 토큰. 로컬 전용 기본값
  jwt:
    # 로컬·테스트 전용 개발 키(Base64, 48바이트). 저장소에서 알 수 있는 값이라 운영에서 절대 쓰면 안 된다
    secret: b3R0bmF2aS1sb2NhbC1kZXYtb25seS1qd3Qtc2VjcmV0LWtleS0wMTIzNDU2Nzg5
  collect:
    allow-target-date-override: true   # 로컬은 targetDate를 직접 지정해 같은 날 재수집을 재현할 수 있다(Task 045)
