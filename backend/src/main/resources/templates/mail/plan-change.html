<!DOCTYPE html>
<!-- 확정된 플랜의 작품이 빠지는 등 변경 알림(PLAN_CHANGE). payload: summary, leftTitles, changeReasons, currentProducts (PlanChangePayload) -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>구독 플랜 변경 안내</title>
</head>
<body>
<section>
    <p>저장한 구독 플랜에 바뀐 내용이 있어요.</p>
    <p th:if="${payload['summary'] != null}" th:text="${payload['summary']}">요약</p>

    <div th:if="${!#lists.isEmpty(payload['leftTitles'])}">
        <p style="font-weight:bold;margin-bottom:4px;">배정된 서비스에서 빠진 작품</p>
        <div th:replace="~{mail/fragments :: titleList(${payload['leftTitles']})}"></div>
    </div>

    <div th:if="${!#lists.isEmpty(payload['changeReasons'])}">
        <p style="font-weight:bold;margin-bottom:4px;">바뀐 이유</p>
        <div th:replace="~{mail/fragments :: textList(${payload['changeReasons']})}"></div>
    </div>

    <div th:if="${!#lists.isEmpty(payload['currentProducts'])}">
        <p style="font-weight:bold;margin-bottom:4px;">바뀐 플랜의 이번 달 구독</p>
        <div th:replace="~{mail/fragments :: productList(${payload['currentProducts']})}"></div>
    </div>
</section>
</body>
</html>
