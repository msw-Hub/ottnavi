<!DOCTYPE html>
<!-- 알림 메일 공통 레이아웃(Task 072). 유형별 템플릿이 layout(title, content)를 불러 본문 자리를 채운다 -->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">OTT내비</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f7;font-family:'Malgun Gothic',sans-serif;color:#222;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;padding:24px;border-radius:8px;">
    <h1 style="font-size:20px;margin:0 0 16px;">OTT내비</h1>
    <p>안녕하세요, <span th:text="${userName}">회원</span>님.</p>

    <!-- 유형별 본문 자리 -->
    <div th:replace="${content}">본문</div>

    <!-- 꼬리말: 화면 표시 규칙(확인된 범위 고지, 출처, 기준일)과 알림 끄는 방법 -->
    <hr style="border:none;border-top:1px solid #ddd;margin:24px 0 12px;">
    <p style="font-size:12px;color:#666;line-height:1.6;">
        이 안내는 확인된 범위의 정보입니다. 실제 제공 여부와 요금은 달라질 수 있으니 결제 전에 각 서비스에서 한 번 더 확인해 주세요.<br>
        제공처 정보 출처: TMDB(JustWatch 제공 데이터)<br>
        데이터 기준일: <span th:text="${dataDate}">2026-01-01</span><br>
        이 알림은 OTT내비의 알림 설정 화면에서 언제든 끌 수 있어요.
    </p>
</div>
</body>
</html>
