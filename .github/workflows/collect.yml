name: collect

# 수집 Job을 시작하는 워크플로. 수집 시작(202)만 호출한다.
# 재계산(Task 069)과 월초 알림 생성(Task 073)은 백엔드가 수집 Job 완료 뒤 이어서 실행하므로 단계를 추가하지 않는다(R-21).
#
# 계층별 갱신(Task 077): 같은 워크플로를 cron 두 개가 나눠 쓴다. 어떤 cron이 깨웠는지(github.event.schedule)로 tier를 고른다.
#   - DAILY : 수요일을 뺀 매일(월·화·목·금·토·일) 03:17 KST. 찜한 작품만 상세·제공 상태를 다시 받는다(후보 발견 생략, 호출량이 작다)
#   - WEEKLY: 수 03:17 KST. 후보 발견 + 찜하지 않은 나머지 작품을 다시 받는다(전체 수집과 비슷한 분량, 8시간쯤 걸린다)
#     WEEKLY를 일요일에서 수요일로 옮긴 이유(2026-10-27 사용자 결정): 오래 걸리는 큰 작업은 실패했을 때 바로 확인하고 복구할 수 있는 평일에 둔다.
#     WEEKLY가 도는 날은 DAILY가 돌지 않는다(두 cron의 요일이 겹치지 않는다).
#   - 수동 실행(workflow_dispatch)은 입력 tier를 쓴다(기본 ALL = 전체)
#
# schedule은 켜 둔 상태다(Task 093). 다만 기본 브랜치(main)의 파일만 실행되므로 develop에서는 돌지 않고, develop → main 병합(Task 095) 때 켜진다.
# 병합 전에 Cloudtype Hobby 전환(R11-4, 무료 Cloudtype은 매일 아침 중지되고 HTTP 요청으로 다시 켜지지 않는다. TECH 3절),
# Cloudtype 환경 변수, GitHub 시크릿(BACKEND_BASE_URL·ORIGIN_SECRET·ADMIN_BATCH_TOKEN)이 모두 준비돼 있어야 한다. 아니면 첫 실행부터 실패한다.
# 예약 실행은 저장소 변수 CRON_ENABLED가 'true'일 때만 작업을 돈다(안정화를 확인한 뒤에 켜려는 안전장치. 변수가 없으면 예약 실행은 건너뛴다).
#   켜기/끄기: GitHub 저장소 Settings → Secrets and variables → Actions → Variables 탭에서 CRON_ENABLED를 true로 만들거나 지운다. 코드 변경과 배포는 필요 없다.
#   수동 실행(workflow_dispatch)은 변수와 무관하게 항상 돈다. 아예 멈추려면 schedule 줄을 다시 주석 처리하고 main에 반영한다.
# 주의: 공개 저장소는 60일 동안 활동이 없으면 예약(schedule) 워크플로가 자동으로 꺼진다.
#       꺼졌다면 Actions 탭에서 다시 켜거나 커밋·수동 실행으로 되살린다.
# 주의: schedule은 기본 브랜치(main)의 워크플로 파일 기준으로 실행된다. 활성화는 main까지 반영돼야 한다.
# 주의: 아래 WEEKLY cron 문자열은 jobs의 tier 선택식과 글자까지 같아야 한다(바꾸면 둘 다 고친다).
on:
  workflow_dispatch:
    inputs:
      tier:
        description: '수집 범위(ALL 전체, DAILY 찜한 작품만, WEEKLY 후보 발견 + 나머지 작품)'
        type: choice
        options:
          - ALL
          - DAILY
          - WEEKLY
        default: ALL
  schedule:
    # UTC 기준. 18:17 UTC = KST 03:17(정각을 피한 분, 정각에는 지연될 수 있다). 요일은 UTC 기준이라 KST보다 하루 앞선다
    # - cron: '17 18 * * 0-5'   # (이전) DAILY : UTC 일~금 = KST 월~토 03:17
    # - cron: '17 18 * * 6'     # (이전) WEEKLY: UTC 토 = KST 일 03:17
    - cron: '17 18 * * 0,1,3,4,5,6'   # DAILY : UTC 일·월·수·목·금·토 = KST 월·화·목·금·토·일 03:17
    - cron: '17 18 * * 2'             # WEEKLY: UTC 화 = KST 수 03:17

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # 예약 실행(schedule)은 CRON_ENABLED 변수가 true일 때만, 수동 실행은 항상 돈다. 건너뛴 예약 실행은 Actions 탭에 skipped로 남는다
    if: github.event_name == 'workflow_dispatch' || vars.CRON_ENABLED == 'true'
    timeout-minutes: 5
    steps:
      # 1. Vercel을 거치지 않고 Cloudtype 주소로 직접 호출한다. 오리진 비밀 헤더와 배치 토큰을 함께 보낸다
      - name: 수집 시작 요청
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          ADMIN_BATCH_TOKEN: ${{ secrets.ADMIN_BATCH_TOKEN }}
          # 수동 실행은 입력값, 예약 실행은 WEEKLY cron이면 WEEKLY, 그 밖(DAILY cron)은 DAILY
          TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || (github.event.schedule == '17 18 * * 2' && 'WEEKLY' || 'DAILY') }}
        run: |
          set -u
          # 오리진 비밀 헤더와 배치 토큰이 평문으로 나가지 않도록 https 주소가 아니면 중단한다
          case "${BACKEND_BASE_URL}" in
            https://*) ;;
            *)
              echo "BACKEND_BASE_URL은 https:// 로 시작하는 주소여야 합니다."
              exit 1
              ;;
          esac
          # tier는 고정 목록 값만 허용한다
          case "${TIER}" in
            ALL|DAILY|WEEKLY) ;;
            *)
              echo "알 수 없는 tier입니다: ${TIER}"
              exit 1
              ;;
          esac
          echo "수집 tier: ${TIER}"
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --max-time 60 \
            --request POST "${BACKEND_BASE_URL}/api/admin/collect/executions" \
            --header "x-origin-secret: ${ORIGIN_SECRET}" \
            --header "Authorization: Bearer ${ADMIN_BATCH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"tier\":\"${TIER}\"}")
          echo "응답 상태: ${status}"
          cat response.json
          echo
          # 2. 202(접수)와 409(이미 실행 중·완료)는 성공으로 본다. 그 외는 실패로 알린다
          if [ "${status}" = "202" ] || [ "${status}" = "409" ]; then
            exit 0
          fi
          echo "수집 시작 요청이 실패했습니다(상태 ${status})."
          exit 1
