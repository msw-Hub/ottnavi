name: backend-ci

# develop·main 대상 PR과 두 브랜치 push에서 백엔드 빌드·테스트 실행
# 경로 필터는 쓰지 않는다(필수 상태 검사가 보고되지 않아 PR이 막히는 것을 피함)
#
# 구조: 예전에는 job 하나가 `./gradlew build`를 순서대로 돌려 약 400초가 걸렸다.
# 지금은 아래 3종 job으로 쪼개 병렬로 돌린다. 테스트는 하나도 건너뛰지 않는다.
#   1. backend-build         : `./gradlew build -x test`. 컴파일·bootJar·check의 비테스트 항목을 맡는다(테스트는 아래 묶음이 맡음).
#   2. backend-test (묶음)   : matrix 3개. 테스트 클래스를 패키지 기준으로 3묶음에 나눠 각자 러너에서 `test --tests ...`를 돌린다.
#   3. backend-ci            : 위 job의 결과를 모아 하나라도 success가 아니면 실패한다(집계 job).
#
# 필수 상태 검사 이름이 `backend-ci`인 이유: 보호 규칙(ruleset protect-main-develop)이 이 이름의 검사를 요구한다.
# 쪼갠 job에 다른 이름을 붙이고 집계 job만 `backend-ci`로 두면, 보호 규칙을 고치지 않고도
# "모든 조각이 통과해야 병합 가능"이 유지된다. 이 job의 name을 바꾸면 PR이 병합 막힌다.
#
# 묶음 나누기: 아래 `shard_of` 함수 한 곳이 클래스마다 묶음 하나를 돌려준다.
# 명시한 패키지 외에는 모두 `rest`로 가므로 새 패키지·새 클래스가 생겨도 누락되거나 중복되지 않는다.
# (Gradle `--tests`에는 부정 패턴이 없어 "나머지 전부"를 패턴만으로는 쓸 수 없기 때문에 클래스 목록을 직접 만든다.)
# 시간 배분 근거: 패키지별 테스트 시간을 측정해(합 약 300초) 묶음당 약 100초가 되게 나눴다.
#   collect 묶음: collect(수집 Job) + notification + infra          약 100초
#   admin 묶음  : admin + plan + llmdraft + home                     약 104초
#   rest 묶음   : 위에 없는 전부(global·engine·user·catalog 등)      약 96초
# 포트: GreenMail은 고정 포트 3025를 쓰지만 같은 묶음 안에서는 순차 실행이고 묶음끼리는 러너가 달라 충돌하지 않는다.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 PR·브랜치에서 푸시가 연달아 오면 이전 실행을 취소해 낭비를 줄인다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 테스트를 뺀 나머지 빌드(컴파일·bootJar·check의 다른 항목). 예전 `build`가 하던 일을 빠뜨리지 않기 위한 job
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # 이후 단계에서 git push를 하지 않으므로 토큰을 .git에 남기지 않는다
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 래퍼·의존성 캐시
      - uses: gradle/actions/setup-gradle@v4

      # 윈도우에서 커밋된 래퍼의 실행 권한 보정
      - run: chmod +x gradlew

      # build에서 test만 뺀다. 나중에 check에 다른 검사가 붙어도 여기서 함께 돈다
      - run: ./gradlew build -x test

  # 2. 테스트 묶음. fail-fast를 꺼서 한 묶음이 실패해도 나머지 결과를 끝까지 본다
  backend-test:
    name: backend-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [collect, admin, rest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # 이 묶음에 속한 테스트 클래스만 모아 실행한다. Testcontainers는 러너에 설치된 Docker를 그대로 사용한다
      - name: 테스트 묶음 실행
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          # 1. 클래스가 속할 묶음을 정한다. 명시하지 않은 패키지는 모두 rest로 간다
          shard_of() {
            case "$1" in
              com.ottnavi.collect.*|com.ottnavi.notification.*|com.ottnavi.infra.*) echo collect ;;
              com.ottnavi.admin.*|com.ottnavi.plan.*|com.ottnavi.llmdraft.*|com.ottnavi.home.*) echo admin ;;
              *) echo rest ;;
            esac
          }

          # 2. @Test 등이 있는 파일을 전부 찾아 FQN(패키지 포함 클래스 이름)으로 바꾼다.
          #    추상 지원 클래스(*Support)는 @Test가 없어 제외된다
          classes=$(grep -rlE '@(Test|ParameterizedTest|RepeatedTest|TestFactory|TestTemplate)\b' src/test/java \
            | sed -e 's#^src/test/java/##' -e 's#\.java$##' -e 's#/#.#g' | sort)

          # 3. 이 묶음의 클래스만 --tests 인자로 만든다
          args=()
          count=0
          for fqn in $classes; do
            if [ "$(shard_of "$fqn")" = "$SHARD" ]; then
              args+=(--tests "$fqn")
              count=$((count + 1))
            fi
          done

          # 4. 클래스가 하나도 없으면 Gradle이 모든 테스트를 돌리거나 실패하므로 여기서 멈춘다
          if [ "$count" -eq 0 ]; then
            echo "::error::묶음 '$SHARD'에 속한 테스트 클래스가 없다. shard_of 패턴을 확인해야 한다"
            exit 1
          fi
          echo "묶음 '$SHARD': 테스트 클래스 ${count}개 실행"

          # 5. 컴파일은 묶음마다 반복되지만 병렬이라 전체 시간에는 영향이 작다
          ./gradlew test "${args[@]}"

  # 3. 집계 job. 보호 규칙의 필수 상태 검사 이름이 이 job의 이름(backend-ci)이다
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    needs: [backend-build, backend-test]
    # needs의 job이 실패·취소돼도 반드시 실행해야 결과가 보고된다(건너뛰면 필수 검사가 '대기'로 남는다)
    if: always()
    steps:
      - name: 모든 조각이 성공했는지 확인
        env:
          BUILD_RESULT: ${{ needs.backend-build.result }}
          TEST_RESULT: ${{ needs.backend-test.result }}
        run: |
          echo "backend-build: $BUILD_RESULT"
          echo "backend-test: $TEST_RESULT"
          # 성공이 아니면(failure·cancelled·skipped) 모두 실패로 처리한다
          if [ "$BUILD_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "::error::backend-build 또는 backend-test 묶음이 성공하지 않았다"
            exit 1
          fi
