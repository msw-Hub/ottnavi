name: retention

# 데이터 정리 Job을 시작하는 워크플로(Task 083). 정리 시작(202)만 호출한다.
# 하는 일: 마지막 수집이 5개월을 넘은 작품을 TMDB에 다시 물어 갱신하거나 삭제, 180일 지난 배치 이력과 끊긴 계산 기록 삭제.
#
# schedule은 켜 둔 상태다(Task 093). 다만 기본 브랜치(main)의 파일만 실행되므로 develop에서는 돌지 않고, develop → main 병합(Task 095) 때 켜진다.
# 병합 전에 Cloudtype Hobby 전환(R11-4, 무료 Cloudtype은 매일 아침 중지되고 HTTP 요청으로 다시 켜지지 않는다. TECH 3절),
# Cloudtype 환경 변수, GitHub 시크릿(BACKEND_BASE_URL·ORIGIN_SECRET·ADMIN_BATCH_TOKEN)이 모두 준비돼 있어야 한다. 아니면 첫 실행부터 실패한다.
# 멈추려면 schedule 줄을 다시 주석 처리하고 main에 반영한다. 수동 실행(workflow_dispatch)은 그대로 쓸 수 있다.
# 주의: 공개 저장소는 60일 동안 활동이 없으면 예약(schedule) 워크플로가 자동으로 꺼진다.
#       꺼졌다면 Actions 탭에서 다시 켜거나 커밋·수동 실행으로 되살린다.
# 주의: schedule은 기본 브랜치(main)의 워크플로 파일 기준으로 실행된다. 활성화는 main까지 반영돼야 한다.
on:
  workflow_dispatch:
  schedule:
    # UTC 기준. 매주 일요일 21:47 UTC = 월요일 KST 06:47(매일 도는 수집 18:17 UTC·재계산과 겹치지 않는 시각, 정각을 피한 분)
    - cron: '47 21 * * 0'

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 1. Vercel을 거치지 않고 Cloudtype 주소로 직접 호출한다. 오리진 비밀 헤더와 배치 토큰을 함께 보낸다
      - name: 데이터 정리 시작 요청
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          ADMIN_BATCH_TOKEN: ${{ secrets.ADMIN_BATCH_TOKEN }}
        run: |
          set -u
          # 오리진 비밀 헤더와 배치 토큰이 평문으로 나가지 않도록 https 주소가 아니면 중단한다
          case "${BACKEND_BASE_URL}" in
            https://*) ;;
            *)
              echo "BACKEND_BASE_URL은 https:// 로 시작하는 주소여야 합니다."
              exit 1
              ;;
          esac
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --max-time 60 \
            --request POST "${BACKEND_BASE_URL}/api/admin/retention/executions" \
            --header "x-origin-secret: ${ORIGIN_SECRET}" \
            --header "Authorization: Bearer ${ADMIN_BATCH_TOKEN}")
          echo "응답 상태: ${status}"
          cat response.json
          echo
          # 2. 202(접수)와 409(수집·재계산·정리가 이미 실행 중)는 성공으로 본다. 그 외는 실패로 알린다
          if [ "${status}" = "202" ] || [ "${status}" = "409" ]; then
            exit 0
          fi
          echo "데이터 정리 시작 요청이 실패했습니다(상태 ${status})."
          exit 1
