name: frontend-ci

# develop·main 대상 PR과 두 브랜치 push에서 프론트 검증 실행
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 PR·브랜치에서 푸시가 연달아 오면 이전 실행을 취소해 낭비를 줄인다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # package.json engines(^20.19.0 || >=22.12.0)를 만족하는 LTS 고정
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      # main 대상 PR에서만: 운영 배포 전 백엔드 주소 자리표시값이 남아 있으면 실패(Task 021 이중 안전장치)
      - name: REPLACE_BACKEND_HOST 잔존 검사
        if: github.base_ref == 'main'
        run: |
          if grep -q 'REPLACE_BACKEND_HOST' vercel.json; then
            echo "::error file=frontend/vercel.json::REPLACE_BACKEND_HOST를 실제 백엔드 주소로 교체해야 main에 병합할 수 있습니다."
            exit 1
          fi
