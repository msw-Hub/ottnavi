# CodeRabbit 설정. 편집기 자동완성을 위한 스키마 지정
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR" # 리뷰 코멘트를 한국어로 작성한다

reviews:
  # 리뷰 시간을 줄이기 위한 설정(2026-10-15). 사소한 지적·부가 산출물을 끈다
  profile: "chill" # 사소한 지적을 덜 낸다
  poem: false # 시 생성 안 함
  in_progress_fortune: false # 진행 중 문구 안 함
  sequence_diagrams: false # 흐름도 생성 안 함
  finishing_touches:
    docstrings:
      enabled: false # Docstring 생성 기능을 끈다(이 프로젝트는 쓰지 않는다)
  # 도구가 만들거나 원본 그대로 두는 파일은 리뷰하지 않는다. 직접 고치지 않는 파일이라 지적이 의미 없고,
  # 리뷰 분량만 늘려 정작 중요한 코드의 지적이 묻힌다. (package-lock.json은 코드래빗이 기본으로 제외한다)
  path_filters:
    - "!frontend/src/api/generated/**" # orval 생성물(재생성하면 덮어써진다)
    - "!frontend/public/mockServiceWorker.js" # MSW CLI가 생성·갱신
    - "!backend/gradle/wrapper/**" # Gradle 래퍼(jar·properties)
    - "!backend/gradlew" # Gradle 래퍼 스크립트
    - "!backend/gradlew.bat"
    # 큰 설명·기록 문서는 리뷰하지 않는다(직접 점검하고, 계약 docs/api/openapi.yaml은 리뷰 대상으로 둔다)
    - "!docs/ROADMAP.md"
    - "!docs/HANDOFF.md"
    - "!docs/guides/**"
  # 경로별 검토 지침(2026-10-19). 사람이 정한 규칙(.claude/rules/*.md, CLAUDE.md)의 핵심만 짧게 옮겼다.
  # pr-reviewer 에이전트(.claude/agents/pr-reviewer.md)도 이 목록을 읽어 같은 기준으로 검토한다. 기준을 바꿀 때는 이 파일 한 곳만 고친다.
  path_instructions:
    - path: "backend/src/main/java/**/controller/**"
      instructions: |
        - 경로는 /api/public/**(비로그인), /api/**(로그인), /api/admin/**(ADMIN) 중 하나이고 소문자 kebab-case 복수형 명사다. 주소에 동사를 쓰지 않고, 본인 데이터는 userId를 받지 않고 /api/me/**로 둔다.
        - 예외는 컨트롤러에서 잡지 않고 GlobalExceptionHandler에 맡긴다. 성공만 CommonResponse로 감싸고 본문 없는 성공은 204(래퍼 없음)다.
        - 요청 파라미터 검증(page 0 이상, size 1~100 등)과 응답 필드명이 docs/api/openapi.yaml과 같은지 본다.
    - path: "backend/src/main/java/**/service/**"
      instructions: |
        - 클래스에 @Transactional(readOnly = true)를 기본으로 두고 쓰기 메서드만 개별 @Transactional이다. 같은 클래스 안 호출은 프록시를 거치지 않는다.
        - 외부 호출(TMDB, 메일, LLM)과 Redis 쓰기는 트랜잭션 안에서 하지 않는다(수집 배치만 예외).
        - 다른 도메인의 리포지토리를 직접 쓰지 않고 그 도메인의 서비스를 호출한다. 서비스 메서드마다 try/catch로 실패 지표를 세지 않는다.
        - 사용자 소유 행을 새로 넣는 쓰기 경로는 사용자 행을 잠근다(UserQueryService.lockUser). 탈퇴와 겹쳐도 고아 행이 생기면 안 된다.
        - 로그 심각도를 구분한다: info(정상) / warn(예상 가능한 실패) / error(예외, 스택 포함).
    - path: "backend/src/main/java/**/domain/entity/**"
      instructions: |
        - Setter를 열지 않고 상태 변경은 도메인 메서드로만 한다. 기본 생성자는 protected, 생성은 정적 팩토리 create(...)다.
        - enum은 EnumType.STRING, 연관은 단방향 LAZY, NUMERIC은 BigDecimal이다. DB DEFAULT는 Hibernate가 INSERT에 쓰지 않으니 create가 직접 채운다.
    - path: "backend/src/main/java/**/{domain/rule,engine}/**"
      instructions: |
        - 순수 Java다. Spring 어노테이션·Lombok 외의 프레임워크 의존을 넣지 않고 DB·TMDB를 부르지 않는다(engine은 다른 패키지도 참조하지 않는다). rule 클래스 위에 "이런 입력 → 이런 출력" 예시 Javadoc이 있는지 본다.
        - 판정·계산 규칙은 PRD의 어느 규칙인지 주석이 있고, 경계값과 정답이 알려진 테스트가 있는지 본다.
    - path: "backend/src/main/java/**/dto/**"
      instructions: |
        - Request·Response는 record다. Request는 Bean Validation에 한국어 메시지를 붙이고, Response 필드명은 계약과 정확히 같다.
        - TMDB 응답 DTO는 infra/tmdb 안에만 둔다.
    - path: "backend/src/main/resources/db/migration/**"
      instructions: |
        - 이미 병합된 마이그레이션 파일은 고치지 않고 새 버전을 추가한다. 버전 번호가 다른 PR과 겹치지 않는지 본다.
        - FK의 ON DELETE 동작(CASCADE·SET NULL), NOT NULL, 인덱스·유니크 제약이 ERD(docs/ERD.md)와 같고 PostgreSQL에서 동작하는지 본다.
    - path: "docs/api/**"
      instructions: |
        - path 키는 /api를 뺀 상대 경로다. operationId는 camelCase "동사 + 대상"이고 한 번 정하면 바꾸지 않는다. tags는 도메인 단위다.
        - 성공 응답은 CommonResponseXxx 래퍼(204는 없음), 오류는 application/problem+json이다. 각 operation 설명에 발생 가능한 errorCode를 적고, 모든 응답 스키마에 현실적인 example이 있다.
        - 페이지 응답은 content·page·size·totalElements·totalPages 5개 고정 필드다. 날짜는 YYYY-MM-DD, 금액은 원 단위 정수, boolean은 is/has 접두사, 이미지는 TMDB 상대 경로다.
        - 새 오류 코드는 error-codes.md 표, 백엔드 ErrorCode, 프론트 lib/errorMessages.ts 세 곳이 문구까지 같아야 한다. 구현이 끝난 operation에는 x-planned가 남아 있으면 안 된다.
        - 호환을 깨는 변경(필드 삭제·이름·타입 변경, 필수값 추가, 경로 변경)은 PR 설명에 영향 범위가 적혀 있는지 본다.
    - path: "backend/src/test/**"
      instructions: |
        - 테스트 메서드 이름은 무엇을 확인하는지 한국어 문장이고, 본문은 given/when/then으로 나누며 한 테스트는 한 가지 사실만 확인한다.
        - H2를 쓰지 않는다(Testcontainers PostgreSQL·Redis). TMDB는 WireMock이고, 빈 목킹은 @MockitoBean이다.
        - 동시성·캐시·예외 폴백 테스트는 단언이 의도를 실제로 검증하는지 본다(잠금이나 폴백을 빼도 통과하는 약한 단언이면 지적).
    - path: "frontend/src/**"
      instructions: |
        - 기능 폴더(features/*)끼리 import하지 않는다. 공유가 필요하면 상위(hooks, components/common, lib)로 올린다. pages는 얇게 유지한다.
        - 서버 상태는 TanStack Query, Zustand는 인증만 쓴다. 생성 훅 감싸기에서 select로 CommonResponse 래퍼를 벗기고, src/api/generated는 직접 고치지 않는다.
        - 색·글꼴·간격은 src/styles 토큰만 쓴다. 제공 상태(있음·없음·모름)는 색만으로 구분하지 않고 모양·텍스트도 쓴다. 제공처가 보이는 화면은 JustWatch 출처를 둔다.
        - 데이터를 보여주는 화면은 로딩·오류·빈 상태를 모두 만든다. UI 문자열은 한국어이고, 리스트 key는 인덱스가 아닌 고유 식별자다.
    - path: "frontend/src/{api/http.ts,stores/**,app/**}"
      instructions: |
        - 인증 코드다. Access Token은 메모리(Zustand)에만 두고 localStorage·sessionStorage·쿠키에 저장하지 않는다. URL 파라미터로 토큰을 주고받지 않는다.
        - 401은 재발급을 한 번만 시도하고 동시 요청의 재발급은 하나로 묶는다. 보안상 이유가 주석에 있는지 본다.
    - path: ".github/workflows/**"
      instructions: |
        - 비밀 값은 secrets로만 쓰고 파일·로그에 남기지 않는다. 수집·재계산·정리·인기 수집 cron은 서로 시각이 겹치지 않아야 하고, 켜기 전까지 schedule은 주석 상태가 맞다.
  auto_review:
    # 기본값은 기본 브랜치(main) 대상 PR만 자동 리뷰한다. 이 프로젝트는 PR이 develop으로 가므로 추가한다
    # (main은 기본 브랜치라 항상 포함되어 따로 적지 않는다)
    base_branches:
      - "develop"
